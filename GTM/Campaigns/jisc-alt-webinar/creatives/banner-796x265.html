<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Banner Jisc ALT webinar 796x265</title>
<style>
  @font-face{font-family:"League Spartan";font-weight:700;src:url("../../../../Design/Merk/fonts/LeagueSpartan-Bold.ttf")}
  @font-face{font-family:"Inter";font-weight:100 900;src:url("../../../../Design/Merk/fonts/Inter-Regular.ttf")}
  :root{
    --navy:#002333; --green:#00e075; --white:#fff;
    --soft:rgba(255,255,255,.62); --line:rgba(255,255,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:796px;height:265px;background:var(--navy);overflow:hidden}
  .banner{width:796px;height:265px;background:var(--navy);color:var(--white);
    font-family:Inter,sans-serif;position:relative;padding:32px}
  .logo{display:block;height:28px;width:auto}
  .main{position:absolute;left:32px;top:88px;width:468px}
  h1{font-family:"League Spartan",sans-serif;font-weight:700;font-size:42px;line-height:1.05;
     letter-spacing:-.02em;text-wrap:balance}
  h1 .hl{color:var(--green)}
  .who{position:absolute;left:32px;bottom:32px;font-size:14px;line-height:1.4;color:var(--soft)}
  .split{position:absolute;left:520px;top:32px;bottom:32px;width:244px;padding-left:32px;
     border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
  .split p{font-size:14px;line-height:1.4;color:var(--soft)}
  .split ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  .split li{font-family:"League Spartan",sans-serif;font-weight:700;font-size:22px;line-height:1.05;letter-spacing:-.015em}
</style></head>
<body>
<div class="banner">
  <img class="logo" src="logo_white_crop.png" alt="Eduface">
  <div class="main"><h1>The <span class="hl">business outcomes</span> of AI marking and feedback</h1></div>
  <div class="who">Webinar with Jisc and ALT</div>
  <div class="split">
    <p>Two breakout rooms</p>
    <ul><li>Consistency</li><li>Operational efficiency</li></ul>
  </div>
</div>
</body></html>
