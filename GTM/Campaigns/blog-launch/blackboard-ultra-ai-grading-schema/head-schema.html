      "@type": "Question",
      "name": "Does Blackboard Ultra have AI grading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, not in the Anthology documentation we read on October 19, 2026. Blackboard's AI generates course content and rubrics, and the AVA feedback options summarize or rewrite feedback from the rubric levels and comments you entered. None proposes a grade or a rubric rating for a submission. Anthology says it has \"intentionally omitted potentially high-stakes functionalities\" from these feedback tools."
      }
    },
    {
      "@type": "Question",
      "name": "Is Blackboard AI free?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not all of it. AVA, which includes the Summarize and Rewrite feedback options, was free for current customers through June 30, 2026 and has needed a specific license since July 1, 2026. The pages we read do not say the AI Design Assistant needs that license, but we found no price or contract terms, so confirm with your Anthology account representative."
      }
    },
    {
      "@type": "Question",
      "name": "Can the Blackboard AI Design Assistant generate a rubric?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. If your institution has turned the AI Design Assistant on, you can generate a rubric from the Course Rubrics page by describing it, choosing the type (percentage, percentage range, points, point range or no points), setting the size and selecting Generate. Anthology tells you to review each cell for accuracy before saving."
      }
    },
    {
      "@type": "Question",
      "name": "Does Blackboard use student data to train its AI?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, according to Anthology. Its transparency notes say Microsoft contractually commits not to use input or output of the Azure OpenAI Service to retrain the models, and that Blackboard does not fine-tune the models with client data. Microsoft stores prompts and output for up to 30 days for content filtering, and the primary instance is hosted in the United States."
      }
    },
    {
      "@type": "Question",
      "name": "Can we use AVA and Eduface in the same Blackboard course?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, split by job. AVA Summarize or Rewrite can polish comments on assignments an instructor grades by hand, and Eduface can handle the major paper or exam through LTI 1.3, with the approved grade returning to the Blackboard gradebook. Agree in advance which tool handles which assessment so students see one consistent process."
      }
    },
    {
      "@type": "Question",
      "name": "Does Eduface work in Blackboard Ultra Course View?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Eduface connects to Blackboard through LTI 1.3, and approved grades return to the gradebook through LTI Grade Services. Students need no separate login. The one-time setup for your administrator is covered in our guide to the AI essay grader for Blackboard."
      }
    },
    {
      "@type": "Question",
      "name": "What is Anthology adding to Blackboard AI next?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Anthology's roadmap lists AVA Formative Feedback, which lets students check their work against the rubric before submitting, plus an AVA Virtual Assistant and the Pulse Quiz, with timings from one to six months out as of September 2026. Anthology says timings are subject to change, and we found no release notes confirming that any of the three has shipped."
      }
    }
