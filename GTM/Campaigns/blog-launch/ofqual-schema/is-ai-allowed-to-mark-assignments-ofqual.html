    {
      "@type": "Question",
      "name": "Can AI mark my learners' work without a human checking it first?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Ofqual's current position is clear that AI cannot be the sole mechanism for awarding a mark. A human decision has to be part of it."
      }
    },
    {
      "@type": "Question",
      "name": "Does that mean AI has no place in marking at all?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not at all. It means AI needs to support the decision rather than make it. A tool that drafts a grade and holds it for an assessor's explicit sign off fits comfortably within the current rules."
      }
    },
    {
      "@type": "Question",
      "name": "Is the rule the same everywhere, for every qualification?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The principle that human judgement must be involved comes from Ofqual and applies broadly. Individual awarding organisations can add their own specific guidance on top, and not all have done so yet, so it's worth checking directly rather than guessing."
      }
    },
    {
      "@type": "Question",
      "name": "What's the one question worth asking a vendor before anything else?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "How, specifically, does a grade move from the AI's output to being final. If there's any path where that can happen without an assessor's explicit approval, treat that as a compliance risk."
      }
    }
  ]
