<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:900px}
  body{display:flex;align-items:center;justify-content:center}
  svg{display:block}
</style></head>
<body>
<!-- Accuracy in flat-icon style (light bg, navy outlines, green fills, rounded) -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .nav{stroke:#002333;stroke-width:20;stroke-linejoin:round;stroke-linecap:round}
      .navt{stroke:#002333;stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f3f7f8"/>

  <!-- grounding shadow -->
  <ellipse cx="600" cy="742" rx="262" ry="40" fill="#dbe6ea"/>

  <!-- target (flat, concentric) -->
  <circle cx="600" cy="452" r="250" fill="#ffffff" class="nav"/>
  <circle cx="600" cy="452" r="186" fill="#00d563"/>
  <circle cx="600" cy="452" r="124" fill="#ffffff"/>
  <circle cx="600" cy="452" r="62"  fill="#00d563"/>
  <circle cx="600" cy="452" r="18"  fill="#002333"/>

  <!-- dart hitting the bullseye, all corners rounded -->
  <g transform="rotate(40 600 452)">
    <!-- shaft -->
    <rect x="590" y="150" width="20" height="302" rx="10" fill="#002333"/>
    <!-- fletching: rounded green chevrons with navy outline -->
    <path d="M600 150 L552 96 L600 124 Z" fill="#00d563" class="navt"/>
    <path d="M600 150 L648 96 L600 124 Z" fill="#00d563" class="navt"/>
    <!-- rounded tip -->
    <path d="M590 452 Q600 446 610 452 L603 492 Q600 500 597 492 Z" fill="#ffffff" class="navt"/>
  </g>
</svg>
</body></html>
