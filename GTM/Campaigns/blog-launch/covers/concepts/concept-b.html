<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002333; --green:#00e075; --green-deep:#007b54;
    --ink-500:#5b7480; --ink-200:#cdd9de; --ink-100:#e7eef0; --ink-50:#f3f7f8; --white:#fff;
    --font-display:"League Spartan",sans-serif; --font-sans:"Inter",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  .cover{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:var(--ink-50); color:var(--navy);
    font-family:var(--font-sans); display:flex; align-items:stretch;
  }
  .left{padding:72px 0 64px 80px; display:flex; flex-direction:column; justify-content:space-between; width:640px}
  .eyebrow{
    font-size:17px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--green-deep); display:flex; align-items:center; gap:12px;
  }
  .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
  .headline{
    font-family:var(--font-display); font-weight:700; font-size:74px; line-height:1.0; letter-spacing:-.02em;
    max-width:560px;
  }
  .footer{display:flex; align-items:center; gap:18px}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.01em;color:var(--navy)}
  .pill{font-size:15px;font-weight:500;color:var(--ink-500);border:1px solid var(--ink-200);border-radius:9999px;padding:8px 18px}
  /* right motif panel: a stylized "marked paper + gauge" */
  .right{flex:1; position:relative; display:flex; align-items:center; justify-content:center}
  .right::before{content:"";position:absolute;inset:0;background:
     radial-gradient(120% 90% at 80% 20%, rgba(0,224,117,.10), transparent 60%);}
  .card{
    width:360px;height:430px;background:var(--white);border-radius:20px;
    box-shadow:0 12px 40px rgba(0,35,51,.12); position:relative; transform:rotate(3deg);
    padding:34px 30px; overflow:hidden;
  }
  .card .line{height:13px;border-radius:7px;background:var(--ink-100);margin-bottom:16px}
  .card .line.s{width:62%}
  .card .line.hl{background:rgba(0,224,117,.28);width:80%}
  .check{position:absolute;right:-26px;bottom:120px;width:96px;height:96px;border-radius:50%;
     background:var(--green);display:flex;align-items:center;justify-content:center;
     box-shadow:0 10px 28px rgba(0,224,117,.4)}
  .gauge{position:absolute;left:-46px;bottom:-46px}
  .gnum{position:absolute;left:6px;bottom:46px;font-family:var(--font-display);font-weight:700;
     font-size:34px;color:var(--navy)}
</style>
</head>
<body>
  <div class="cover">
    <div class="left">
      <div class="eyebrow"><span class="dot"></span>Eduface · Assessment</div>
      <h1 class="headline">How accurate is AI marking, really?</h1>
      <div class="footer">
        <div class="wordmark">eduface.</div>
        <div class="pill">6 min read</div>
      </div>
    </div>
    <div class="right">
      <div class="card">
        <div class="line"></div>
        <div class="line s"></div>
        <div class="line hl"></div>
        <div class="line"></div>
        <div class="line s"></div>
        <div class="line"></div>
        <div class="line hl" style="width:46%"></div>
        <div class="line s"></div>
        <div class="check">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M14 25 l7 8 l14 -19" stroke="#002333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <svg class="gauge" width="150" height="150" viewBox="0 0 150 150" fill="none">
          <circle cx="75" cy="75" r="58" stroke="#e7eef0" stroke-width="14"/>
          <circle cx="75" cy="75" r="58" stroke="#00e075" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="364" stroke-dashoffset="18" transform="rotate(-90 75 75)"/>
        </svg>
        <div class="gnum">95%</div>
      </div>
    </div>
  </div>
</body>
</html>
