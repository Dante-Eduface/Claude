  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is competency-based assessment the same as competency-based education?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Competency-based education is the whole program design: curriculum, pacing, support and assessment. Competency-based assessment is the assessment part, and it can also run inside a term-based program that keeps credit hours."
      }
    },
    {
      "@type": "Question",
      "name": "Can a multiple-choice test count as competency-based assessment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, for the knowledge a competency rests on. The AIR and C-BEN framework lists selected-response and multiple-choice assessment as one option for summative assessment, next to projects, performance tasks and papers. Competencies about doing something also need performance evidence."
      }
    },
    {
      "@type": "Question",
      "name": "How many attempts should students get per competency?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "That is a program decision with no single right answer. The AIR framework describes three options: unrestricted attempts, attempts with restrictions such as delays or revisiting material, and no reattempts without restarting the competency. Whatever you choose, budget evaluator time for it."
      }
    },
    {
      "@type": "Question",
      "name": "Do competency-based programs need accreditor approval in the US?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Direct assessment programs do. Under 34 CFR 668.10, the accrediting agency must evaluate the program and approve the institution's claim of how each module equates to credit or clock hours. Competency-based courses inside a credit-hour program follow your accreditor's normal rules, so check with your accreditor before you change how competencies are reported."
      }
    },
    {
      "@type": "Question",
      "name": "Can AI decide whether a student is competent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. AI can draft a level and feedback per criterion on written evidence. The competent or not-yet decision is a judgment your institution stands behind, so it belongs to a named evaluator. In Eduface, no grade reaches the LMS gradebook until the evaluator approves it."
      }
    }
  ]
}
