    {
      "@type": "Question",
      "name": "Why is grading a business case study harder for AI than grading a standard essay?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because a case study is what's known in instructional design research as an ill-structured problem, with multiple defensible answers rather than one correct one. Grading well means assessing the quality of strategic judgement, not checking against a known answer, which is a fundamentally harder task than evaluating argument structure alone."
      }
    },
    {
      "@type": "Question",
      "name": "Can a case study response be well written but still get a weak grade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and it should, if the underlying strategic reasoning is weak. Confident, clear writing that rests on a recommendation the case data doesn't actually support is a common failure mode that criteria specifically testing strategic judgement are designed to catch."
      }
    },
    {
      "@type": "Question",
      "name": "What should we ask an AI grading vendor specifically about case study assessment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Whether the tool checks that a recommendation is genuinely supported by the case data, whether it evaluates engagement with trade-offs and counter-arguments, and whether the underlying model has real exposure to business and management case material rather than being general essay grading applied to a different format."
      }
    },
