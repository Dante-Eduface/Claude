      "name": "Can I use more than one rubric on a Blackboard Ultra assignment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Anthology's help pages say only one rubric can be associated with each item. If you need two sets of criteria, combine them into one rubric with more rows, or use a separate assignment for the second set.³ ⁴"
      }
    },
    {
      "@type": "Question",
      "name": "Can I edit a rubric after I have graded with it in Blackboard Ultra?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, not the original. After you use a rubric for grading, you can make a copy and edit the copy. Grades calculated with the original rubric are preserved but converted to overrides, and you can regrade those submissions with the new rubric.⁵"
      }
    },
    {
      "@type": "Question",
      "name": "Can I import a rubric into Blackboard Ultra from Word or Excel?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not through a documented import. The only import accepts a zip file previously exported from Blackboard LMS, and it rejects a rubric that already exists in the course. Rubric cells accept pasted plain text, so you can paste descriptors from a document, but the formatting does not carry over.³ ⁵"
      }
    },
    {
      "@type": "Question",
      "name": "Does Blackboard Ultra have an AI rubric generator?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, if your institution has turned on the AI Design Assistant. You enter a description, choose the type, complexity, rows and columns, select Generate, then review each cell and select Continue to save. Anthology does not state in the pages we read what rubric generation costs after the June 30, 2026 end of the AVA trial, so check with your administrator.³ ¹³ ¹⁵"
      }
    },
    {
      "@type": "Question",
      "name": "Can students see the rubric in Blackboard Ultra?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Students can view the rubric before they open an assignment or discussion and after they start, by selecting \"This item is graded with a rubric\" in the Details & Information section. After you post grades, they see their awarded levels highlighted.¹ ⁶"
      }
    },
    {
      "@type": "Question",
      "name": "Can I use a rubric on a Blackboard Ultra test?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Anthology says you can only associate rubrics with assignments, discussions and journals, and you cannot associate a rubric with an assignment that has questions. For tests, use the question scoring.¹ ⁶"
      }
    },
