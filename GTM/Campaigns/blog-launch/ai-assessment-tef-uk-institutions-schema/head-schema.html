        "@type": "Answer",

    {
      "@type": "Question",
      "name": "Does the TEF apply to private providers, or only traditional universities?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It has expanded to include further education colleges and private providers in recent years, not just traditional universities, which broadens who has a direct stake in it."
      }
    },

      "@type": "Question",
      "name": "Why does assessment and feedback specifically matter for TEF, not just NSS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because assessment and feedback feeds into the student experience metrics that inform TEF, and a revised framework that separates experience from outcomes means a weak experience score is less likely to be offset by a strong outcomes profile than it may have been in the past."
      }
    },
