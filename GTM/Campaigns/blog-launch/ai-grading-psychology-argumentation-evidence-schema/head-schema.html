      "name": "What is the most common substantive weakness in psychology essays that generic grading misses?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Treating correlational evidence as though it supports a causal conclusion. This is a specific empirical reasoning error that generic writing-quality grading will not reliably catch."
      }
    },

      "@type": "Question",
      "name": "Why does sample size and study design matter for grading, not just for methods classes?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because a strong psychology essay is expected to weigh cited evidence according to its actual strength, not treat all citations as equally supportive. Testing for this explicitly in grading criteria catches a common and meaningful gap."
      }
