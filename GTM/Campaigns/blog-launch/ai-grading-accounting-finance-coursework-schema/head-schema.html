    {
      "@type": "Question",
      "name": "Is accounting coursework easier to grade with AI because the numbers are checkable?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The numerical component is genuinely easier to check mechanically, but most accounting assignments beyond an introductory level also require a written justification, and that narrative component needs the same kind of substantive evaluation a case study or essay requires."
      }
    },
    {
      "@type": "Question",
      "name": "What's the biggest grading mistake in accounting and finance coursework specifically?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Awarding marks primarily for a correct final figure while checking the accompanying explanation only loosely. Research into accounting education has consistently found that communication and professional judgement, not raw computation, are where graduates actually fall short."
      }
    },
    {
      "@type": "Question",
      "name": "Should the numerical and narrative parts of an assignment be graded separately?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. They can fail independently of each other, a correct number with a weak justification, or a sound justification with a computational slip, and treating them as one blended score obscures which actual skill needs improvement."
      }
    },
    {
      "@type": "Question",
      "name": "Is this a new problem created by AI grading, or an existing one?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An existing one. The gap between technical accounting skill and communication or professional judgement has been documented in accounting education research since well before AI grading existed, and grading tools need to be specifically designed not to reproduce it."
      }
    }
  ]
