      "@type": "Question",
      "name": "Is it a FERPA problem to paste student essays into ChatGPT?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It can be, and your college decides. FERPA's school official exception requires, among other conditions, that an outside party is under the college's direct control for the use and maintenance of education records. A personal ChatGPT account has no agreement with your college; ask your registrar or privacy office which plan, if any, is approved."
      }

        "text": "No, not by default, according to OpenAI. OpenAI states that it does not use data from ChatGPT Edu, Enterprise, Business or its API for training by default. Training is on by default for personal Free, Plus and Pro accounts unless the user turns it off."
