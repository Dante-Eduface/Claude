    {
      "@type": "Question",
      "name": "Why isn't a correct final answer enough to grade a clinical case study well?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the reasoning process leading to that answer, whether the student noticed the right clinical cues and interpreted them correctly, is what is actually being tested. A correct answer reached through flawed reasoning is a genuine assessment failure, not a pass."
      }
    },
    {
      "@type": "Question",
      "name": "What does Tanner's Clinical Judgment Model add to how these case studies should be graded?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It breaks clinical reasoning into noticing, interpreting, responding, and reflecting, which gives grading criteria a structure to test against, rather than a single holistic judgement of whether the final answer was right."
      }
    },
    {
      "@type": "Question",
      "name": "Does case study design affect how well AI grading can work here?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, significantly. A case that only asks for a final action gives little reasoning trail to assess. A case that asks students to state what they noticed and why before stating an action is both better pedagogy and easier to grade meaningfully."
      }
    },
    {
      "@type": "Question",
      "name": "Should human review be lighter or heavier for clinical case studies compared to other subjects?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Heavier, if anything. The consequence of a subtly flawed piece of clinical reasoning passing through undetected is more serious here than in most other fields, which makes genuine, substantive human review particularly important."
      }
    }
  ]
}
