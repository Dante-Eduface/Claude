<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{
    font-family:"League Spartan";
    src:url("fonts/LeagueSpartan-Bold.ttf") format("truetype");
    font-weight:700; font-style:normal;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#002333; }
  .banner{
    width:1080px; height:608px;
    background:#002333;
    position:relative; overflow:hidden;
  }
  /* subtle grid */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:64px 64px;
    pointer-events:none;
  }
  /* darken edges so the grid fades, keeps focus centre */
  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 45%, rgba(0,35,51,0) 45%, rgba(0,35,51,0.85) 100%);
    pointer-events:none;
  }
  /* soft green glow, top-right */
  .glow{
    position:absolute; top:-240px; right:-200px;
    width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,224,117,0.16) 0%, rgba(0,224,117,0.04) 42%, rgba(0,224,117,0) 70%);
    pointer-events:none;
  }
  .content{
    position:absolute; inset:0;
    padding:0 72px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .logo{
    position:absolute; top:52px; left:64px;
    width:188px; height:auto; display:block;
  }
  .headline{
    font-family:"League Spartan", system-ui, sans-serif;
    font-weight:700;
    font-size:122px;
    line-height:0.92;
    letter-spacing:-3px;
    margin-bottom:6px;
  }
  .headline .w{ color:#FFFFFF; display:block; white-space:nowrap; }
  .headline .g{ color:#3DDC84; display:block; white-space:nowrap; }
</style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="vignette"></div>
    <div class="content">
      <img class="logo" src="assets/logo_white.png" alt="Eduface">
      <h1 class="headline">
        <span class="w">AI Assessment</span>
        <span class="g">platform</span>
      </h1>
    </div>
  </div>
</body>
</html>
