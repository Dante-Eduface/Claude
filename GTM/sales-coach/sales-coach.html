<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Coach — Eduface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002333; --green:#00e075; --green-deep:#007b54;
  --ink-900:#0a2c3b; --ink-700:#2c4a57; --ink-500:#5b7480; --ink-300:#a9bcc4;
  --ink-200:#cdd9de; --ink-100:#e7eef0; --ink-50:#f3f7f8; --white:#fff;
  --bg:var(--white); --surface:var(--ink-50); --fg:var(--navy); --muted:var(--ink-500);
  --border:var(--ink-100); --border-strong:var(--ink-200); --card:var(--white);
  --success:#007b54; --warning:#b26a00; --danger:#b3261e;
  --sidebar-w:264px; --pane:20px; --radius:10px;
  --shadow-sm:0 1px 2px rgba(0,35,51,.06); --shadow-md:0 4px 16px rgba(0,35,51,.08);
}
html[data-theme=dark]{
  --bg:#001a26; --surface:#0a2c3b; --fg:#fff; --muted:#a9bcc4;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2); --card:#0a2c3b;
  --ink-50:#0a2c3b; --ink-100:rgba(255,255,255,.12); --ink-200:rgba(255,255,255,.2);
  --success:#00e075; --warning:#e0a33a; --danger:#ff6b60;
  --shadow-sm:none; --shadow-md:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"League Spartan",Inter,sans-serif;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--green);color:var(--navy)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.side{min-width:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.side-top{padding:16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-family:"League Spartan";font-weight:700;font-size:17px}
.dot-brand{width:9px;height:9px;border-radius:99px;background:var(--green)}
.nav{display:flex;gap:4px;margin-top:14px}
.nav button{flex:1;height:28px;padding:0 2px;font-size:12.5px}
.nav button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.nav button.on{background:var(--navy);color:#fff}
html[data-theme=dark] .nav button.on{background:var(--green);color:var(--navy)}
.search{margin-top:10px;width:100%;height:32px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--bg);color:var(--fg);padding:0 10px;font-size:13px}
.search:focus{outline:2px solid var(--green);outline-offset:-1px}
.side-list{overflow-y:auto;flex:1;padding:8px 8px 24px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  padding:14px 8px 5px;font-weight:600}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;
  font-size:13.5px;line-height:1.3;min-height:32px}
.item:hover{background:var(--ink-100)}
.item.on{background:var(--navy);color:#fff}
html[data-theme=dark] .item.on{background:rgba(0,224,117,.16);color:#fff}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mini{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.on .mini{color:rgba(255,255,255,.7)}
.hdot{width:7px;height:7px;border-radius:99px;flex:none}
.h-ok{background:var(--success)} .h-warn{background:var(--warning)} .h-bad{background:var(--danger)}
.h-idle{background:var(--ink-300)}

.main{padding:28px 32px 96px;max-width:1080px;min-width:0;overflow-x:hidden}
.side-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center}

/* ---------- bits ---------- */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:6px}
.page-h h1{font-size:26px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;
  font-size:12px;font-weight:500;background:var(--ink-100);color:var(--fg)}
.pill.accent{background:rgba(0,224,117,.18);color:var(--green-deep)}
html[data-theme=dark] .pill.accent{color:var(--green)}
.pill.warn{background:rgba(178,106,0,.14);color:var(--warning)}
.pill.bad{background:rgba(179,38,30,.12);color:var(--danger)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pane)}
.sec{margin-top:32px}
.sec>h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2 .cnt{font-size:11px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--border-strong);
  border-radius:var(--radius)}
.mono{font-variant-numeric:tabular-nums}

/* hero: volgende actie */
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
.hero .eyebrow{color:rgba(255,255,255,.6)}
.hero h3{font-size:20px;font-weight:600;margin:6px 0 0}
.hero .meta{display:flex;gap:18px;margin-top:14px;font-size:13px;color:rgba(255,255,255,.72);flex-wrap:wrap}
.hero .why{margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.82);max-width:68ch}

.prep-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.prep-grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}}
.prep-grid h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;margin-bottom:8px}
ul.tight{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.tight li{font-size:13.5px;padding-left:14px;position:relative}
ul.tight li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:99px;
  background:var(--ink-300)}

/* meddpicc */
.medd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.medd{grid-template-columns:repeat(2,1fr)}}
.mcell{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:var(--card);
  border-top:3px solid var(--ink-200)}
.mcell.s3{border-top-color:var(--success)} .mcell.s2{border-top-color:var(--warning)}
.mcell.s1{border-top-color:var(--danger)} .mcell.s0{border-top-color:var(--ink-200)}
.mcell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mcell .st{font-size:13.5px;font-weight:600;margin-top:3px}
.mcell .bw{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.mcell .gat{font-size:12px;color:var(--danger);margin-top:6px;line-height:1.4}

/* gesprekken */
.tl{display:flex;flex-direction:column;gap:8px}
.tlrow{border:1px solid var(--border);border-radius:9px;background:var(--card);overflow:hidden}
.tlhead{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left}
.tlhead:hover{background:var(--ink-50)}
.tldate{font-size:12px;color:var(--muted);width:72px;flex:none;font-variant-numeric:tabular-nums}
.tltitle{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlbody{padding:4px 14px 16px 98px;border-top:1px solid var(--border);font-size:13.5px}
.tlbody h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;margin:16px 0 7px}
.tlbody h5:first-child{margin-top:14px}
.quote{border-left:2px solid var(--ink-200);padding:2px 0 2px 12px;margin:0 0 6px;color:var(--fg);font-style:italic}
.miss{border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:8px;
  padding:11px 13px;margin-bottom:9px;background:var(--bg)}
.miss .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.miss .beter{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border-strong);color:var(--success)}
.pre{white-space:pre-wrap;font-size:13.5px;color:var(--ink-700)}
html[data-theme=dark] .pre{color:var(--ink-300)}

/* ratio bar */
.ratio{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--ink-100);margin:6px 0 4px}
.ratio i{display:block;height:100%}
.ratio .me{background:var(--navy)} html[data-theme=dark] .ratio .me{background:var(--ink-300)}
.ratio .them{background:var(--green)}
.rl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* scores */
.scores{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.score{min-width:88px}
.score .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.bars{display:flex;gap:3px;margin-top:5px}
.bars i{width:14px;height:5px;border-radius:2px;background:var(--ink-100)}
.bars i.f{background:var(--navy)} html[data-theme=dark] .bars i.f{background:var(--green)}
.bars i.f.low{background:var(--danger)} .bars i.f.mid{background:var(--warning)}

/* tabel-achtig */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border);
  font-size:13.5px;width:100%;text-align:left}
.row:hover{background:var(--ink-50)}
.row:last-child{border-bottom:0}
.row .r-nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-why{color:var(--muted);font-size:12.5px;flex:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stakeholders */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.people{grid-template-columns:1fr}}
.person{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:var(--card)}
.person .pn{font-weight:600;font-size:13.5px}
.person .pt{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.tag{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:var(--ink-100);color:var(--ink-700)}
.tag.eb{background:var(--navy);color:#fff}
.tag.champion{background:rgba(0,224,117,.2);color:var(--green-deep)}
html[data-theme=dark] .tag.champion{color:var(--green)}
.tag.enemy{background:rgba(179,38,30,.12);color:var(--danger)}
.tag.niet{background:transparent;border:1px dashed var(--border-strong);color:var(--muted)}

/* trend */
.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.trend{grid-template-columns:1fr}}
.spark{display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:10px}
.spark i{flex:1;background:var(--ink-100);border-radius:2px 2px 0 0;min-height:3px}
.spark i.f{background:var(--navy)} html[data-theme=dark] .spark i.f{background:var(--green)}
.big{font-family:"League Spartan";font-size:30px;font-weight:700;line-height:1;margin-top:6px}
.delta{font-size:12px;font-weight:600}
.up{color:var(--success)} .down{color:var(--danger)}
.kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--border-strong);
  border-radius:4px;padding:1px 5px;color:var(--muted)}
.link{color:var(--green-deep);font-weight:500;text-decoration:none;font-size:13px}
html[data-theme=dark] .link{color:var(--green)}
.link:hover{text-decoration:underline}
/* focus */
.focus-hero{border:1px solid var(--border);border-left:4px solid var(--green);border-radius:12px;
  padding:22px 24px;background:var(--card)}
.focus-hero h2{font-size:22px;font-weight:700;margin:6px 0 0}
.focus-regel{margin-top:16px;padding:14px 16px;background:var(--ink-50);border-radius:9px;font-size:14px;font-weight:500}
.focus-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.bron{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--border);line-height:1.5}

/* zelfscore-gate */
.gate-curtain{border:1px dashed var(--border-strong);border-radius:9px;padding:16px;margin-top:14px;
  background:var(--ink-50)}
.gate-curtain .t{font-weight:600;font-size:13.5px}
.gate-curtain p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;max-width:64ch}
.btn{margin-top:12px;height:30px;padding:0 13px;border-radius:7px;background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:500}
html[data-theme=dark] .btn{background:var(--green);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border-strong)}

/* delta-tabel */
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.cmp th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;padding:0 10px 6px 0}
.cmp td{padding:6px 10px 6px 0;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.cmp td:first-child{font-weight:500}
.dl{font-weight:600;font-size:12px;padding:1px 7px;border-radius:99px;display:inline-block}
.dl.ok{background:rgba(0,224,117,.18);color:var(--green-deep)}
html[data-theme=dark] .dl.ok{color:var(--green)}
.dl.over{background:rgba(179,38,30,.12);color:var(--danger)}
.dl.onder{background:rgba(178,106,0,.14);color:var(--warning)}

/* drills */
.drill{border:1px solid var(--border);border-left:3px solid var(--green-deep);border-radius:9px;
  padding:13px 15px;margin-bottom:10px;background:var(--card)}
.drill .dt{font-weight:600;font-size:13.5px}
.drill .ds{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.drill .do{font-size:13px;margin-top:9px;padding:10px 12px;background:var(--ink-50);border-radius:7px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;line-height:1.5;white-space:pre-wrap}
.band{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}

.stat-row{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <div class="brand"><span class="dot-brand"></span>Sales Coach</div>
      <div class="nav">
        <button data-view="vandaag">Vandaag</button>

      <button id="theme" title="Licht of donker">◐</button>

  </aside>
  <main class="main" id="main"></main>
</div>

", "titel": "Eduface Innovation lab II", "duur_min": 30, "status": "completed", "deelnemers": ["a.gray2@bathspa.ac.uk", "jeroen.van.gessel@eduface.me", "s.romans-roca@bathspa.ac.uk"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_3cVRJ42Au1OHjIPieRxdL9c7hT26rV9i5K5TmE2oPZ6", "soort": "meeting", "datum": "2026-07-16", "titel": "Eduface: Blackboard demo prep discussion", "duur_min": 30, "status": "completed", "deelnemers": ["h.king@bathspa.ac.uk", "jeroen.van.gessel@eduface.me", "menno.hahury@eduface.me", "s.lewarne@bathspa.ac.uk", "s.romans-roca@bathspa.ac.uk"], "samenvatting": "- Prepared Blackboard integration demo focusing on staff efficiencies, two-way syncing with Turnitin, and multi-stakeholder workflow views (markers, moderators, module leaders, external examiners).\n- Confirmed integration works with Blackboard Ultra, Canvas, and Moodle with automatic assignment routing to both Turnitin and Eduface.\n- Emphasized critical demo requirements: human-first assessment approach, usage monitoring dashboards, moderation capabilities, and eight-year data retention for compliance.\n- Identified key adoption barriers as time pressures and learning curves, requiring demo to emphasize ease of use, reliability, and integration seamlessness.\n- Demo will be conducted in Bath Spa's environment with 10-12 participants including pilot module leaders, digital learning developers, academic IT staff, and recorded for broader sharing.\n\n### Meeting Purpose and Attendee Introductions\n- This meeting served as preparation for the formal Blackboard integration demo with Bath Spa University.\n- A note taker was included to ensure proper documentation of discussion points.\n- Jeroen van Gessel introduced himself as Eduface co-founder focusing on business operations, started almost three and a half years ago.\n- Menno presented as co-founder with technical background in software engineering and AI who built the platform with Samuel.\n- Samuel introduced himself as lead software engineer at Eduface, joining in February.\n- Helen King identified herself as Director of Learning, Innovation, Development and Skills, serving as strategic lead for the pilot project.\n- Steven Lewarne described himself as Senior Digital Learning Developer supporting academic staff.\n- Susana Romans-Roca presented as Academic Developer managing the day-to-day pilot operations.\n\n### Demo Content and Integration Requirements\n- The demo must provide evidence supporting Helen's paper to the AIPB meeting about integration benefits and efficiencies for staff.\n- Jeroen confirmed the integration works with Canvas and Moodle in addition to Blackboard Ultra and will be shown during the demo.\n- The demo should showcase automations syncing back to Blackboard and bidirectional syncs from Blackboard to Eduface to reduce setup friction.\n- Jeroen explained that when students submit assignments in Blackboard, they automatically sync to both Turnitin for originality checks and Eduface for AI feedback.\n- Susana noted that Turnitin has introduced a new Standard Assignment Tool with Blackboard integration, potentially eliminating friction by avoiding manual processes.\n- The demo should demonstrate how assignments automatically pass to Turnitin's new Standard Assignment Tool, though activation status needs verification in the test server.\n\n### Role-Based Workflow and Marking Considerations\n- **The demo must show the tool from multiple stakeholder perspectives: markers, moderators, module leaders, and external examiners.**\n- **Friction and ease of use are critical factors—any added complexity discourages staff adoption.**\n- Steven emphasized that uptime and availability build confidence in integrations, noting the successful adoption of Turnitin LTI despite its different interface.\n- Susana highlighted that staff currently perceive Turnitin as integrated with Blackboard Ultra due to its seamless functionality, even though it is a separate integration.\n- The demo should demonstrate compatibility with Blackboard Ultra's grade journeys to ensure marks sync properly without manual entry.\n- The workflow must support moderation processes where moderators can view staff submissions and module leaders can maintain oversight across multiple markers.\n\n### Data Retention and Compliance Requirements\n- **Retention policies are essential—the tool must retain all data for institutional appeals and external compliance with UK Office for Students requirements of five years post-graduation.**\n- Bath Spa retains materials for three additional years beyond the five-year requirement, totaling eight years of necessary data retention.\n- The demo should address retention mechanisms to ensure this compliance box is ticked for university adoption.\n\n### Governance and Approval Process\n- Helen's paper goes through the AIPB for input and recommendations, then to the Digital Oversight Group in August for oversight of new software proposals.\n- The Digital Oversight Group uses a prioritization matrix to determine next steps and may request additional information before approval.\n- Following the Digital Oversight Group decision, the project may progress to the University Executive Board for funding approval if needed.\n- The Executive Board meets monthly, so timing depends on when the proposal reaches that stage.\n\n### Demo Attendees and Technical Setup\n- Attendees should include module leaders from the pilot, digital learning developers, Susana, and academic IT staff for approximately 10-12 participants.\n- The demo should be conducted in Bath Spa's environment rather than Eduface's sandbox for greater authenticity.\n- Steve from Bath Spa IT will be available to navigate the Blackboard environment during the demo, with Susana and Steven as backup.\n- The demo should be recorded for reference and sharing with pilot participants who cannot attend, including possibly Kiriaki who was active in early meetings.\n- Scheduling will be handled via email coordination due to summer leave periods and multiple calendars to check.\n\n### Monitoring and Pedagogical Safeguards\n- **The demo should include dashboards and metrics showing usage data to verify that staff actively engage with the tool rather than over-relying on AI feedback.**\n- Moderators should be able to see evidence of human interaction and decision-making in the marking process.\n- **The tool must support a human-first assessment approach, ensuring educators retain active involvement in evaluation decisions.**\n- Usage monitoring allows university staff and moderators to track time spent and verify appropriate human oversight.\n\n### Formative and Summative Assessment Use Cases\n- The pilot includes two distinct use cases: modules using summative assessment and the ASK team using the tool formatively.\n- For formative student feedback, Eduface should provide a button in Blackboard allowing students to request feedback without summative grading.\n- If student-facing formative feedback integrates through Blackboard Ultra, it should be included in the demo for consistency.\n- Helen requested focusing the demo on the academic/module use case with summative assessment, then briefly mentioning the formative student-facing approach to save time.\n\n### Staff Adoption Concerns and System Pressures\n- Staff at Bath Spa are time-poor and under pressure, making steep learning curves a barrier to adoption.\n- The university continuously adds new systems, creating additional burden on staff unless clear time benefits are demonstrated.\n- Systems showing tangible time savings and reduced workload are more readily received by academic staff.\n- Staff acceptance improves when implementations feel integrated and supported rather than adding extra steps to existing workflows.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_XPUQi2w9YvHstOB9aBeVER19CR9DZgkRrOOiTuQ507k", "soort": "meeting", , "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_BM1EBRIygnD5qEB6glUt8HXYlcPFV3MhfyPMyNWRkGK", "naam": "Breda University of Applied Sciences", "url": "https://app.close.com/lead/lead_BM1EBRIygnD5qEB6glUt8HXYlcPFV3MhfyPMyNWRkGK/", "lead_status": "Prospect", "opportunity_id": null, "fase": null, "fase_type": null, "waarde": null, "valuta": "EUR", "confidence": null, "close_date": null, "eigenaar": "Eduface CRM", "crm_note": "", "contacten": [{"naam": "Erwin van Braam", "titel": "Director of Education, Research & Information Management", "email": "braam.e@buas.nl", "id": "cont_mW32wdRiOvZhKhQ32yuCcA2yOH1ZxhbBrhe9Cn3cc0t"}, {"naam": "Ines Springael", "titel": "Programme Lead CTL/AI & Researcher", "email": null, "id": "cont_lFjSVbr6ECLFGDlcAimnLO1Tsps7SAI3nQsCQzd6UxE"}, {"naam": "Tanja Beks", "titel": "Policy officer Education / Project leader Teaching And Learning With AI Europe Conference", "email": "beks.t@buas.nl", "id": "cont_EzrkdNBSw7dOzPzxtHRd1Bs5vVScnfMVEJwI1vw0XtP"}], "gesprekken": [{"id": "acti_AgAtXGp18cB27GwdsV2QfWux7nERasu5SAZEcBT6mwE", "soort": "call", "datum": "2026-03-31", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "VM ingesproken", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_VmOqCJ1CyYtIS4mcMi0t32ZcmkwS16F0z9yJhkL7ZCH", "soort": "call", "datum": "2026-03-31", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "VM ingesproken", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_M2YXStcqYHohv7zvW3s5h6v0SGRD6OTQQZYbt1eVaME", "soort": "call", "datum": "2026-03-31", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Zij heeft mij terug gebeld\nZe zij dat ik het op de mail kon zetten en dat ze terug bij mij gaat komen. Zij is de juiste persoon binnen Breda. Ze Heeft dat Compass gemaakt en is zeker voor AI.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_Qy2tpb8sV3IQQ3S2SYsVAX6oh0gIFGO96wMtsYBMGDE", "soort": "call", "datum": "2026-04-14", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Zij heeft opgenomen en stond op dat moment op Schiphol. Ze zei dat ze naar de mail gaat kijken.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_EeYkuilNzUAVqxBYWOHzwzeErkai4WfOMj3cRd1KUSH", "soort": "call", "datum": "2026-04-20", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Niet opgenomen, ook geen VM.\n\nInsteek van het belletje zou zijn dat we ook een key note mochten geven bij het NPULS comminty dag.", "transcript_beschikbaar": false, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-04-20", "volgende_afspraak": null, "aantal_gehad": 5, "gesynct": "2026-08-29 13:35"}}, {"slug": "breederode-hogeschool", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_8sVUDLRJ6YRVHVD4c0pnmZ8WIoIkku6QnUMSm6aYC8c", "naam": "Breederode Hogeschool", "url": "https://app.close.com/lead/lead_8sVUDLRJ6YRVHVD4c0pnmZ8WIoIkku6QnUMSm6aYC8c/", "lead_status": "Prospect", "opportunity_id": null, "fase": null, "fase_type": null, "waarde": null, "valuta": "EUR", "confidence": null, "close_date": null, "eigenaar": "Eduface CRM", "crm_note": "", "contacten": [{"naam": "Irma van der Velden", "titel": "Directeur", "email": null, "id": "cont_SR8TYW5ITn9IUkKkOnZmjuPPXluybjyITRav6RqedIk"}, {"naam": "Ivonne Duiser", "titel": null, "email": "i.duiser@breederode.nl", "id": "cont_AlfWwXxQGRlhmLwluTnUXyB5pJr0XsdZaLgFHhufDHn"}], "gesprekken": [{"id": "acti_W2XOK8NDwPiIfBBwTfCYQ0Ie9t38AZumnRbYfePKbCM", "soort": "call", "datum": "2026-08-06", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "VM", "transcript_beschikbaar": true, "komend": false}, {"id": "acti_ei45MpMCSBdbpxnnrOb4PPD3K0GHJGfjaWMkvKgrqaB", "soort": "meeting", "datum": "2026-09-01", "titel": "Breederode x Eduface", "duur_min": 60, "status": "upcoming", "deelnemers": ["dante.torbed@eduface.me", "i.duiser@breederode.nl", "jeroen.van.gessel@eduface.me", "m.degraaf@breederode.nl"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": true}], "open_taken": [], "laatste_gesprek": "2026-08-06", "volgende_afspraak": "2026-09-01", "aantal_gehad": 1, "gesynct": "2026-08-29 13:35"}}, {"slug": "business-school-notenboom", "coach": {"next_action": {"wat": "Vraag Barbara per mail wie er sinds de overname door Business School Nederland over een uitgave van 10k gaat, en of zij je aan die persoon voorstelt", "wanneer": "2026-09-01", "wie": "Dante", "waarom": "Je staat in Close op Scoping maar de Discovery-gate is nooit dicht: geen naam van een budgethouder, geen datum, geen bedrag dat zij kwijt zijn. Notenboom is in 2025 verkocht aan Business School Nederland, dus de oude eigenaar-route bestaat niet meer. Zonder die naam is de meeting van 22 september gesprek nummer vijf zonder beslisser."}, "prep": {"doel": "Advance: Barbara noemt de naam van de budgethouder bij Business School Nederland en zegt toe je voor te stellen. Geen naam betekent geen implementatieplan en geen pilotvoorstel.", "openers": ["Je zei dat het dit studiejaar echt moet gaan vallen, en dat de internationale uitrol de reden is. Volgende week begint het jaar. Wat moet er in september gebeuren om dat waar te maken?", "Sinds de overname door Business School Nederland, hoe loopt een uitgave van deze omvang nu?"], "vragen": ["Wie moet er behalve jij ja zeggen voor een bedrag als dit?", "Toen jullie voor het laatst een tool van deze omvang kochten, wie zat daar dan bij en hoe lang duurde het?", "Je zei dat collega's zullen vragen welk probleem we oplossen. Wat is jouw antwoord daarop als je het straks intern brengt?", "Die 1500 uur, wie is dat geld nu kwijt? Zit dat in een budget dat iemand beheert of is dat onbetaalde tijd van ZZP-docenten?", "Bij de internationale uitrol zei je dat de wens om toezicht aan te scherpen groter wordt. Wat gebeurt er als dat toezicht er niet is voordat de eerste buitenlandse groep start?", "Wie kijkt bij jullie naar AVG en AI-act voordat er getekend wordt?"], "risicos": ["Barbara is coach, geen champion. Na drie gesprekken heeft ze Eduface nog niet intern genoemd. Ze verzamelt informatie voor later.", "De 94k tijdwinst is geen echt geld: zij zei zelf dat niet alles vergoed wordt en dat docenten niet de last zijn. Blijf die cijfers gebruiken en je bouwt een business case die niemand herkent.", "Vier weken stilte tussen 21 augustus en 22 september terwijl het studiejaar start. Elke week zonder interne beweging maakt de kans groter dat het naar volgend jaar schuift.", "Budgethouder onbekend sinds de overname. Het risico is niet dat ze nee zeggen, het risico is dat er niemand is die ja kan zeggen."], "bezwaren": ["\"Het wordt pas relevant in de loop van het jaar.\" Antwoord niet met geduld. Vraag welke gebeurtenis het relevant maakt en zet daar een datum omheen.", "\"Docenten willen het voorwerk niet doen, dat uur is onbezoldigd.\" Je had hier al een goed antwoord: Eduface zet het zelf klaar. Zet dat nu op papier met een prijs, want zij vroeg daar expliciet om.", "\"Ik moet het eerst intern bespreken.\" Vraag met wie, in welk overleg, en bied aan de slides te maken die zij daar gebruikt."]}, "meddpicc": {"metrics": {"state": "CURRENT STATE", "bewijs": "Samen live doorgerekend: 175 studenten, 15 vakken per periode maal 2 periodes, 1 uur per beoordeling (zij corrigeerde je 2 uur naar 1), 60 euro per uur. 5.250 beoordelingen per jaar, 30% tijdwinst, 1.500 uur, 94k.", "gat": "Het is geen geld dat iemand kwijt is. Zij zei letterlijk dat niet alles vergoed wordt en dat de docenten niet de last zijn. Geen geschreven cost justification, niet bevestigd door een champion."}, "economic_buyer": {"state": "UNKNOWN", "bewijs": "Geen naam. Bureau Onderwijs is waar het werk zou landen, dat is geen budgethouder.", "gat": "Notenboom is in 2025 verkocht aan Business School Nederland. Onbekend wie daar over een uitgave van 10k gaat. Nooit gevraagd in drie gesprekken."}, "champion": {"state": "COACH", "bewijs": "Barbara denkt actief mee, corrigeert je cijfers, brengt zelf de internationale uitrol in. Maar op je eigen vraag of ze Eduface intern had laten vallen: 'Nee, zelf eerlijk gezegd niet.'", "gat": "Geen persoonlijke win benoemd. Ze doet niks van wat een champion doet: geen introducties, geen criteria vormen, geen EB-meeting. Ze verzamelt."}, "identify_pain": {"state": "DISCOVERED", "bewijs": "Twee pijnen. De genoemde: versnipperde nakijklast over 75 ZZP-docenten die 1 a 2 vakken doen. De echte, die zij zelf inbracht: bij internationale uitrol naar China en Nigeria heeft ze geen zicht op de kwaliteit van beoordeling in het buitenland.", "gat": "Geen datum en geen bedrag. 'Dit studiejaar moet het echt gaan vallen' is het dichtst bij een compelling event dat je kreeg en je hebt het laten liggen."}, "decision_criteria": {"state": "SURFACED", "bewijs": "Genoemd door haar: taal die de student snapt, niet generiek, gekoppeld aan eigen beoordelingscriteria, uitleg waarom. Plus AVG en bias-controle, en NL/EN naast elkaar voor de internationale uitrol.", "gat": "Nooit teruggelegd als lijst en bevestigd. Ze heeft ze niet samen met jou vastgesteld, dus ze sturen niks."}, "decision_process": {"state": "UNKNOWN", "bewijs": "Alleen 'als ik de spullen heb kan ik het intern bespreken'.", "gat": "Met wie, in welk overleg, hoe vaak dat overleg is, wat er daarna gebeurt: niks van gevraagd."}, "paper_process": {"state": "UNKNOWN", "bewijs": "Geen legal team. Ze kende de term DPIA niet. Wel bezorgd over AVG en bias.", "gat": "Geen inkooproute, geen doorlooptijd, geen idee wie tekent. Bij een groepsovername zit dat vaak op groepsniveau."}, "competition": {"state": "IDENTIFIED", "bewijs": "De concurrent is zelf doen met generieke AI. Zij gebruikt LeChat met een jaarabonnement voor een paar mensen. Je hebt goed gepositioneerd op consistentie, explainability en AI-act.", "gat": "Nooit gevraagd of ze ook naar andere leveranciers kijken."}}, "gate": {"fase": "Discovery", "open": false, "ontbreekt": ["Players: geen budgethouder bekend, geen tweede contact binnen Notenboom of Business School Nederland", "Why now: geen datum, alleen 'in de loop van het jaar'", "BANT budget: geen indicatie van wat ze mogen uitgeven", "Geen bevestigingsmail met pijn, spelers, tijdlijn en volgende stappen", "Let op: de deal staat in Close op Scoping. Dat is een overgeslagen stap, niet een voorsprong."]}, "stakeholders": [{"naam": "Barbara Suijkerbuijk", "titel": "Directeur onderwijs, in dienst sinds 2012, eigenaar 2019-2025", "rol": "coach", "gesproken": true, "notitie": "Gaat over onderwijskwaliteit en doorontwikkeling. Wil het nakijken naar Bureau Onderwijs trekken. Voorstander van AI. Rijdt drie maanden niet vanwege epilepsie, werkt 2 dagen thuis."}, {"naam": "Onbekend", "titel": "Budgethouder Business School Nederland", "rol": "eb", "gesproken": false, "notitie": "Notenboom is in 2025 overgenomen. Wie sinds die overname over een uitgave van 10k gaat is niet bekend. Dit is het gat dat de deal blokkeert."}, {"naam": "Bureau Onderwijs", "titel": "Team dat het nakijken centraal zou gaan doen", "rol": "gebruiker", "gesproken": false, "notitie": "Barbara wil het werk hierheen trekken. Zij verwacht dat collega's afwachtend zijn: wat brengt het, hoeveel tijd kost het, welk probleem lost het op."}, {"naam": "75 ZZP-docenten", "titel": "Beoordelaars, 1 a 2 vakken per persoon", "rol": "enemy", "gesproken": false, "notitie": "Barbara's inschatting: die doen het voorwerk niet, want dat extra uur is onbezoldigd. Structurele verbetering interesseert een ZZP-er per periode niet."}], "calls": [{"gesprek_id": "acti_GgoEainHQ1Yxf2UAoIamUvUiZnNKGRJ0oF8Z22cMSbI", "datum": "2026-08-21", "titel": "Barbara x Dante - Eduface (gesprek 4)", "praatratio": 73, "praatratio_bron": "transcript", "zelfscore": null, "scores": {"praten": 2, "doorvragen": 2, "pijn": 3, "macht": 1, "next_step": 2, "bezwaren": 4}, "diagnose": "Je hebt een demo gegeven waar een kwalificatie had moeten staan. Barbara gaf je in de eerste vijf minuten drie interne bezwaren, later het echte probleem (geen zicht op beoordelingskwaliteit bij internationale uitrol) en bijna een datum (dit studiejaar). Je bent op alle drie doorgelopen naar de volgende slide. 73% van de tijd praatte jij, en dat is niet het probleem maar het symptoom: je had een deck en dat moest af.\n\nHet zwaarste feit: je vroeg zelf of ze Eduface intern had laten vallen. Antwoord nee. Gesprek vier, geen interne beweging, geen budgethouder, en de deal staat in Close op Scoping. Dat is geen Scoping, dat is een overgeslagen Discovery-gate.", "wins": ["Je liet haar de berekening corrigeren (2 uur naar 1 uur) en paste hem live aan. Dat is het verschil tussen jouw cijfer en haar cijfer, en het kost je niks.", "Op het ZZP-bezwaar bedacht je ter plekke dat Eduface het voorwerk overneemt. Zij ging daarin mee en vroeg zelfs om de kosten. Dat is een echte opening.", "Je checkte of de beoordelingsformulieren en de docent-vak-koppeling in een database staan. Dat is de vraag die de implementatie haalbaar maakt en de meeste reps vergeten hem."], "missers": [{"spreker": "Barbara", "quote": "Ik denk dat ze wat afwachtend zullen zijn van wat gaat het dan brengen. En hoeveel tijd en energie moeten we insteken om het te laten werken. En ook welk probleem gaan we oplossen.", "waarom": "Zij gaf je de drie bezwaren die deze deal intern gaan doden, ongevraagd, in de eerste minuut. Jij zei 'precies' en ging naar je slides. Dit is het beste materiaal dat je die dag kreeg.", "beter": "Dat zijn precies de drie vragen die ik zou stellen. Laten we ze een voor een langs gaan. Als jij het maandag in dat overleg brengt en iemand vraagt welk probleem we oplossen, wat is dan jouw antwoord? Dan weet ik meteen waar mijn verhaal nog niet klopt."}, {"spreker": "Barbara", "quote": "Dat is even het punt inderdaad van wanneer gaan we dit de volgende stap maken. En dat gaat ook samen in mijn ogen met onze internationale uitrol. Want wat in het buitenland gebeurt, daar hebben we niet direct zicht op. Dus het zal niet morgen al gaan spelen, maar wel in de loop van het jaar.", "waarom": "Hier ligt je compelling event en je grootste pijn tegelijk. Niet nakijklast maar kwaliteitsborging op afstand bij Chinese en Nigeriaanse partners, met NVAO-eisen eronder. Jouw reactie was 'Oké, dat is duidelijk'. Daarna vroeg je hoe internationale uitrol werkt, uit interesse, niet om de deal vast te pinnen.", "beter": "Dus als er in januari een groep in Nigeria start en jullie hebben geen zicht op hoe daar beoordeeld wordt, wat gebeurt er dan? Wie binnen Business School Nederland ligt daar wakker van? En wanneer moet het geregeld zijn om die eerste groep te halen?"}, {"spreker": "Barbara", "quote": "Het gaat om bakken natuurlijk. Het is niet zozeer dat de docenten de last zijn. (...) Het is wel zo dat we daar niet alles van vergoeden, uiteindelijk. Dus een deel is voor rekening van de docent zelf.", "waarom": "Twee keer zei ze dat de tijdwinst geen kostenpost van Notenboom is. Je bent daarna toch doorgerekend naar 1.500 uur en 94.000 euro en hebt dat als waarde gepresenteerd. Een bedrag dat de klant niet uitgeeft, kan ze niet besparen. Die business case sneuvelt zodra een controller ernaar kijkt.", "beter": "Wacht even, als een deel voor rekening van de docent is, dan is die 94k geen besparing voor jullie. Waar zit het dan wel? hoe Business School Notenboom een arbeidsintensief afstudeerproces optimaliseren kan met AI-feedback en mondelingexamens.\n- Vastgesteld dat Notenboom al beoordelingsformulieren met AI maakt en bereid is volgende jaar AI-beoordeling op grote werkstukken te testen.\n- Afgesproken dat een pilot van twee weken gaat focussen op het afstudeervak met ongeveer 20 afstudeerders per jaar.\n- Identified dat custom AI-modellen beter werken dan generieke AI voor consistent feedback geven op Nederlandse onderwijsstandaarden.\n- Vervolgmeeting gepland voor vrijdag 9 uur om vak, timing, betrokkenen en implementatieplan vast te stellen voorafgaand pilotstart.\n\n### Inleiding en achtergrond van deelnemers\n- Barbara Suijkerbuijk is directeur onderwijs bij Business School Notenboom sinds 2012 en was eigenaar van de school van 2019 tot 2025.\n- In 2025 verkocht Notenboom aan Business School Nederland, die Master MBA-programma's, HBV-training en particulier onderwijs aanbiedt.\n- Business School Notenboom heeft een zelfstandig ontwikkelde MBA voor familiebedrijven in ontwikkeling, wachtend op NVAO-goedkeuring.\n- Dante Torbed is pilot manager bij Eduface sinds het begin van het bedrijf 3,5 jaar geleden.\n- Eduface is een spin-off van de Universiteit Leiden, opgericht nadat docenten feedback problemen ondervonden bij grote studentenaantallen.\n\n### Oorsprong en missie van Eduface\n- Eduface ontstond uit frustratie van oprichters die geen gedetailleerde feedback konden geven op studentenwerk door werkdruk met zeventig studenten.\n- Het bedrijf trainde een Nederlands AI-model met ondersteuning van Leiden Universiteit en Radboud Universiteit in plaats van generieke AI te gebruiken.\n- De focus ligt op het trainen van het model met academische data zodat het consistente beoordelingen geeft op basis van dezelfde beoordelingsformulieren.\n- Het model is getraind op hoe Nederlandse docenten feedback geven, niet op Amerikaanse standaarden.\n- Eduface werkt momenteel met Tilburg Universiteit, Hogeschool Rotterdam, Haagse Hogeschool en Radboud Universiteit.\n\n### Huidige beoordelingsproces bij Business School Notenboom\n- Afstudeerwerk gaat door meerdere fases met tussentijdse verdedigingen van deelproducten voor begeleiders en beoordelaars.\n- Bij de finale fase voegt een externe beoordelaar zich bij de verdediging nadat alles is goedgekeurd.\n- Het proces is arbeidsintensief en ondersteund door beoordelingsformulieren die objectiviteit moeten waarborgen.\n- Studenten leveren opdrachten via Magister in, en feedback wordt ook via dit systeem gegeven.\n- Turnitin is gekoppeld aan Magister maar biedt geen oplossing voor AI-gegenereerde content.\n\n### Rol van AI in onderwijs volgens Barbara\n- Barbara gelooft dat AI grote bijdrage kan leveren bij het beoordelen van toetsen en gestandaardiseerde werkstukken, en bij het geven van feedback op rapporten.\n- Business School Notenboom heeft onderwijsontwikkeling meer naar zich toe getrokken en gebruikt AI intensief voor het ontwikkelen van toetsen en beoordelingsmodellen.\n- Feedback via AI kan helpen voorwerk uit te voeren wat normaal bij docenten lag, zodat die docent of inhoudsdeskundige het kan valideren.\n- Het is essentieel om de mens in de lus te houden, omdat AI fouten kan maken en hallucinations kan produceren.\n- Diepgaande feedback via AI wordt momenteel nog onvoldoende ingezet bij Notenboom.\n\n### AI-detectie en het stimuleren van kritisch studentengedrag\n- Barbara en Dante zijn het erover eens dat AI-detectie niet de oplossing is, in tegenstelling tot wat veel instellingen denken.\n- Het doel is om studenten te stimuleren zelf met AI om te gaan, omdat ze dit in hun toekomstige beroep toch moeten doen.\n- Studenten moeten kritischer worden ten aanzien van AI-gegenereerde content en deze relateren aan hun onderzoeksvraag.\n- Educatief gezien moeten studenten meer tijd krijgen voor dieper onderzoek in plaats van op schrijven, dankzij AI-ondersteuning.\n- Wanneer AI-feedback gegeven wordt, worden studenten aangespoord beter werk af te leveren omdat ze weten kritischer beoordeeld te worden.\n\n### Kwaliteitseisen voor AI-feedback\n- Feedback moet in begrijpelijke taal voor studenten geformuleerd zijn en niet generiek maar specifiek op het werkstuk gericht.\n- Feedback moet concrete verwijzingen naar beoordelingscriteria bevatten en uitleggen waarom iets onvoldoende of voldoende is.\n- Bij voorkeur moet feedback suggesties ter verbetering bevatten.\n- AI moet hallucinations vermijden en de feedback moet explainabel zijn waarom de score gegeven is.\n- Notenboom gebruikt rubrics-gebaseerde beoordelingsmodellen die goed geschikt zijn voor AI-voeding.\n\n### Mondeling examen als aanvulling op schriftelijk werk\n- Eduface voert pilots uit met mondelingexamens waarbij docenten inhoudelijke vragen stellen op basis van de geschreven opdracht.\n- Studenten krijgen 30 seconden tot 1 minuut tijd om mondeling te antwoorden, gevolgd door opbouwende feedback zonder afrekening.\n- Dit stimuleert diepere voorbereiding bij studenten en maakt echt begrip meetbaar.\n- De aanpak maakt mondelingexamens schaalbaar met één docent en dertig studenten door formatieve elementen en voorbereiding.\n- Notenboom overweegt het schriftelijke werk minder zwaar te laten meewegen en het mondeling meer centraal te stellen.\n\n### Studentprofiel en gepersonaliseerd leren\n- Eduface werkt aan het verzamelen van datapunten van studenten door verschillende tools zodat een studentprofiel ontstaat.\n- Dit profiel helpt docenten inzicht krijgen waar studenten goed in zijn en waar zij meer hulp nodig hebben.\n- Dit maakt gepersonaliseerd leren mogelijk, wat voorheen moeilijk was vanwege werkdruk.\n- Docenten kunnen hun aandacht beter richten op studentenclusters die specifieke ondersteuning nodig hebben.\n\n### Implementatiebenadering van Eduface\n- Eduface start met een pilot van twee weken met enkele docenten die experimenteren willen.\n- De onderwijsinrichting van het AI-model vereist ongeveer 1 tot 2 uur werk met aanpassingen van het beoordelingsformulier.\n- Business School Notenboom heeft al beoordelingsformulieren met AI ontwikkeld, wat het proces soepel kan maken.\n- Gedurende de pilot wordt een implementatieplan opgesteld en succescriteria bepaald.\n- Eduface werkt op jaarbasis met een jaarlijkse licentie gebaseerd op aantal studenten.\n\n### Waarom custom AI beter is dan generieke AI\n- Eduface testte eerst ChatGPT, Gemini en Grok maar stootte op limitatiesprobleven met prompt-geheugenbegrenzingen.\n- Generieke modellen konden niet alle nuances meenemen die nodig waren voor goede feedback en lazen niet het hele werkstuk.\n- Aanpassingen in prompts werkten inconsistent en veroorzaakten onevenredige problemen.\n- Een custom getraind model lost dit op en voldoet aan GDPR en AI Act-vereisten inclusief explainability.\n- Custom modellen zijn getraind op actuele onderwijsfeedback, niet op algemene internet-data.\n\n### Vakken waar AI minder geschikt is\n- AI heeft aanvankelijk moeite gehad met rekenkundige en economische vakken, maar Notenboom heeft het model daar goed getraind.\n- Filosofische en ethische vakken waarbij veel gaat om het volgen van unieke redeneringen vormen een groter uitdagingspunt voor AI.\n- Barbara verwacht dat volgende jaar experimenten plaatsvinden met AI-beoordeling op grote werkstukken.\n\n### Praktische volgende stappen en pilot voorbereiding\n- Barbara ziet het afstudeerwerk als ideale plek om te experimenteren, gezien de betekenis voor opleidingskwaliteit.\n- Het afstudeerwerk betreft 120 studenten per jaar, verdeeld over twee vestigingen, grotendeels uit Bedrijfskunde.\n- Voor de pilot zal Barbara zelf betrokken zijn, samen met een collega voor onderwijs en mogelijk een afstudeervakcoördinator.\n- De pilot zou zich kunnen focussen op de afstudeervak met ongeveer 20 afstudeerders per jaar.\n- Dante en Barbara plannen een vervolgmeeting vrijdag 9 uur in de ochtend om het vak, timing en benodigde deelnemers vast te stellen.\n\n### Houding ten aanzien van AI en onderwijs transformatie\n- Barbara is voorzichtig maar constructief over AI-inzet en wil bewijs zien dat het werkt voor hun specifieke situatie.\n- Ze ziet kansen voor AI vooral waar repetitief werk kan worden afgevangen, wat docenten tijd geeft voor kritische feedback.\n- Barbara stelt vragen over hoe volwassen studenten (die meer betalen) feedback van AI zullen ontvangen en waarderen.\n- Zij verwacht meer van studenten dankzij AI-tools en ziet geen excuses meer voor slordig werk.\n- Barbara's artikel uit april 2024 over AI in onderwijs aligneert met Eduface's kernvisie op beter onderwijs.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_rVvdfJ5ctz4kFNVjgVsROZVPwoW8YwXLo9K6lUAlSkS", "soort": "meeting", "datum": "2026-08-14", "titel": "Barbara x Dante", "duur_min": 45, "status": "completed", "deelnemers": ["b.suijkerbuijk@notenboom.nl", "dante.torbed@eduface.me"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_glhm8qLJcahDdZkxDUmFXmjB0w1oJfGc6uF2XXmgnux", "soort": "meeting", "datum": "2026-08-18", "titel": "Barbara x Dante - Eduface", "duur_min": 60, "status": "completed", "deelnemers": ["b.suijkerbuijk@notenboom.nl", "dante.torbed@eduface.me"], "samenvatting": "- Besproken hoe Eduface CRM kan helpen bij centraal en consistent beoordelen als strategische reactie op strengere accreditatie-eisen van de NVAO.\n- School Notenboom heeft sinds vorig jaar zomer AI ingezet voor toetsconstructie en heeft HBO jaar 1 volledig opnieuw opgebouwd met één dedicated personeelslid.\n- Identifieerde drie kernwaarden voor implementatie: efficiëntieslag, accreditatieverdediging, en diepere dataanalyse voor onderwijsverbetering.\n- Vastgesteld dat docenten twee uur per student per periode spenderen aan beoordeling, waardoor grondige kwaliteitsanalyse ontbreekt.\n- Vervolgafspraak gepland voor vrijdag 10:00 uur voor demo, prijsmodel en verdere business case-ontwikkeling.\n\n### Doelstelling van het systeem en bruikbaarheid\n- Eduface CRM richt zich primair op ondersteuning van docenten bij het geven van meer kwalitatieve feedback in kortere tijd.\n- Het systeem kan zowel door docenten als centraal door een bureau onderwijs worden ingezet voor beoordelingen.\n- Barbara benadrukte dat centralizing van beoordelingen via een neutrale partij (bureau onderwijs) effectiever kan zijn dan volledige decentralisatie.\n\n### Huidige uitdagingen bij Business School Notenboom\n- De school worstelt met consistentie in beoordelingen vanwege wisselende docenten die als zelfstandig opereren.\n- Docenten hebben beperkte inhoudelijke voorbereiding voor het geven van beoordelingen zonder onderwijskundige kennis.\n- De examencommissie voert momenteel alleen steekproefswijs controles uit, waardoor veel kan worden gemist.\n- Docenten besteden ongeveer twee uur per student per periode aan beoordeling van schrijfopdrachten.\n- De organisatie heeft onvoldoende capaciteit voor grondige analyses en kwaliteitsverbeteringen door de hoge werkdruk.\n\n### Accreditatie en kwaliteitsborging\n- De NVAO (accrediterende instantie) stelt steeds strengere eisen aan verifieerbare kwaliteitsborging.\n- Het risico bestaat dat onvoldoende kwaliteitsborging leidt tot afkeuring en daarmee verlies van accreditatie.\n- Accreditatie-verlies zou het hele bedrijfsmodel van de school in gevaar brengen.\n- De school moet voortdurende kwaliteitsverbeteringen aantonen via een PDCA-cyclus (Plan-Do-Check-Act).\n- **De visitatie is recent afgerond en de school heeft opdrachten gekregen van de accrediteuringscommissie.**\n\n### Implementatie van AI-gestuurde toetsing\n- Notenboom is sinds vorig jaar zomer bezig met AI-ondersteuning voor het centraal samenstellen van toetsen.\n- **De eerste trainingsperiode duurde ongeveer drie maanden, waarin één dedicated persoon van het bureau onderwijs het systeem heeft opgebouwd.**\n- In het afgelopen jaar heeft men het HBO eerste jaar volledig afgerond met alle toetsing opnieuw opgesteld via AI.\n- Voor het eerste jaar zijn drie toetsvarianten per vak gemaakt (één toetsperiode en twee herkansingsperioden).\n- Dit jaar worden het HBO tweede en derde jaar uitgewerkt, met later uitbreiding naar MBO en voortgezet onderwijs.\n\n### Voordelen van AI voor toetsing en onderwijs\n- AI maakt het mogelijk toetsmatrices op te stellen zonder dat volledige onderwijskundige expertise vereist is.\n- Door AI kunnen consistent opgestelde toetsen voor meerdere vestigingen tegelijk gebruikt worden.\n- De werkdruk op docenten kan aanzienlijk afnemen dankzij geautomatiseerde toetscreatie en beoordeling.\n- Vrijgekomen tijd kan docenten helpen zich toe te leggen op betere lesvoorbereiding en meer aandacht voor praktijkkoppelingen.\n- AI biedt rekenkracht voor diepere analyses van toetsresultaten en onderwijskwaliteit.\n\n### Kwaliteit van afstuderen en eindniveau\n- De school heeft strakke begeleiding ingevoerd met wekelijks één-op-één coaching door dedicated afstudeerbegeleiders.\n- Studenten moeten nu een 'beroepsproduct' voor een daadwerkelijk bedrijf opleveren, niet alleen een onderzoeksverslag.\n- Dit zorgt ervoor dat studenten praktische, toepasbare resultaten moeten bereiken.\n- De intensieve begeleiding en praktijkgerichtheid hebben merkbaar effect op de groei en leerresultaten van studenten.\n\n### Rol van docenten en Bureau Onderwijs\n- Docenten moeten zich primair richten op excellente lesgegeving met nadruk op praktijkervaring en theorie-integratie.\n- Het Bureau Onderwijs is nu verantwoordelijk voor toetsconstructie, toetsmatrice-ontwerp en centrale beoordeling.\n- Docenten worden geëvalueerd via studentbeoordelingen en toetsresultaten, niet op hun beoordeelingen.\n- Centrale toetsmaking zorgt voor consistentie tussen meerdere vestigingen en verhoogt de onderwijskundige kwaliteit.\n\n### Toekomstvisie en volgende stappen\n- **Barbara wil in studiejaar 2027-2028 verdere automatisering en dataanalyse uitrollen.**\n- De eerste fase (toetsing van HBO jaar 1-3) moet eerst voltooid worden voordat dataanalyse begint.\n- Dante gaat een business case uitwerken op basis van alle besproken informatie.\n- Een vervolgmeeting is ingepland voor vrijdag 10:00 uur om de demo, prijsmodel en verdere details door te nemen.\n- Het doel is gezamenlijk een sterker business case op te bouwen en duidelijkheid te krijgen over samenwerking.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_GgoEainHQ1Yxf2UAoIamUvUiZnNKGRJ0oF8Z22cMSbI", "soort": "meeting", "datum": "2026-08-21", "titel": "Barbara x Dante - Eduface", "duur_min": 60, "status": "completed", "deelnemers": ["b.suijkerbuijk@notenboom.nl", "dante.torbed@eduface.me"], "samenvatting": "- Gepresenteerd Eduface AI-feedback tool met 95% nauwkeurigheid uit Bergspa Universiteit pilot met 435 beoordeelde opdrachten.\n- Tool geeft gepersonaliseerde, domeinspecifieke feedback gekoppeld aan beoordelingscriteria en biedt formatieve feedback-loops.\n- Berekend potentiële jaarlijkse besparing van 1.500 uur (94.000 euro) voor Business School Notenboom met 175 studenten.\n- Discussed centralized feedback-approach via Bureau Onderwijs, internationale uitrol naar China/Nigeria, en docent-compliance met AI Act.\n- Afgesproken vervolgafspraak donderdag om materialen door te nemen; pilot kost 450 euro met twee weken ondersteuning.\n\n### Eduface Pilot en Nauwkeurigheid Tool\n- Eduface heeft een succesvolle pilot uitgevoerd aan Bergspa Universiteit met 435 beoordeelde opdrachten door 13 docenten.\n- De tool haalde een nauwkeurigheid van 95 procent bij het geven van feedback op schrijfopdrachten.\n- Docenten die de tool goed hebben geïnstrueerd bereikten een verschil van slechts twee punten ten opzichte van handmatige beoordeling.\n- Docenten die minder tijd voor instructie hadden waren minder nauwkeurig, wat verklaart het gemiddelde verschil van zes punten.\n- Ondersteuning werd geboden aan docenten die het model wilden testen en aanpassen.\n\n### Functionaliteiten van Eduface voor Feedback\n- De tool biedt feedback in taal die afgestemd is op het niveau van de student (NBO, HBO, Universitair).\n- Feedback wordt aangepast op basis van de inhoud van de schrijfopdracht door gebruik van een 'reg system' voor domeinspecifieke termen.\n- Feedback is gekoppeld aan beoordelingscriteria uit het beoordelingsformulier voor duidelijkheid.\n- De tool voldoet aan de AI Act-vereiste van explainability door gebruikers inzicht te geven in modelkeuzes.\n- Korte feedbackloops worden gerealiseerd zodat studenten direct feedback kunnen ontvangen (formatieve feedback).\n\n### Formatieve en Summatieve Beoordeling\n- De tool ondersteunt twee beoordelingsmogelijkheden: formatieve feedback (direct aan student) en summatieve beoordeling (met docent-goedkeuring).\n- Docenten kunnen kiezen of studenten direct feedback ontvangen of dat deze eerst moet worden goedgekeurd.\n- Bij formatieve beoordeling vergelijkt het model verschillende versies van opdrachten en herkent aanpassingen.\n- Business School Notenboom wil feedback centraal via Bureau Onderwijs afhandelen in plaats van per docent.\n- Papers zullen voorwaardelijk zijn voor mondelinge toetsing met een samenvatting van sterke en zwakke punten voor voorbereiding docent.\n\n### AI en Gebruik van Standaard AI-modellen\n- Reguliere AI-modellen zoals ChatGPT of Gemini bieden onvoldoende consistentie en explainability voor onderwijs.\n- Eduface heeft drieënhalf jaar geleden besloten een custom model te bouwen vanwege problemen met inconsistentie en verborgen aannames.\n- Het custom model zorgt voor betrouwbare en verklaarbare feedback zonder willekeurige uitspraken.\n- Uso van standaard API's is minder geschikt omdat deze afhankelijkheden en AI Act-compliance issues opleveren.\n\n### Kostprijsberekening en Besparing\n- Business School Notenboom heeft 175 studenten en 15 vakken per periode (30 per jaar) met gemiddeld 2 uur beoordeling per vak.\n- De berekening resulteert in 5.250 beoordelingen per jaar, wat ongeveer 5.250 uur beoordeling kost.\n- Met Eduface kan een tijdsbesparing van ongeveer 30 procent worden bereikt, gelijk aan circa 1.500 uur per jaar.\n- Dit levert een geschatte waarde van ongeveer 94.000 euro per jaar op.\n- Voor de pilot vraagt Eduface een investering van 450 euro met twee weken ondersteuning van Dante Torbed.\n\n### Juridische en Compliance Aangelegenheden\n- **Business School Notenboom is attent op AVG-compliance en het voorkomen van bias in AI-gegenereerde content.**\n- **De organisatie voert zorgvuldig controle uit op gegenereerde teksten om politieke of filosofische vooringenomenheid tegen te gaan.**\n- Eduface is GDPR-compliant en voldoet aan AI Act-vereisten.\n- Dante zal compliance-documenten naar Barbara sturen voor verdere interne behandeling.\n- Een Data Impact Assessment (DIA) is nog niet uitgevoerd door Business School Notenboom.\n\n### Taalondersteuning en Internationale Uitrol\n- De Eduface-tool ondersteunt zowel Nederlands als Engels met gescheiden omgevingen per taal.\n- Business School Notenboom bereidt internationale uitrol voor naar China en Nigeria.\n- Internationale studenten moeten minimaal 25 procent van hun opleiding in Nederland volgen voor een Nederlands diploma.\n- Er zijn tien verschillende onderwijsvarianten in voorbereiding voor internationale samenwerkingsmodellen.\n\n### Implementatie en Ondersteuning\n- Eduface kan alle beoordelingsformulieren centraal opzetten voor docenten, waardoor zij alleen opdrachten hoeven in te leveren.\n- De tool kan zonder uitgebreide docent-instructie tot 93 procent nauwkeurigheid bereiken op basis van beoordelingsformulieren.\n- Implementatie vereist een plan dat afgestemd moet zijn met andere lopende pilots.\n- Barbara wil eerst intern overleggen over timing en relevantie voordat een volledige implementatieplan wordt gemaakt.\n- Een vervolgafspraak is gepland voor donderdag om materialen door te nemen en voortgang te bespreken.\n\n### Pricing Model en Contractvoorwaarden\n- Eduface hanteert een apart pricing model voor particulier onderwijs anders dan voor reguliere instellingen.\n- Het model bestaat uit twee componenten: tool fee (ondersteuning, onboarding, software development) en infrastructuurkosten (AI-capaciteit).\n- Meerjaarskorting is beschikbaar bij contracten van drie of vijf jaar.\n- Contracten kunnen flexibel zijn, met mogelijkheid tot aanpassing na zes maanden.\n- Het aanbod zal inzicht geven in kosten voor voorbereiding van beoordelingsformulieren voor interne doorrekening.\n\n### Docenten en Organisatiestructuur\n- Business School Notenboom heeft ongeveer 75 docenten die elk slechts één of twee vakken geven.\n- De docenten zijn goed gekarteerd in relatie tot de vakken die zij verzorgen.\n- Beoordelingsformulieren zijn opgeslagen in de interne database en goed georganiseerd.\n- **Docenten werken op ZZP-basis en focussen op specifieke periodes, niet op structurele procesverbetering.**\n- Docenten zijn niet bereid extra voorbereidingswerk te doen zonder compensatie, ook al leidt dit tot latere lastenverlichting.", "eigen_notitie": "Obstakels: \nPas relevant zodra de internationale uitrol gaat plaats vinden. \n\nDocenten kunnen zelf niet de tool instuweren dat moet bij het onderwijs bureau gebeuren dus dat moet zij zelf doen. En daar heeft ze nu geen tijd voor vindt ze.", "transcript_beschikbaar": true, "komend": false}, {"id": "acti_Hk4fd4DlEDiEpLi1Wywxkagjl8CCqzJohEXjpF7GX6v", "soort": "meeting", "datum": "2026-09-22", "titel": "Barbara x Dante - Eduface", "duur_min": 60, "status": "upcoming", "deelnemers": ["b.suijkerbuijk@notenboom.nl", "dante.torbed@eduface.me"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": true}], "open_taken": [], "laatste_gesprek": "2026-08-21", "volgende_afspraak": "2026-09-22", "aantal_gehad": 6, "gesynct": "2026-08-29 13:35"}}, {"slug": "capabel-onderwijs", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": "" ken om een goed beeld te krijgen van hoe feedback geven nu loopt, zodat ik een passende demo kan voorbereiden. Hoe ziet het nakijken van een opdracht er nu uit? → Inke: We werken met beoordelingsformulieren, toetsmatrijs en rubrics. Onze visie is holistisch beoordelen: niet strak per punt aftrekken, op HBO kijken we naar de groei van de student. Veel aandacht voor groeigerichte feedback. Formulieren zijn Bloom-gebaseerd, ~9 leerdoelen, per leerdoel een Bloom-niveau + punten. Mijn twijfel: past dat holistische bij Eduface? Hebben jullie daar ideeën/ervaring bij vanuit andere partners?\n\nDante: Herkenbaar, ik noteer het. Ik ken holistisch van Windesheim, daar deden ze overstijgend feedback geven, we werkten toe naar een bepaalde kwaliteit van feedback. Met AI moet je instructies meegeven, het is tweaken, niet in 1-2 keer goed. → Inke: Eens, we moeten kijken hoever we het holistisch erin kunnen houden met duidelijke instructies.\n\nDante: Je zou Eduface als basis kunnen gebruiken met daarna een menselijk oog eroverheen. Hoe wordt Eduface meestal ingezet, veel opdrachten of specifiek? Reflectieverslagen of onderzoek? → Dante legt uit: verschilt per opdracht; onderscheid formatief vs summatief. Eerstejaars vaak formatief: student levert in, krijgt feedback, herschrijft, levert opnieuw in, tool laat groei/herhaalde foutjes zien. Werkt voor reflectie-, onderzoeksverslagen én inhoudelijke papers.\n\nInke: Dus het model brengt ook de groei van de student in kaart? Onthoudt het dat dezelfde persoon eerder iets inleverde? → Dante: Kan, maar dat soort features zit in de LMS-integratie. In welk LMS werken jullie? → Inke: Eigen systeem \"Mijn Capabel\", niet heel geavanceerd, maar alles komt binnen op één plek.\n\nDante: Als de student feedback terugkrijgt, is dat de holistische algemene feedback, of ook specifieke opmerkingen in de tekst zelf? → Inke: Geen opmerkingen in het document zelf, alleen op het beoordelingsformulier. Dat krijgt de student te zien, met de uitnodiging om % daarna promotie of een nieuwe baan heeft, en\ndie belofte breekt bij elke afhaker. Hun eigen beleid zegt al dat assessors\n\"usually\" formatieve feedback op concepten geven, dat \"usually\" is het gat.\nScherpste variant: een OTHM level 6 learner doet 7 units over 11 maanden bij\nwisselende assessors, en niemand ziet of hij feedback uit unit 2 heeft\nopgepakt in unit 5.  \nSecundair: cijferconsistentie bij meerdere nakijkers. Dat is de compliance-wig\nvoor Thomas Mallon, QQI en OTHM. Tweede stap, niet de opening.  \nKort: John koopt op doorstroom en kosten, Thomas koopt op verdedigbaarheid.  \n  \nGATEN:  \n\\- Waarde is de onderkant van de ICP-band. Herzien na discovery op assignment-\nvolume en uitval.  \n\\- Landmijn: hun Academic Integrity Guide (jan 2025) noemt AI-gebruik\nmalpractice, met Turnitin-detectie en een 25%-drempel. AI-bij-de-learner\nexpliciet scheiden van AI-bij-de-assessor.  \n\\- Governance: QQI legde in 2021 op dat de Results Approval Panel\nonafhankelijk van de commerciele kant over assessment beslist. John is\neigenaar maar beslist dit formeel niet alleen. Dus iets complexer dan het\nsegmentgemiddelde. Thomas Mallon niet overslaan.  \n\\- Non-universiteit en niet-UK, dus buiten de #1 prioriteit. Wel een testcase\nvoor een segment dat we sowieso bewerken (UK-namen daar: BPP, Kaplan, QA\nHigher Education, Pearson College London).", "contacten": [{"naam": "John O'Toole", "titel": "Founder & Managing Director", "email": "john@cmi-ireland.com", "id": "cont_Sbs6X6moQJbjCOotUA1qmttXbJ2swEhYe5xorQXC2hk"}, {"naam": "Thomas Mallon", "titel": "Academic Director (eigenaar QA & verificatie)", "email": null, "id": "cont_aW3YPI105FWtjQpvdlGuATmuz9iBiZiwneak7OVQKYq"}], "gesprekken": [{"id": "acti_wmNCCQLN71AaObzUAWr7lSGCuzXfIN08BsxJBEMD3XB", "soort": "meeting", "datum": "2026-07-24", "titel": "John O'Toole and Dante Torbed", "duur_min": 45, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "john@cmi-ireland.com"], "samenvatting": "- Discussed CMI's current manual assessment process correcting 1,000 assignments yearly, which is time-intensive and requires consistent feedback across 20+ teachers.\n- Reviewed CMI's recent disappointing trial with another AI provider that generated only 20% usable feedback and created additional assessor workload.\n- Presented Eduface's custom academic AI model trained with universities, achieving 89% grading consistency across teachers at Bergstra University.\n- Established CMI requirements for AI feedback: structured format identifying strengths/weaknesses, mandatory versus optional improvements, and clear rubric alignment.\n- Scheduled initial testing for August 4th with goal of implementation by November when new students begin assignments.\n\n### Introduction and Company Background\n- John O'Toole is the managing director of CMI (Communications Management Institute), an education institute based in Dublin, Ireland.\n- CMI operates online classes with approximately 400 students per year and 20 teaching staff members.\n- The institute uses assessment-based courses rather than exams, with students submitting draft and final assignments.\n- Eduface is a Dutch company with pilot manager Dante Torbed, founded with Leiden University and Radboud University approximately three and a half years ago.\n- Eduface is integrated with Moodle and has developed its own academic AI model rather than using general-purpose LLMs.\n\n### Current Assessment Process and Pain Points\n- CMI currently uses Moodle for manual assessment with teachers providing feedback on draft and final submissions.\n- Assignments contain 17-25 questions with up to 5,000-6,000 words total, requiring lecturers to spend multiple days correcting each batch.\n- Teachers manually grade using Moodle rubric templates, marking whether students have achieved, passed, or not yet achieved learning objectives.\n- The institute corrects approximately 1,000 assignments per year across approximately 200 students.\n- Manual assessment is time-consuming and requires consistent feedback quality across 20+ teaching staff members.\n\n### Previous AI Testing Experience\n- CMI recently tested another AI solution that generated approximately 80% unsuitable feedback requiring significant human editing.\n- **The tested AI model summarized answers excessively, used direct quotations without explanation, and had inconsistent recommendations.**\n- **Key issues included failing to identify assessment gaps, not understanding command words, missing academic weaknesses, and inconsistently applying the assessment rubric.**\n- **The AI frequently indicated passes where human assessors identified significant deficiencies, creating conflicting outcomes.**\n- Only approximately 20% of the AI feedback was genuinely useful, often requiring extensive human intervention and quality checking before issuing to learners.\n\n### Requirements for Effective AI Assessment Feedback\n- CMI expects feedback structured like a hamburger: introductory sentence restating requirements, main section identifying strengths and weaknesses, and conclusion stating pass status with justification.\n- Feedback should distinguish between mandatory changes and optional enhancements for student improvement.\n- The model must provide individual feedback per question and overall summary feedback without excessive quotations or summaries.\n- Feedback must clearly align with the assessment rubric and demonstrate how grading decisions are reached.\n- CMI emphasizes that AI effectiveness directly impacts assessor workload—99% accuracy reduces correction time, while 50% accuracy actually increases assessor work and costs.\n\n### Eduface Solution and Demo\n- Eduface built a custom academic AI model trained with Leiden University and Radboud University specifically for formative feedback on writing assignments.\n- The platform provides feedback per rubric criterion based on teacher-uploaded grading schemes and assessment briefs.\n- Teachers can add quick comments and highlight specific parts of assignments for additional feedback.\n- The solution evaluates assignments against up to seven criteria ranging from fail to very good ratings.\n- Processed assignments can be marked complete and instantly sent to students once the teacher has reviewed the AI feedback.\n\n### Partner Experience and Consistency Results\n- Eduface currently serves eight institutional partners, including Bergstra University with 30,000 students.\n- At Bergstra University, the pilot showed 89% consistency in grading across teachers using the same tool.\n- The tool normalizes feedback language and tone across lecturers, which some teachers viewed as constraining their individual voice.\n- Initial setup requires significant time investment to provide the AI model with complete information including assessment briefs and correction guidance.\n- The most important benefit reported by partners is improved consistency in feedback quality across all teachers.\n\n### Testing and Implementation Timeline\n- Eduface offers one to two weeks of testing with one or two courses to evaluate the tool's effectiveness.\n- A 5,000-word assignment typically takes 5-10 minutes for the AI to process and generate feedback.\n- CMI can test the solution before August 14th when John O'Toole goes on holidays.\n- CMI's academic year begins end of September/October, making early November the earliest realistic start date for full implementation.\n- Setup will involve initial installation, course selection, optimization, and a follow-up meeting to discuss pricing and findings.\n\n### Company Information and Pricing\n- Eduface is a startup founded by two founders—one with AI expertise and one with legal and commercial background.\n- Dante Torbed is the first employee and pilot manager, working with a team of four developers and the commercial founder.\n- Website pricing of €25 per month for 200 assignments applies only to individual teachers, not institutions.\n- Eduface focuses on institutional partnerships to embed the tool across entire teacher groups for consistent feedback standards.\n- Institutional pricing will be provided during the testing phase for evaluation alongside the tool's performance.\n\n### Next Steps and Follow-up Meeting\n- A follow-up meeting was scheduled for Tuesday, August 4th at 12:00 PM Eduface time (11:00 AM Irish time) to set up the testing environment.\n- Dante will send information about the meeting agenda and provide contact for coordination before the test setup.\n- CMI will prepare Moodle configuration and provide assessment briefs, rubrics, and correction guidance to optimize the AI model.\n- Testing will involve processing actual CMI assignments to evaluate feedback quality and consistency before institutional rollout.\n- Implementation decision will depend on the AI solution achieving 95-99% accuracy and effectiveness to justify adoption across 20+ teaching staff.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_tbYn2IijyXzxQLygzlNF8SOrOCa5pJczDPcg4Kp1Xtj", "soort": "meeting", "datum": "2026-08-04", "titel": "Eduface × CMI – getting started", "duur_min": 60, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "john@cmi-ireland.com"], "samenvatting": "- Discussed CMI's current manual assessment process and requirement for AI-powered feedback to save lecturer time without creating additional work.\n- Established that accuracy must be in the high 80s with minimal editing needed to be viable; grammar and spelling already covered by Copyleaks.\n- Agreed on a two-phase testing approach: Phase 1 uses standalone platform with three test assignments and human comparison; Phase 2 integrates into Moodle.\n- Configured Eduface platform demo showing rubric setup, assignment upload, and feedback download capabilities for CMI collaboration.\n- Scheduled next steps with John O'Toole to receive account access and begin uploading rubric, grading scheme, and test assignments immediately.\n\n### Current Assessment Process and Tool Requirements\n- CMI currently has a manual assessment process with draft and final submissions, plus formative feedback in Moodle that assessors correct by hand.\n- Previous assessment tools tried by CMI focused mainly on summarizing rather than addressing specific assignment issues.\n- CMI uses a grading system with pass and refer (not yet achieved), allowing students to resubmit after receiving feedback.\n- The ideal workflow involves students submitting assignments, AI providing feedback, and lecturers reviewing for minimal adjustments.\n\n### Accuracy and Performance Expectations\n- CMI requires accuracy in the late 80s percentage range with only minor editing needed (10-15% editing maximum) to be viable.\n- Eduface cannot guarantee 99% accuracy due to tone of voice variations, but aims to provide a solid head start saving lecturer time.\n- Eduface measures accuracy based on edits made by assessors; any change, including tone adjustments, counts as an edit.\n- An example from Basel University achieved 89% accuracy, meaning only one or two lecturers out of five changed the feedback.\n- If editing requirements exceed 15%, the tool becomes counterproductive and creates double work for teachers.\n\n### Key Tool Evaluation Criteria\n- Accuracy level is the most critical factor for CMI when evaluating assessment tools.\n- Seamless Moodle integration is essential, allowing the tool to work in the background without additional user effort.\n- User friendliness and simplicity are important; teachers should be able to upload assignments and receive feedback without extra steps.\n- Academic referencing and citations are repetitive tasks that the tool should handle effectively.\n- Grammar and spelling feedback is already provided through Copyleaks reports, so Eduface should not duplicate this functionality.\n\n### Testing Plan and Methodology\n- CMI will provide three to four assignments for the test period ep.\n- Eduface will provide feedback reports on the three test assignments for CMI to compare against human corrections.\n- CMI will return human-corrected marking sheets after a couple of days for Eduface to use in comparison analysis.\n- John O'Toole indicated limited availability until late August due to workload and vacation, but agreed to move forward with the testing process.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-08-04", "volgende_afspraak": null, "aantal_gehad": 2, "gesynct": "2026-08-29 13:35"}}, {"slug": "cms-vocational-training", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_QB4W3lBe5HxU9A37akXfhMH64ysjB7eskLTuqBg3b60", "naam": "CMS Vocational Training", "url": "https://app.close.com/lead/lead_QB4W3lBe5HxU9A37akXfhMH64ysjB7eskLTuqBg3b60/", "lead_status": "Actief", "opportunity_id": "oppo_6fcJYH4BlIhCJ21AJ5ap7QauIQHSDTYvzmTEUVpm82U", "fase": "Lost", "fase_type": "lost", "waarde": 3000, "valuta": "EUR", "confidence": 0, "close_date": null, "eigenaar": "Eduface CRM", "crm_note": "**Status:** Verloren op alternatief: de klant heeft zelf een werkend proces\ngebouwd met een eigen GPT in ChatGPT en zag geen reden om met Eduface door te\ngaan.\n\n**Wat er gebeurde:** Voorgesteld was een POV met een offerte voor een licentie\nvoor een trialperiode vanaf januari, met succescriteria rond feedbackkwaliteit\nen tijdwinst. De klant heeft die criteria zelf aangescherpt naar Ofsted- en\nEPA-toetsbaarheid en heeft daarna zelf een GPT gebouwd die goed genoeg werkte.\nOp 15 april is het project door hen geparkeerd, met de toevoeging dat ze wel\nopen staan voor verder testen als het product doorontwikkelt. De blokkade d
