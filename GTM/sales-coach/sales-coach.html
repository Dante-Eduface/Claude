lleLh4pU29wNH2axaZFFwWVd929gGcloZC1LhSF5frc", "fase": "Discovery", "fase_type": "active", "waarde": 10000, "valuta": "EUR", "confidence": 15, "close_date": "2026-11-30", "eigenaar": "Eduface CRM", "crm_note": "Op pauze gezet door ons, niet door hen. Discovery is gedaan (5 aug), daarna hebben wij de pilot uitgesteld omdat de capaciteit vol zat tot eind september. Ahmed houdt de deur open maar kijkt ondertussen naar alternatieven, dus dit koelt af.\n\nNodig: in de week van 22 sep zelf terugkomen bij Ahmed, niet wachten tot hij belt. Vraag om 2-3 echte quizvragen met marking scheme (geanonimiseerd) en de output naast hun eigen beoordeling leggen. Naam uit de academische kant nodig, Ahmed zit op techniek en is Acting Program Coordinator, geen budget.\n\nVerloop: intro via Calendly 5 aug over nakijken van open vragen in Moodle-quizzes. 6 aug hebben wij de pilot doorgeschoven en de vervolgafspraak afgezegd. 7 aug: hij komt mogelijk in september terug, kijkt intussen verder.\n\nGaten: geen volumes, geen nakijklast in cijfers, geen budget of besluitvormingsproces. Ze hebben een eigen in-house AI agent voor faculty, onduidelijk waar die ophoudt en wij beginnen. Autumn exams in oktober is het enige tijdsanker. Waarde is aanname (gemiddelde pilot 10K), geen prijsindicatie gegeven.", "contacten": [{"naam": "Ahmed ElMassry", "titel": "", "email": "a.elmassry@hbmsu.ac.ae", "id": "cont_JrHlw1jZX1NeYFBpDmQs0qWka3FurSAdL6Tw4st2867"}], "gesprekken": [{"id": "acti_EWhxV6nyl8lUkCvVEwtY662CDj8QcLsTXVfImzF8sxH", "soort": "meeting", "datum": "2026-08-05", "titel": "Ahmed ElMassry and Dante Torbed", "duur_min": 30, "status": "completed", "deelnemers": ["a.aziz@hbmsu.ac.ae", "a.elmassry@hbmsu.ac.ae", "dante.torbed@eduface.me"], "samenvatting": "- Discussed AI-based essay grading solution for HBMSU's English 101 course with approximately 500-1,000 learners expected in fall semester.\n- Eduface's Moodle-integrated platform uses custom-trained LLM for academic grading with initial setup requiring instructor training (approximately one hour) followed by automated instant feedback.\n- Pilot planned with mock exams in summer and first final exam on August 20th, focusing on essay questions within quizzes rather than assignments.\n- HBMSU requires consistent grading without human intervention as end goal, though initial rollout may include faculty review until system reliability is verified.\n- Next meeting scheduled for Friday, August 11th at 11:30 AM HBMSU time (9:30 AM Eduface time) to demonstrate Moodle integration with essay grading demo.\n\n### HBMSU Overview and Project Context\n- Ahmed ElMasry is the general education program coordinator managing 12 courses including English and Psychology across multiple sections.\n- HBMSU is the first smart university in the UAE, based in Dubai, with focus on AI-based solutions to automate instructor workload.\n- General education courses cover English, Arabic, UAE studies, statistics, math, programming, AI, innovation and entrepreneurship.\n- English 101 course is currently live with digitized, self-paced content published in Moodle with mock and final exams ready.\n- University aims to transition from instructor-led to self-paced learning with full automation and minimal instructor intervention.\n\n### Specific English 101 Pilot Requirements\n- Pilot focuses exclusively on essay grading within quiz questions (150-200 word writing prompts), not assignment submissions.\n- Mock exams allow three learner attempts; final exams occur with first test on August 20th and second on August 27th.\n- Fall semester implementation expected to serve 500-1,000 learners in English 101 with potential expansion to other general education courses.\n- Grading scale within quizzes varies by settings, potentially 1-5 or 1-10 point scales, not pass/fail designation.\n- Initial pilot phase will grade mock exams without faculty intervention, while final exams may require faculty review until system reliability is confirmed.\n\n### Eduface Platform and Integration Details\n- Eduface built custom large language model trained on academic data after determining general LLMs lacked sufficient consistency and quality.\n- Platform is fully integrated with Moodle using LTI 1.3 integration standard for seamless quiz grading within the learning management system.\n- Grading occurs directly in Moodle quiz interface; grades are then automatically pushed to Banner student information system via existing automation.\n- System provides both numerical grades and qualitative feedback with grading applied at each rubric point, then aggregated into final grade.\n- Initial instructor training typically requires approximately one hour to configure the system with specific rubrics and grading expectations.\n\n### Pilot Timeline and Implementation Process\n- Dante Torbed confirmed Eduface can be up and running within one week once Moodle integration is complete and assessor is available for instruction.\n- Moodle integration typically requires one to two days for technical implementation, with potential security considerations like firewall configurations.\n- Legal documentation (GDPR compliant) must be processed through HBMSU procurement before pilot can begin.\n- Pricing based on number of courses and support level required; pilot phase includes only support and AI processing costs at reduced rate pending clear requirements documentation.\n- Implementation plan with specific dates will be sent by Eduface, with all timeline dates requiring discussion and confirmation from both parties.\n\n### Academic Requirements and Expectations\n- System must provide grading consistency across student assessments to ensure fairness and standardization across large enrollments.\n- **University aims to reach AI-native university status with full AI-based grading without human review as ultimate goal.**\n- One faculty member from English department will be assigned as subject matter expert (SME) to guide system configuration and validation.\n- Dean initially prefers faculty verification of grading scores during first pilot run before full automation, though long-term goal is complete AI autonomy.\n- Feedback format should include specific guidance such as areas of strength, areas for improvement, and actionable recommendations for students.\n\n### Technical Infrastructure and Considerations\n- Faisal Ijaz serves as senior software engineer managing LMS infrastructure; Ali Aziz is learning systems administrator providing technical support.\n- University uses Moodle as learning management platform with Banner as student information system for grade recording and reporting.\n- Arabic language support for UAE studies course is not currently supported by Eduface platform; supporting Arabic would require significant development effort.\n- Quiz structure includes multiple choice questions, short answer questions, and essay components; Eduface solution targets essay grading component specifically.\n- Separate adaptive learning project running concurrently allows system to provide remedial content based on learner performance, independent of this grading initiative.\n\n### Demonstration and Follow-up Meeting\n- Demo scheduled for Friday, August 11th at 11:30 AM HBMSU time / 9:30 AM Eduface time to showcase Moodle-integrated essay grading.\n- Dante will demonstrate system within actual Moodle environment with quiz essays rather than assignment submissions to match HBMSU's specific use case.\n- Ahmed requested demo include rubric building process, learner submission workflow, grading logic, feedback format, and grade visibility to students.\n- Eduface will provide implementation plan document after demo meeting to clarify all requirements, success criteria, timelines and project scope.\n- Meeting invites will be sent to attendees; documents and technical specifications to be shared following the Friday demonstration meeting.\n\n### Project Scope and Related Initiatives\n- Currently no AI-assisted assignment grading tools exist within HBMSU's existing systems; this initiative addresses specific need for quiz essay grading.\n- Previous agentic AI project generated learning outcomes and content from course syllabi, which faculty members then refined and published to Moodle.\n- **HBMSU emphasizes that challenging requirements strengthen vendors' products; previous vendor (Rize) stated HBMSU requirements improved their platform capabilities.**\n- Pilot will include success criteria and evaluation process to determine whether to roll out tool across additional courses post-pilot.\n- Future expansion potential includes heavy project courses and other general education offerings beyond initial English 101 focus.\n\n### Preferred Workflow and Human-in-the-Loop Considerations\n- Ideal workflow: students submit essays through Moodle quiz, AI grades instantly, and grade appears immediately without manual intervention for mock exams.\n- For final exams, faculty can review AI-assigned grades and easily adjust if needed by clicking approve or modifying the numerical score.\n- University seeks balance between automation and quality assurance, with mock exams fully automated and final exams subject to initial faculty review.\n- Long-term goal eliminates manual review entirely once system demonstrates consistent accuracy comparable to faculty grading standards.\n- Pilot success depends on achieving high accuracy (example: 89% mark accuracy where AI matches faculty assigned grades) before full automation approval.", "eigen_notitie": "Health: sterk. Inbound via Calendly, champion aan de academische kant, harde deadline en een vervolg met demo staat al. Grootste risico is snelheid, niet interesse.\n\nNodig: (1) Moodle-demo vr 7 aug 11:30 Dubai / 09:30 NL, tijd nog te bevestigen door Faisal, invite vandaag versturen. (2) Ahmed vragen om hun eigen rubric + 2-3 echte quizvragen voor English 101, zodat de demo op hun materiaal draait. (3) Implementation plan met data sturen, toegezegd in de call. (4) Vanilla Moodle opzetten met LTI 1.3 en een essayvraag, ze willen het in Moodle zien en niet in ons standalone platform.\n\nVerloop: intro 5 aug, 44 min, 4 deelnemers. Ahmed ElMasry (General Education Program Coordinator, champion, academisch), Faisal Ijaz (senior software engineer, LMS), Ali Aziz (learning system administrator), Bassel Al Daoudi was uitgenodigd maar niet aanwezig. Use case is scherp: essayvragen binnen Moodle Quiz in English 101, 150-200 woorden, nu volledig handmatig nagekeken. Fall verwachting 500-1000 learners op alleen dat vak, daarna uitrollen naar circa 10 general education courses. Eerste exam 20 aug, tweede 27 aug, fall-exams midden en eind oktober. Alles Engels, Arabisch valt buiten scope. Moodle is leidend, cijfer gaat door naar Banner. Integratie via LTI 1.3, Faisal schat 1-2 dagen. Dean wil eerste ronde AI met verificatie door een faculty member, Ahmed wil op termijn zonder mens in de lus. Ze draaiden eerder een POC met Realizeit voor adaptive learning die strandde op hun eisenpakket.\n\nGaten: geen budget genoemd, alleen de vraag wat het kost bij 100-150 learners, prijs bewust nog niet gegeven. Dean is niet gesproken en er is nog geen naam. Procurement- en legalpad onbekend, alleen GDPR-documenten toegezegd. Onduidelijk of dit onder het AI-agent-programma van Maitha Al Tunaiji valt, want dat raakt dezelfde scope. Geen SME toegewezen terwijl die nodig is om het model in te stellen.", "transcript_beschikbaar": true, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-08-05", "volgende_afspraak": null, "aantal_gehad": 1, "gesynct": "2026-08-29 13:35"}}, {"slug": "hogeschool-dirksen", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_FBv2RuGgEXWNnQOi6H h", "duur_min": 120, "status": "completed", "deelnemers": ["eric.kaim@icm.nl", "jeroen.van.gessel@eduface.me", "samuel.rafini@eduface.me"], "samenvatting": null, "eigen_notitie": "Meeting op kantoor bij ICM gehad. \n\n\n\nWe zaten voornamelijk alleen met Eric en niet met collega's. Andere collega's kwamen er alleen even bij door Eric om kort 'hoi' te zeggen. \n\nAlgemene ervaring bij ICM. We hebben een rondleiding gehad door het kantoor. Het heeft niet een zeer gelaagde structuur, maar het is juist heel open en informeel bij ICM. Ze vinden duurzaamheid en inclusiviteit heel belangrijk en vinden het heel belangrijk dat medewerkers graag naar kantoor komen. Ik heb zelf Erik de founder/directeur even kort ontmoet. Hij is erg spiritueel en verbindend leidend uit een visie voor een betere wereld. Daarin is er wel overlap tussen wat wij doen ook. \n\nEric wil dit project erg voor zichzelf houden. Hij gaf aan dat hij zelf met dit initiatief is gekomen. Het zelf wil leiden en er ook zelf budget voor heeft. Uiteraard heeft hij dit wel in beginsel langs wat mensen gespeeld om een goedkeuring hiervoor te krijgen en die heeft hij ook wel gehad. Hij gaf aan dat hij zelf best wel een IT budget heeft (niet perse voor dit project, maar meer voor hierna). Hij gaf aan dat hij dit project niet had opgepakt als hij niet dacht dat dit breder impact zou kunnen hebben voor ICM en zijn doel is dus ook dat als onze tool goed werkt om dit dan uit te rollen naar heel ICM. \n\nHij wilde nog niet teveel de inhoud van de succescriteria induiken, een besparing op uren of een bepaald bedrag wilde hij ook niet perse bewerkstelligen. Hij ziet de impact van ons project op de verbeterde ervaring van cursisten en dat dit uiteindelijk uitstraalt op groei en retentie. \n\nVervolgstappen zijn dat Samuel 17 juli met hem zit om de integratie volledig live te hebben in hun Moodle, is niet veel werk. Hij gaat ons pilotplan reviewen en op reageren. Hij heeft drie collega's die hij goed in de loop houdt en twee daarvan hebben we kort ontmoet. Frank en Rebecca. Rebecca is functioneel manager Moodle, Frank deed ook veel in Moodle. Hij noemde wel kort dat hij verwacht hij zal tekenen samen met de IT manager. De IT manager moeten we nog in kaart brengen en maak ik nu aan als taak voor Dante. Hij gaf aan dat de directeur en financieel director hoewel ze heel toegankelijk zijn, wel heel druk zijn en hij vroeg op kantoor moet zijn om de kans te hebben om ze even te spreken voor een snelle goedkeuring. Ze werken nog als een wendbare organisatie. \n\n\n\nB-corp en great place to work awards zag ik overal in het kantoor, dit is dus een belangrijk onderdeel van wat ze uitdragen. Ik had over het algemeen het idee dat ze niet optimaal gedreven waren om zo efficient mogelijk te werken. Deden veel evenementen buiten werk om, dagelijks rond de tafel, dart toernooien, tafeltennis, hardloop evenementen in bedrijfsshirtjes etc. \n\n\n\nEr is geen breder initiatief om een tool zoals Eduface aan te kopen vanuit hogerop, maar hij gaf aan dat dit soort initiatieven vaan bottom up gaan, maar ik geloof dat niet helemaal. We hebben een deadline gezet voor wanneer we een formele Go moeten hebben en we aan het contractwerk kunnen zitten. 15 Augustus moeten we de go hebben gekregen om dan voor 26 augustus volledig live te zijn in hun moodle omgeving. Ik geloof erin dat er een grote samenwerking mogelijk is maar we moeten wel een groot bedrag vragen voor de pilot, want deze grotere samenwerking is verre van zeker.", "transcript_beschikbaar": true, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-07-07", "volgende_afspraak": null, "aantal_gehad": 4, "gesynct": "2026-08-29 13:35"}}, {"slug": "inholland", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoa uS0sVBVdnr9aikSqz5daTWni4CSBGrKFG7GaUmwD", "soort": "meeting", "datum": "2026-01-28", "titel": "Hogeschooltaal x Eduface", "duur_min": 30, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "eva.jansen@noordhoff.nl", "h.grasdijk@noordhoff.nl", "jeroen.van.gessel@eduface.me"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_raM6YJ9yQNwFLMAgz4QCO7AFZ2LXSB4TCkb2GVKU58s", "soort": "call", "datum": "2026-05-13", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "VM ingesproken gevraagd over een status update.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_e5i0nEyTNe0KUDAwkW60bgqTaCKvIIcagJLz4KarP7O", "soort": "meeting", "datum": "2026-08-05", "titel": "Bijpraten ervaringen AI", "duur_min": 30, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "h.grasdijk@noordhoff.nl"], "samenvatting": "- Getest drie AI-tools met docenten en studenten; Eduface-tool scoort goed op gebruiksvriendelijkheid en feedback-structuur.\n- Meeste waarde zit in formatieve feedback en ondersteuning *tijdens* schrijfproces in plaats van feedback achteraf.\n- **Eduface heeft formatieve feedback functionaliteit toegevoegd en leerde van pilot dat consistent feedback beter werkt dan hyperindividualisatie.**\n- Twee opleidingen testen tools in september; resultaten begin oktober bepalen of samenwerking volgt.\n- Volgende meeting 28 augustus waar Eduface formatieve feedback-voorbeelden deelt en haalbaarheid business model nader besproken wordt.\n\n### Onderzoeksresultaten AI-tools\n- Noordhoff heeft drie verschillende AI-tools getest met docenten en studenten, waaronder de tool van Eduface.\n- De onderzoeksperiode was intensief maar nog niet volledig afgerond door interne beslissingen en capaciteitsbeperkingen.\n- Het onderzoek richtte zich op waarde, gebruiksvriendelijkheid en business model viability van de tools.\n\n### Schrijfondersteuning als kernbehoefte\n- Uit alle gesprékken bleek dat de grootste behoefte ligt bij ondersteuning *tijdens* het schrijfproces om studenten te activeren.\n- De meeste opleidingen zien AI als waardevolle aanvulling op hun onderwijs, maar met nuances per type opleiding.\n- Formatieve feedback (tussentijdse ondersteuning) blijkt veel waardevol dan summatieve feedback (feedback achteraf).\n- Sociale en pedagogische opleidingen hebben bedenkingen bij het inzetten van AI voor persoonlijke verhalen en reflectieve opdrachten.\n\n### Eduface-tool sterke punten\n- Gebruiksvriendelijkheid van Eduface-tool zit goed en sluit aan bij uiterlijk en gevoel van Noordhoff-platform.\n- Feedback-structuur is overzichtelijk opgebouwd en sluit goed aan bij wat docenten belangrijk vinden.\n- **Formatieve feedback functionaliteit die Eduface heeft toegevoegd blijkt interessant en relevant voor Noordhoff's behoefte.**\n\n### Juridische en compliance-kwesties\n- Noordhoff heeft legal team en internationaal afdeling die GDPR en gegevensbescherming controleren.\n- Voordat tools ingezet kunnen worden, moet juridisch vastgesteld zijn hoe data veilig wordt opgeslagen en gebruikt.\n- Dit proces is kritiek voor scholen en maakt deel uit van pilot-voorbereiding.\n\n### Pilot-planning en business model\n- Twee opleidingen gaan in september met één tool aan de slag met ~30 studenten voor praktijktesting.\n- De pilot moet duidelijk maken wat werkelijke gebruikskosten zijn en of business model haalbaar is.\n- Noordhoff verwacht begin oktober resultaten zodat EVA (propositiemanager) kan bepalen of samenwerking volgt.\n- **Schrijftrainingshulp is afgevallen; focus ligt op schrijfcoach/ondersteuning.**\n\n### Eduface-innovaties in leerprofielen\n- Eduface werkt aan student-dashboards die groei over tijd tonen op basis van meerdere vakken en opdrachten.\n- **Formatieve feedback is nu gegeven op basis van inleidingen om studenten vroeg in proces te ondersteunen.**\n- **Pilot leerde dat excessieve individualisatie van feedback niet praktisch was; Eduface maakte het consistent.**\n- Docenten kunnen nu groeperen op basis van micro-credentials (sterktes en zwaktes) per student.\n\n### Vervolgstappen en samenwerking\n- Nieuwe meeting gepland voor **vrijdag 28 augustus om 10:00 uur** onder titel 'Bijpraten ervaringen AI'.\n- Eduface zal formatieve feedback-voorbeelden delen zodat beiden kunnen evalueren hoe dit aansluit.\n- Haagse Hogeschool webinar over kans-en-gelijkheidsproject komt later; resultaten kunnen niet nu gedeeld worden.\n- Noordhoff wil meer duidelijkheid over intensiteit van toolgebruik en haalbaarheid business model voordat partners aanbevolen worden.\n\n### Resterende onzekerheden\n- Harald kan nog niet aanraden welke partner Noordhoff moet kiezen vanwege onvoldoende inzicht in werkelijke kosten en rendement.\n- Onderwijs staat onder druk wat investeringen betreft; nieuwe tools moeten inpasbaar zijn zonder extra kosten.\n- Interne capaciteit van Noordhoff's AI-team beperkt; samenwerking met partners is noodzakelijk voor innovatiesnelheid.", "eigen_notitie": "Status: Geen go, geen keuze. Onze categorie (feedback achteraf) is niet waar hun behoefte zit; de opening is de formatieve feedback die Dante in dit gesprek op tafel legde. Besluit valt begin oktober bij Eva Jansen.\n\nWat er gebeurde: Noordhoff testte 3 tools langs schrijftrainer (vooraf) / schrijfcoach (tijdens) / feedbacktool (achteraf). Conclusie uit alle docentgesprekken: de grootste behoefte ligt tijdens het schrijfproces. Schrijftrainer valt af, wij worden nu als \"achteraf\" ervaren. Een concurrent (chatbot-achtige schrijfcoach) krijgt in september wel al een concreet vervolg, 2 klassen / ~30 studenten op verzoek van een klant, om verbruik en kosten te meten. Wij zitten daar niet in. Harald durft Eva nu geen partner aan te bevelen omdat hij geen zicht heeft op gebruik, kosten en rendement. Hogeschooltaal zelf staat ook onder druk: twee opleidingen stappen van de 5-jaars licentie (€60) naar 1 jaar tegen gereduceerd tarief. Eva Jansen, propositiemanager, is de beslisser en is eind augustus terug.\n\nNext action: Voorbeeld formatieve feedback sturen dat Harald intern met Eva kan delen | Dante | vóór 28 aug | hoog\n\nNext action: Vervolggesprek | Dante x Harald | 28 aug 10:00 (staat in Close)\n\nRisk: We worden beoordeeld op de verkeerde categorie terwijl de concurrent in september praktijkbewijs opbouwt dat wij niet hebben. HHS-resultaten mogen nog niet gedeeld, dus we hebben tot oktober weinig hard bewijs.\n\nTwee dingen die ik je wil voorleggen:", "transcript_beschikbaar": true, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-08-05", "volgende_afspraak": null, "aantal_gehad": 4, "gesynct": "2026-08-29 13:35"}}, {"slug": "north-west-university-noordwes-universiteit", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_4c9FAnE3ryS5EPb6zkVo7NiUbqnGmc8dbMqsbaAXo0W", "naam": "North-West University / Noordwes-Universiteit", "url": "https://app.close.com/lead/lead_4c9FAnE3ryS5EPb6zkVo7NiUbqnGmc8dbMqsbaAXo0W/", "lead_status": "Prospect", "opportunity_id": null, "fase": null, "fase_type": null, "waarde": null, "valuta": "EUR", "confidence": null, "close_date": null, "eigenaar": "Eduface CRM", "crm_note": "", "contacten": [{"naam": "Nico van", "titel": "Deputy Director", "email": "nico.vandermerwe@nwu.ac.za", "id": "cont_2JEm8QfHXBtZJU9NgE8yQsi9rbM1UyR9pubu3Zb1aio"}], "gesprekken": [{"id": "acti_M4xQZoXjgdlStTaNEcrHQKZ63jucIgoh1kfJ0jgaff6", "soort": "meeting", "datum": "2026-06-02", "titel": "Discussion about Eduface' suitability for WVET221", "duur_min": 60, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "heleen.jansevanvuuren@nwu.ac.za", "nico.vandermerw , "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_wWKBuMlJKU6PYgvsJ8kBHFIjhMGXd3TdBmbDcuM0D4G", "naam": "Revlab", "url": "https://app.close.com/lead/lead_wWKBuMlJKU6PYgvsJ8kBHFIjhMGXd3TdBmbDcuM0D4G/", "lead_status": "Prospect", "opportunity_id": null, "fase": null, "fase_type": null, "waarde": null, "valuta": "EUR", "confidence": null, "close_date": null, "eigenaar": "Eduface CRM", "crm_note": "", "contacten": [{"naam": "Ben van lustergraaf", "titel": "", "email": "ben@revlab.nl", "id": "cont_PvYPyxFEqx2FpZurDZnV95SU8KNU7e9fZwOFcfw9eLy"}], "gesprekken": [{"id": "acti_CFvuPtJDpuOiWx4FIT5sJNCWs0xPIeYY9wiuGas4AmJ", "soort": "meeting", "datum": "2026-07-28", "titel": "Linkedin contentstrategie, merkverhaal,  contentpijlers etc - Eduface x Revlab", "duur_min": 60, "status": "completed", "deelnemers": ["ben@revlab.nl", "dante.torbed@eduface.me"], "samenvatting": "- Besproken waarom Eduface moeite heeft met consistente LinkedIn-content vanwege druk werkschema en behoefte aan strategische aanpak\n- Uitgelegd dat Eduface AI-feedback-tool voor docenten bouwt die consistentie verbetert, uitval van studenten vermindert en studenttevredenheid verhoogt\n- Geïdentificeerd dat university C-level bestuurders primaire doelgroep zijn die risicoavers zijn en vertrouwde partijen prefereren boven startups\n- Aangekaart dat grote weerstand komt van lange sales cycles (12-16 maanden), behoefte aan meer cases en gevoeligheden rond data privacy en AI-compliance\n- Aanbevolen om drie teamleden afzonderlijk te laten posten met mix van educatieve en voorzichtig geselecteerde persoonlijke content\n\n### Introductie en achtergrond Revlab\n- Ben van de Lustgraaf is copywriter met 15 jaar ervaring en werkt sinds 6-8 maanden samen met Thijs\n- Ben is onlangs naar Spanje geëmigreerd en woont daar nu twee weken\n- Ben had de verzonden content vluchtig doorgenomen en vond het een helder verhaal\n\n### Huidige uitdagingen Eduface\n- Eduface kampt met moeilijkheden om consistent goede ideeën voor LinkedIn-posts te bedenken\n- Het bedrijf werkt in een sector waar zeer zorgvuldige formuleringen belangrijk zijn vanwege verkoop aan universiteiten\n- Het team is te druk met andere taken om tijd te besteden aan creatief ontwikkelen van LinkedIn-content\n- Eduface wil posts plannen op basis van duidelijke strategie die aantoonbaar resultaat oplevert\n\n### Strategie LinkedIn-profilen\n- Eduface overweegt drie persoonlijke profielen in plaats van één bedrijfsprofiel te gebruiken\n- Ben benadrukt dat personal branding belangrijker is dan bedrijfsprofielen, omdat niemand meer via bedrijfsprofielen post\n- Fokus op drie profielen is beter omdat het beter aansluit bij bereik en impact van content\n\n### Wat is Eduface: product en waardepropositie\n- Eduface bouwt een AI-model dat feedback geeft op studentenschrijfopdrachten en helpt docenten met nakijken\n- Het tool is specifiek voor docenten, die feedback-suggesties en cijfersuggesties van het AI-model kunnen goedkeuren of aanpassen\n- Het model is samen met Leiden Universiteit en Radboud Universiteit getraind op onderwijskundige feedback en accurate beoordeling\n- Eduface helpt docenten formatieve feedback efficiënter te geven, wat normaal buiten contracturen gebeurt\n\n### Uitgebreide benefits van Eduface\n- Eduface kan per student een leerprofiel creëren op basis van feedback en cijfers als datapunten\n- Het systeem helpt studenten hun groei over tijd inzichtelijk te maken, wat motivatie verhoogt vergelijkbaar met Strava of Whoop\n- Door beter inzicht in individuele sterke en zwakke punten kunnen gepersonaliseerde leeropdrachten worden gemaakt\n- Beter inzicht motiveert studenten om hun studie af te maken en kan studentenuitval verminderen\n- Studentenuitval verminderen is kostbaar voor universiteiten, omdat zij verdienen wanneer studenten hun studie afmaken\n\n### Doelgroep en hiërarchie in onderwijs\n- De primaire doelgroep zijn university C-level bestuurders, niet docenten\n- Profesoren hebben veel autonomie maar kunnen ook blokkeren; bestuurders zijn essentieel voor doorvoering\n- Doelgroep is gemiddeld 35-50 jaar oud en heeft minimaal 7-9 jaar scholing gehad voordat zij professor werden\n- Bestuurders zijn risicoavers, wat meegenomen moet worden in content strategy\n\n### Pijnpunten universiteiten\n- Docenten experimenteren zelf met ongoedgekeurde AI-tools, wat tegen richtlijnen van universiteiten ingaat\n- Universiteiten willen dat alleen GDPR-compliant en AI-Act-conforme tools worden gebruikt\n- Grote zorg over gegevenslekkage en risico daarvan; universiteiten willen af van big tech-tools\n- Consistentieverschillen ontstaan wanneer meerdere teaching assistants dezelfde opdrachten nakijken met verschillende standaarden\n- Docenten willen formatieve feedback geven maar hebben niet voldoende tijd daarvoor\n\n### Differentiators en kwaliteitsverzekering\n- Eduface heeft een eigen AI-model en host het zelf, in plaats van gebruik te maken van API's zoals ChatGPT of Gemini\n- Dit eigen model zorgt voor gesloten omgeving waarbij data niet in- of uitvloeit en verwijderd wordt\n- Hallucinatieprobleem van AI wordt geminimaliseerd door training op basis van beoordelingsformulieren en opdrachtomschrijvingen\n- Feedback is in 10 van 10 gevallen goed, gebaseerd op training met Leiden en Radboud Universiteit\n\n### Voornaamste weerstand en risico's\n- Grootste hindernis is dat Eduface een startup is en universiteiten voorkeur geven aan vertrouwde partijen boven beste oplossingen\n- Universiteiten prefereren soms oude, vertrouwde software van marktleiders boven innovatieve alternatieven\n- Eduface heeft nog onvoldoende cases en track record (onvoldoende 'skin in the game')\n- Sales cycles zijn extreem lang: minimaal 12-16 maanden per klant\n- Veel weerstand kan worden ondervangen met aantoning van consistentie, kwaliteit en AI-compliance\n\n### Snelle impact bij implementatie\n- Na enkele weken zijn praktische verschillen al merkbaar in tijd bespaard bij feedback geven\n- Na enkele maanden zien universiteiten drastische verbeteringen in consistentie van feedback en cijfers\n- Studententevredenheid stijgt op lange termijn (minimaal één jaar nodig voor zichtbare impact)\n- NSS-scores (studententevredenheid-enquêtes) bepalen universiteitsrankings en zijn cruciaal voor internationale studentenwerving\n\n### Belfast University case study\n- Universiteit van Belfast was op zoek naar AI assessment-tool en had eerst problemen met ander AI-systeem\n- Eduface werd ontmoet op een beurs en daar werd duidelijk dat de kwaliteit van Eduface aanzienlijk beter was\n- Technische superioriteit in AI-model was het doorslaggevende verschil voor keuze voor Eduface\n\n### Marktlandschap en concurrentie\n- In het feedback- en grading-segment zijn relatief weinig serieuze spelers\n- Bestaande spelers in de markt zijn allemaal serieus en goed gekend via beurzen\n- Luchtkastelen zullen snel afvallen omdat sales cycles zo lang zijn (12-16 maanden)\n- EU-regelgeving en hoog risicogehalte in sector maken het moeilijk voor onbetrouwbare partijen om lang te overleven\n\n### Content strategy: wat vermijden\n- Efficiëntie mag niet de hoofdboodschap zijn\n- Persoonlijke posts moeten voorzichtig gebruikt worden; onduidelijk is of academische doelgroep daarop reageert\n- Vermijden van te verkoopende toon ('dit is hoe het werkt, koop ons'); academische mensen zijn daar gevoelig voor\n- Voorkeur voor educatieve content boven pure verkoopaanpak\n\n### Content strategy: aanpak met persoonlijke element\n- Persoonlijke posts met zakelijk element kunnen goed werken; voorbeeld: CEO loopt elke ochtend met hond in bos omdat AI haar hoofd vol maakt\n- Mix van persoonlijk-zakelijk kan netwerkbereik vergroten, maar moet niet te vaak gebruikt worden\n- Vermijden van goedkope vergelijkingen ('mijn kat deed X, dit leerde ik over B2B sales')\n- Naast persoonlijke posts moet focus liggen op expertise, marktinzichten en toekomstige trends\n\n### Rollen en expertise Eduface-team\n- Jeroen is oprichter met commerciële en visionaire rol\n- Menno is AI-bachelor met focus op AI-model en technologie\n- Dante Torbed heeft salesrol en productoptimalisatirol, spreekt veel met klanten over pijnpunten\n- De drie profielen vertegenwoordigen sales, visie en technologie-expertise\n\n### Aanbevelingen voor content-strategy\n- Content moet alle drie lagen van ICP aanspreken: marketing/sales, hoogleraren en AI-specialisten in universiteiten\n- Posts van verschillende teamleden helpen variatie in expertise en perspectief te tonen\n- Dit helpt ook om buiten netwerk van alleen bestuurders uit te breiden naar andere doelgroepen\n- Verschillende experts trekken verschillende kopers aan met verschillende interessegebieden\n\n### Vervolgstappen\n- Ben stuurt een vragenlijst naar Eduface over weerstandspunten om die goed in kaart te brengen\n- Dante wil ook inzicht krijgen in Revlab's processen en werkwijze\n- Er wordt een vervolgafspraak ingepland\n- Contact blijft bestaan gedurende strategieontwikkeling", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_v2QKaFZhRcfj2g8DbEDb9HGVXlcOPxyMRuxJyNbeoWj", "soort": "meeting", "datum": "2026-08-11", "titel": "Ben x Dante", "duur_min": 60, "status": "completed", "deelnemers": ["ben@revlab.nl", "dante.torbed@eduface.me"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-08-11", "volgende_afspraak": null, "aantal_gehad": 2, "gesynct": "2026-08-29 13:35"}}, {"slug": "rijksuniversiteit-groningen", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_QRnRvtAVBv8irHTT7z16S8KMbaVjZ7jLK2Ye74N6p07", "naam": "Rijksuni TCHjk7Hm", "soort": "meeting", "datum": "2025-07-03", "titel": "AI-feedback tool Rijksuniversiteit Groningen", "duur_min": 60, "status": "completed", "deelnemers": ["a.ademiluyi@rug.nl", "b.a.a.beijer@rug.nl", "dante.torbed@eduface.me"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_pqzrfvoNz0nZfgjnqHmVbc6A2kzzmlZMCpqG8HaDLwC", "soort": "meeting", "datum": "2026-03-20", "titel": "Vergadering met Dante Torbed", "duur_min": 60, "status": "completed", "deelnemers": ["a.ademiluyi@rug.nl", "dante.torbed@eduface.me"], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_OfRzQpvlNC4i16e4SNp3zaIRNJJxLNGIVgQnJWeaJPm", "soort": "meeting", "datum": "2026-04-17", "titel": "Vergadering met Dante Torbed", "duur_min": 60, "status": "completed", "deelnemers": ["a.ademiluyi@rug.nl", "dante.torbed@eduface.me"], "samenvatting": "- Board of Examiners meeting held today to decide on Eduface pilot; decision expected by end of day.\n- A.Z. departing for three-week holiday Monday, returning mid-May; all lecturer arrangements already prepared.\n- University maintaining conservative approach to AI due to GDPR concerns and competing internal AI development.\n- Dante to attend in-person presentation with CTO once Board approves, followed by separate policy meeting.\n- A.Z. will coordinate with Bart to identify appropriate contacts (Yap or Alina Klingerberg) for further discussions.\n\n### Progress Update and Current Status\n- A.Z. has already met with lecturers and prepared assignment rubrics for the testing phase.\n- A.Z.'s manager, who heads the education support department, advised waiting for Board of Examiners approval before proceeding.\n- The Board of Examiners had a meeting today to discuss Eduface, with feedback expected by end of day.\n- A.Z. is departing for a three-week holiday starting Monday and will return mid-May.\n- Once approved, all necessary arrangements for lecturer involvement are already prepared.\n\n### Governance and Decision-Making Structure\n- A.Z.'s manager is part of the faculty management board and heads the education support department.\n- The Board of Examiners must approve any tool that will involve student data and assessment.\n- The Board includes IT law lecturers specializing in AI privacy and data protection.\n- Student assignments constitute personal data requiring careful legal and privacy consideration.\n- The university maintains a conservative approach to AI implementation due to GDPR and data privacy concerns.\n\n### Next Steps and Meeting Planning\n- Upon Board approval, A.Z. will schedule a meeting with Eduface and participating lecturers.\n- Dante will attend in person with Eduface's CTO and potentially CEO for the presentation.\n- The meeting will be conducted in Dutch with a 5-10 minute Eduface presentation.\n- A subsequent policy discussion meeting will occur between Eduface and university policy stakeholders.\n- A.Z. will contact Dante via WhatsApp during vacation if Board approval is received.\n\n### Challenges and Political Considerations\n- The university is developing its own AI solution, creating reluctance to invest in external tools.\n- The homegrown AI project will require 5-6 years and significant funding to develop properly.\n- University leadership is extremely cautious about AI implementation to avoid complications.\n- Feedback fruits, which has AI features, is already used but with AI deactivated for the university.\n- A.Z. emphasized the need for careful navigation of institutional politics surrounding AI adoption.\n\n### Key Contacts and Introduction Strategy\n- A.Z. will discuss preferred contacts with Bart at an event later today.\n- Alina Klingerberg, head of exam committee and technology/marketing law professor, is a strong potential contact.\n- Yap, the director of education, is another key person who might facilitate the discussion.\n- A.Z. will provide contact information or facilitate introductions through Bart to avoid political complications.\n- Dante can independently contact these individuals if necessary, though A.Z. prefers to manage introductions carefully.\n\n### Eduface Progress at Other Institutions\n- Eduface is conducting a successful pilot at UMCG with nursing staff providing student feedback.\n- The UMCG use case involves AI-generated feedback suggestions to improve quality and save time.\n- A significant number of nurses are currently using Eduface at UMCG.\n- UMCG's positive experience may help build confidence at Rijksuniversiteit Groningen.\n\n### Webinar and Support Materials\n- Dante hosted a webinar with Belspain University (UK, 30,000 students, ranked 80th) discussing Eduface.\n- Dante offered to create a shorter 5-10 minute version for A.Z. to share with the Board.\n- A.Z. had already shared an article about Eduface with the Board of Examiners previously.\n- The webinar material may provide additional context if needed, though the Board meeting timing makes it less critical.\n\n### Communication Plan and Timeline\n- A.Z. will get back to Dante via WhatsApp as soon as Board decision information is received.\n- Dante hopes to arrange the testing meeting before A.Z.'s three-week vacation begins.\n- A.Z. will contact Dante by end of day today with information about preferred contacts and next steps.\n- Dante will follow up with identified contacts after learning more from Bart.", "eigen_notitie": "http://studiekeuze123.nl/opleidingen/7011-rechtsgeleerdheid-rijksuniversiteit-groningen-wo-bachelor\nhttps://www.rug.nl/staff/j.j.dijkstra/\nhttp://rug.nl/about-ug/latest-news/press-information/scientists-in-focus/aklingenberg?lang=en", "transcript_beschikbaar": true, "komend": false}, {"id": "acti_5fR1KRQswnpvEC5oC4PEv5eztClTnwPE21ZydBuf0Ny", "soort": "call", "datum": "2026-06-25", "titel": "Telefoon outbound", "duur_min": 1, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "VM ingesproken. Wel gemaild en aan gegeven dat ik haar ging bellen. Mailde haar wel laat.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_ftCOjIxFvtbN2ndaeiL5IYsl9G8At7U6rYqWLcEhzx5", "soort": "call", "datum": "2026-06-26", "titel": "Telefoon outbound", "duur_min": 8, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Faculteiten zijn zelf al aan het proberen, zonder goedkeuring. Hoog risico op datalekken en negatieve publiciteit als hier niet snel een oplossing voor in de plaatst komt! PAIN PAIN PAIN.\n\n\n\n'Breder voor iedereen moet het helemaal goed zijn.' -&gt; wil het dus voor iedereen aanbieden, maar noemt wel heel expliciet dat ze ook aan het onderzoeken zijn of ze het zelf kunnen maken. Eigen in BS geïntegreerde Grading tool. \n\nLoopt al langer een voorstadium van breder aanbieden aan een AI grading tool. \n\nEr is enige prioriteit? -&gt; deze vraag kwam er niet lekker uit. \n\nBenieuwd naar hoe onze tool precies werkt. Benieuwd naar ervaringen van andere instellingen. Vragen over EU AI act. Ze hebben allemaal al voorkennis, dus dat betekent goed voorbereiden op deze onderwerpen. Eigen LLM, vinden ze interessant.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_tecti0CvUP4Nh6fAViTUpccqLfq8Uwyp6qmfsdTEqZn", "soort": "meeting", "datum": "2026-06-30", "titel": "Kennismaking RUG x Eduface", "duur_min": 60, "status": "completed", "deelnemers": ["a.l.naber@rug.nl", "dante.torbed@eduface.me", "jeroen.van.gessel@eduface.me", "r.nijenkamp@rug.nl", "t.h.jansen@rug.nl"], "samenvatting": "- Jeroen van Gessel adviseert om toestemming te vragen voordat iemand wordt toegelaten tot een bepaalde functie of groep.\n- De deelnemers bespreken een proces waarin toestemming vooraf moet worden verkregen in plaats van achteraf.\n- Jeroen stelt voor om eerst uit te schakelen en dan om toestemming te vragen voordat opnieuw wordt toegelaten.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_ksQHlx0H8egdhy6MN5dxplLK7KhGLVmJkvzeptMhwdb", "soort": "call", "datum": "2026-07-07", "titel": "Telefoon outbound", "duur_min": 3, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_j4OEG4QraxdoT4lzXzTOX3DdFEJtNI1JppqJcP26SU9", "soort": "call", "datum": "2026-07-16", "titel": "Telefoon outbound", "duur_min": 1, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Niet opgenomen", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_x23zPL3REEoUUAo7x0OzKAaSmpbaDUOWj9xscDf0X02", "soort": "call", "datum": "2026-07-17", "titel": "Telefoon outbound", "duur_min": 6, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_YD0lkQGGz591huO60RINZgg9woDXHHPDA55Akf0aLY0", "soort": "meeting", "datum": "2026-08-21", "titel": "Uitval model", "duur_min": 60, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "jeroen.van.gessel@eduface.me", "r.nijenkamp@rug.nl"], "samenvatting": "- Gepresenteerd uitvalvoorspellingsmodel voor Rijksuniversiteit Groningen dat LMS- en cijferdata gebruikt om studentenuitval vroegtijdig op te sporen.\n- Identificeerde kritieke obstakels: datagewinning, organisatorische communicatie, en feature engineering voor vak-agnostische toepassing.\n- Dashboard voor studieadviseurs bevat geprioriteerde studentelijsten, scenario-exploratie, en explainbare AI-outputs via SHAP-techniek.\n- Eerdere onderzoeken toonden gemengde resultaten; combinatie van algoritme en menselijke expertise werkt beter dan elk afzonderlijk.\n- Project in testfase met volgende stappen inclusief pilot-testen met studieadviseurs en verdere integratie van vakinhoud en LLM-technologie.\n\n### Achtergrond en evolutie van het uitvalvoorspellingsproject\n- Het onderwerp learning analytics werd enkele jaren geleden steeds populairder binnen de universiteit.\n- Initiële process mining analyses leverden weinig op, maar trokken veel belangstelling vanuit het Learning Analytics Team.\n- Het team heeft eerder al aan studentuitvalvoorspelling gewerkt met een model dat vooral op de faculteit Science en Engineering werd toegepast.\n- De voorganger van dit project won destijds ook een prijs voor de voorspellingsaccuratesse.\n- Het huidige project bouwt voort op deze eerdere onderzoeken met een universiteitsbreder perspectief.\n\n### Projectstructuur en dashboards\n- Het project focust op het maken van dashboards voor verschillende doelgroepen, waaronder opleidingsdirecteuren en studieadviseurs.\n- Een curriculum overview dashboard laat zien hoe studenten het doen in vakken, geclusterd naar ability niveau.\n- Het specifieke voorspelmodel voor studieadviseurs is het dashboard waaraan Rob Nijenkamp momenteel werkt.\n- Het team bestaat uit Rob Nijenkamp, een andere data scientist, en sinds kort een computer science ontwikkelaar.\n- Het project gebruikt een Kubernetes-omgeving met Docker en is gebouwd met tools als Python en R met Shiny.\n\n### Data en feature engineering uitdagingen\n- Het grootste obstakel was het verkrijgen van data; niet zozeer vanuit Brightspace, maar door organisatorische en communicatiebarrières.\n- De universiteit heeft nog geen duidelijke data governance, wat onduidelijkheid schept over wie welke data mag gebruiken.\n- Samenwerking tussen teams (IT, databases, Analytics) was aanvankelijk moeilijk, hoewel de lijntjes korter zijn geworden.\n- Feature engineering was zeer complex; features moeten vak-agnostisch zijn voor universiteitsbreed gebruik.\n- Verschillende vakken laten verschillende hoeveelheden datasporen achter, wat comparabiliteit bemoeilijkt.\n\n### Voorspelmodel en gebruikte features\n- Aanvankelijk werd gefocust op cijfers en studiepunten uit het Business Intelligence-systeem.\n- Later werden LMS-features (Brightspace-activiteiten) toegevoegd voor vroegtijdiger voorspellingen zonder tentamencijfers.\n- Gebruikte constructen omvatten participatiematen, consistentie, timing, procrastinatie-aspecten, en entropie.\n- Formatieve assessment-data is voorspellend maar ontbreekt in veel eerstejaarsvakken, vooral in grote opleidingen.\n- Trend-variabelen en grade shock detectie helpen evolutie van studentprestaties over tijd in kaart te brengen.\n\n### Dashboard-features en uitlegbaarheid\n- De studieadviseursdashboard toont een geprioriteerde lijst met dropout risk categorieën (hoog, midden, laag).\n- SHAP-techniek wordt gebruikt om de voorspellingen expliciet te maken en te tonen welke factoren bijdragen aan risicoscores.\n- Een what-if scenario explorer laat zien wat gebeurt als studenten bepaalde herkanzingen halen.\n- Nationaliteit en gendergegevens zijn uit het model verwijderd vanwege ethische en privacy-bedenking.\n- Een tijdlijnvisualisatie toont academisch jaarverloop met vakken, resultaten en vergelijking met peers.\n\n### Ethische overwegingen en AI-verordening\n- Nationaliteit is verwijderd na bezorgdheid over potentiële discriminatie en volkssysteemachtige praktijken.\n- Explainable AI is cruciaal; zwarte doos-voorspellingen kunnen problematisch zijn voor AI-regelgeving.\n- Studieadviseurs moeten kunnen uitleggen waarom bepaalde studenten worden uitgenodigd.\n- Privacy is een aandachtspunt, vooral bij vroege voorspellingen op basis van persoonlijke gegevens.\n- De combinatie van algoritme en menselijk oordeel wordt gezien als beter dan elk afzonderlijk.\n\n### Onderzoeksresultaten en adoptie\n- Eerdere onderzoeken laten gemengde resultaten zien qua voorspellingswaarde van LMS-data.\n- Een MBO-studie toonde aan dat voorspelmodellen niet veel voordeel boden boven studieadviseursintuitie alleen.\n- Combinatie van model en menselijke expertise levert echter wel betere performance op.\n- Sommige studieadviseurs zijn enthousiast, anderen vertrouwen meer op hun eigen algoritme.\n- Adoptie hangt af van hoe het systeem wordt gepresenteerd en hoe gebruiksvriendelijk het is.\n\n### Praktische aanbevelingen uit data-analyse\n- Analyse toonde dat practicum-cijfers weinig variatie vertonen tussen ability-groepen, wat leidde tot aanbevelingen voor pass/fail beoordeling.\n- Theoretische vakken na practicavakken vertonen meer onderscheidend vermogen tussen studentgroepen.\n- Vakcijfers kunnen geclusterd worden op basis van semantische inhoud via tekstanalyse.\n- Alignment-problemen tussen vakken kunnen worden geïdentificeerd via vergelijking van succescriteria.\n- Structuur en kwaliteit van vakopzet bepalen sterk de beschikbaarheid van bruikbare datasporen.\n\n### Geplande volgende stappen en testen\n- Het project plant pilottests met studieadviseurs in het lopende academische jaar.\n- Formeel testen staat gepland omdat het moeilijk is om waardevolle feedback te krijgen op mockups.\n- Het project loopt naar verwachting nog een jaar en bevindt zich nog steeds in de projectfase.\n- Hopelijk evolueert het project naar een meer structurele oplossing na deze fase.\n- Presentaties en kennisuitwisseling met partijen als Eduface staan gepland voor september.\n\n### Potentiële toekomstige uitbreidingen\n- Een chatbot-interface gekoppeld aan LLM's zou kunnen helpen bij gegevensvragen van gebruikers.\n- Integratie van vakinhoud uit cursus-catalogi zou betere contextspecificiteit kunnen geven.\n- Leerlijnen-analyse zou curriculum-coherentie en vakuitlijning kunnen onderzoeken.\n- Combinatie met data-driven skill discovery algoritmes zou complementair kunnen zijn.\n- Student-dashboards zouden een eigen versie van deze visualisaties kunnen hebben via My Ocasis.\n\n### Samenwerking met Eduface en verwante projecten\n- Eduface werkt aan vergelijkbare doelen voor het meten van studentengroei en leren over tijd.\n- Eduface kan automatisch informatie uitlezen uit Brightspace-vakomgevingen en documenten.\n- Beide organisaties werken aan gestandaardiseerde rubrics en succescriteria-bepaling.\n- Gedeelde uitdagingen betreffen vakinconsistenties en onderwijsdatakw d er een opdracht in gestopt. \nEr was een wachtrij van de Bath spa Univerity, dus hierom was zijn opdracht niet klaar. \n\nIk stelde voor om fysiek langs te komen, alleen hij wees mij af. \nHij is wel de persoon die kan kiezen welke platform ze gaan inzetten. \nHij krijgt ook feedback van docenten. \n\nIk moet er gewoon achter komen hoe ik hem kan overtuigen om Eduface te gaan piloten. \n\nDocenten en studenten zijn niet blij met Cognitie. \nIn de podcast spraken ze over dat ze 25 nakijk Agents hebben gebouwd. \n\nBij Salta/LOI zijn de nu bezig met het nakijken van huiswerk. Ik wil erachter komen wie dat project leid en of we mee mogen doen aan die pilot.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_VxwiBgFRAsWpMq1EyesQRJsqHnqYwDKbXGqz82ZtgNf", "soort": "call", "datum": "2026-04-08", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Gesproken: \nZe gaan afstappen van cognitie en zijn momenteel opzoek naar alternatieve. Ze hebben nu Moodle als LMS en gaan naar Brightspace. Ze moeten nu cijfers uit Cogniet halen en handmatige in ist learing zetten. \n\n\nHet zijn 6 locaties, met 200 - 250 studenten. \n\n\nBij Rijksuniversiteit Groningen gebruiken ze Lumi momenteel.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_tcw5lc9Ra510dEHXch0VVCPfxwn8znL2DazbEJoSXDe", "soort": "call", "datum": "2026-05-13", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "VM", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_cTKkvezi3beioEHAjDYwvOiulUGuq2DbLpuav28gwiG", "soort": "meeting", "datum": "2026-08-04", "titel": "AI integrity model | Gideon x Dante", "duur_min": 60, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "g.hummel@tio.nl", "jeroen.van.gessel@eduface.me"], "samenvatting": "- Gepresenteerd Eduface's AI-integriteitmodel met 15-minutenvenster voor AI-gestuurde mondelinge consistentiecontroles na inlevering.\n- Gideon bevestigde dat Cogniti-adoptie moeilijk verloopt vanwege decentrale structuur Tio en dat docenten gebruiksvriendelijker tools prefereren.\n- Jeroen stelde automatische Blackboard-integratie voor die opdrachten importeert, feedback genereert en resultaten exporteert via enkelvoudige syncknop.\n- Vroeger voorstel werd afgewezen wegens kostprijs; Jeroen zal ICM-pilot-voorbeeld sturen om beter aangepast prijsmodel te tonen voor particulier onderwijs.\n- Gideon zal nieuw voorstel deze week met Lucy de Ridder (Salta-directeur) bespreken; EU AI Act-compliance en Nederlands-gebaseerde cloud zijn belangrijke criteria.\n\n### Huidige situatie Tio Business School en Cogniti implementatie\n- Tio Business School heeft cognitieve toetsing ingeregeld met volgende week updates voor hogere uploadlimieten en uitgebreide capaciteit.\n- Visuele aspecten van het systeem worden nog niet goed ondersteund en uitrol is nog niet breedvoerig doorgevoerd.\n- Training voor geïnteresseerde docenten wordt in oktober gegeven, maar adoptie blijft uitdagend vanwege Tio's decentrale organisatiestructuur.\n- Cogniti-agenten moeten manueel worden opgebouwd en verspreid onder docenten, wat veel werk met zich meebrengt.\n- Implementatie in slechts één vak heeft plaatsgevonden met ongeveer twintig agents, maar docenten prefereren ChatGPT en Claude vanwege gebruiksgemak.\n\n### Integratie en adoptie-uitdagingen\n- Cogniti staat volledig los van Blackboard, wat adoptie belemmert zonder systeemintegratie.\n- Jeroen van Gessel presenteerde automatische integratie die Blackboard-opdrachten automatisch importeert en feedback genereert via één syncknop.\n- Deze integratie werkt in Blackboard, Brightspace en binnenkort ook in Moodle als premium partner.\n- Automatische synchronisatie elimineert de noodzaak voor docenten om uitgebreid met agenten te werken voordat zij feedback kunnen geven.\n- Adoptie-probleem is een groot knelpunt; Tio heeft grote moeite docenten te bereiken en te trainen voor nieuwe tools.\n\n### AI-integriteitmodel en consistentiecontrole\n- Eduface heeft een paperfeedback-model ontwikkeld dat nu wordt geïmplementeerd op universiteiten in VK, Nederland en hogescholen.\n- **Nieuw model biedt een 15-minutenvenster na inlevering voor AI-gestuurde mondelinge consistentiecontrole van studentenwerk.**\n- **Model leest gehele opdracht, bronnen en studentenvisie, voert vervolgens mondeling vragentoets uit om inconsistenties op te sporen.**\n- Pilotstudie toonde aan dat studenten hun eigen werk beter bestuderen wanneer zij weten van consistentiecontrole, zelfs bij AI-gebruik.\n- **Mondeling kan thuis op laptop plaatsvinden met optionele camera; model beoordeelt consistentie tussen geschreven werk en mondelinge antwoorden.**\n\n### Leerprofiel en uitbreidde toepassingen\n- Eduface bouwt leerprofielen op via meerdere soorten opdrachten (schrijfopdrachten, mondelingen, tentamens).\n- **Model wordt beschreven als 'Garmin van kennisontwikkeling' die studentengroei visualiseert en voortgang aantoont.**\n- Leerprofielen kunnen worden ingezet voor accreditatie, studentretentie en engagement.\n- Business schools vinden dit model bijzonder relevant omdat het bewijs levert van onderwijskwaliteit.\n- Model wordt al gebruikt op meerdere instellingen en universiteiten voor verschillende toetsingsvormen.\n\n### Tio's visie op AI in onderwijs en huidige strategie\n- Tio werkt aan standaardisering van rubrics met betere richtlijnen voor docenten rond AI-nakijken.\n- Er is geen expliciete verantwoordelijkheid aangesteld voor 'AI-ready' maken van Tio, maar rubricsontwikkeling is gaande.\n- Beweging bestaat om AI te integreren in assessments, variërend van strikte klaslokaal-toetsen tot toetsing met AI-richtlijnen.\n- ROCM (MBO-instelling waar Gideon actief is) maakt casusspecifieke keuzes over hoe AI in toetsing wordt ingezet.\n- Salta Group heeft onlangs AI-personen aangesteld, maar Tio zelf heeft nog niet duidelijke AI-implementatiestrategie.\n\n### Brightspace-migratie en Lumi-testen\n- Lumi-testen worden uitgesteld tot Brightspace-integratie gereed is, waarvan timing onzeker is.\n- Salta Group begint transitie van verschillende LMS-systemen naar Brightspace, maar niet alle labels gebruiken dezelfde systemen.\n- Blackboard wordt geleidelijk uitgefaseerd, hoewel timing hiervan onduidelijk blijft.\n- Tio-onderwijsafdeling heeft beperkte capaciteit, waardoor AI-implementatieprojecten worden uitgesteld.\n- Gideon weet niet wie actief aan Brightspace-migratie werkt vanwege Tio's decentrale structuur.\n\n### Kostenbatenanalyse en prijsmodellering\n- Eerder voorstel van Eduface voor Tio werd afgewezen vanwege te hoge kosten, vooral per-docent-model.\n- Tio heeft veel part-time docenten die slechts enkele opdrachten per semester nakijken, waardoor ROI negatief is.\n- Particulier onderwijs met kleine aantallen studenten en deeltijdse docenten profiteert slecht van per-docent-prijsmodellen.\n- Jeroen biedt aan ICM-opleiding-voorstel en pilot-voorstel te delen als precedent voor beter aangepaste prijsmodellen.\n- Salta Group wordt gezien als grotere business case die internationaal als casestudy kan dienen.\n\n### Integratie met Educator en Excel-export\n- Gideon vraagt om mogelijkheid Excel-bestanden uit Eduface te exporteren voor uploaden in Educator-systeem.\n- Integratie met Blackboard voor automatiseren van processen staat hoog op wensenlijst.\n- Jeroen bevestigt dat deze functies al zijn ingebouwd in huidige tooling.\n- Formatieve feedback-mogelijkheden worden als nuttig beschouwd voor verbeterde gebruikerservaring.\n- Doel is systemen naadloos te laten samenwerken in plaats van aparte tools te gebruiken.\n\n### Volgende stappen en vervolgafspraken\n- Jeroen stuurt nieuw voorstel met ICM-pilot-voorbeeld naar Gideon voor doorgifte aan Lucy de Ridder (directeur kwaliteit Salta Group).\n- Gideon zal voorstel deze week bespreken met Lucy en mogelijke board-goedkeuring voorbereiden.\n- Dante en Jeroen zullen intern voorstel voorbereiden en als feedback binnenkomt, planning hervatten via mail.\n- Lucy de Ridder is Key-decision-maker; educatiequaliteitsdirecteur staat positief tegenover implementatie.\n- **Gideon benadrukt belang van cloud-gebaseerd model op Nederlands grondgebied vanwege EU AI Act-compliance.**\n\n### Kwaliteitsvoordelen van Eduface-model\n- Gideon ziet grootste winst in verbeterde kwaliteit van nakijkwerk door expertise ingebracht in Eduface-tool.\n- Interne tools zouden minder inhoudelijk sterk kunnen zijn ondanks betere afstemming op organisatie.\n- Tool-kennis en doorgevoerde expertise van Eduface bieden waarde die Tio intern moeilijk kan repliceren.\n- Snelheid is geen prioriteit voor particulier onderwijs; kwaliteit en relevantie van feedback zijn essentieel.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_l21OBTq2cufwIWQgk9qcPKGIcMWQk9VKjYr1c3W2EDZ", "soort": "call", "datum": "2026-08-27", "titel": "Telefoon outbound", "duur_min": 0, "status": "answered", "deelnemers": [], "samenvatting": null, "eigen_notitie": "Hij heeft ons terug gebeld \n50 vakken willen beginnen. \n\n10 - 15 K 60 studenten per opdracht 20K - 25K 2K voor de pilot. Betaal termijn van 2 weken. \n\nAanbetaling Ramon over financiën Ze gaan over naar een nieuwe blauw druk van opdracht van ongeveer 15 kantjes. Opdracht worden kleiner. Bij cogniti zijn ze met 25 vakken begonnen. Meeting waarschijnlijk in Hilversum omdat we fysiek Lucie. Gaan spreken en Gideon is daar 2 uur vandaan en sluit online aan. Gideon gaat naar de Hanze hogeschool als docent.", "transcript_beschikbaar": false, "komend": false}, {"id": "acti_D3H1i4PTvZICQGjGr5WP9PGx53kvjN4jjoBgX72JMHa", "soort": "meeting", "datum": "2026-09-03", "titel": "Meeting Tio - Eduface - AI-feedback", "duur_min": 60, "status": "upcoming", "deelnemers": ["calendar@ncoi.entrancemanager.com", "dante.torbed@eduface.me", "g.hummel@tio.nl", "jeroen.van.gessel@eduface.me", "lderidder@saltagro nited States but is primarily focused on European markets.\n- UADE would be Eduface's first Spanish-language implementation, though the platform has been successfully adapted to Arabic, Swedish, and Nordic languages.\n- Eduface's model operates natively in English and translates effectively to other languages.\n\n### Partnership Examples and Potential Connections\n- Eduface has implemented solutions at universities including Rotabout University in the Netherlands and has medical department clients training doctors.\n- UADE expressed interest in connecting with existing Eduface clients among their US partners: San Ignacio University, Florida International University, Arizona State University, Miami Dade College, and Manhattan College.\n- Jeroen offered to connect UADE with other universities using Eduface to facilitate experience and best practice sharing.\n\n### Proposed Next Steps and Decision Process\n- Lucas will compile a detailed feature requirements list in collaboration with a university colleague piloting the exam project, to be shared within one week.\n- A two-week free trial is scheduled for mid-September when Eduface has capacity and when UADE's first exams are occurring.\n- The trial will test the platform using actual historical exams from one to two courses to evaluate real-world performance with actual teachers and corrections.\n- Lucas is responsible for conducting the pilot test; results will then be escalated to a university directory board for final decision-making.\n- UADE aims to select a single grading solution provider rather than implementing multiple platforms.\n\n### Feature Requirements Focus\n- UADE requires the platform to correct paper-based exams with strong focus on course-specific content, rubrics, and instructional materials.\n- The platform must allow uploading of course texts, rubrics, and subject-specific materials to guide the correction process.\n- Success metrics will be defined by UADE's directory board based on organizationa t 45 minutes with your SVP of Education in the next two weeks?"], "risicos": ["EB Ami Bhandari nog nooit gesproken. Zonder haar is er geen uitrolbesluit, alleen een afdelingsaankoop.", "Build-vs-buy is het echte alternatief: Robert schreef zelf UTI's genAI-framework.", "Geen enemy in beeld. Bij AI+beoordeling is er altijd iemand die vindt dat het de instructeursrol uitholt.", "Klimaat: guidance-cut 5 aug + aandeelhoudersonderzoek. Elke nieuwe uitgave wordt voorzichtiger goedgekeurd dan 2 maanden geleden.", "Bath Spa 94% is op geschreven werk, niet op short-answer labs tegen een answer key. Niet als bewijs voor hun geval presenteren.", "30 minuten met 5 mensen. Alleen ruimte voor bevestigen, laten zien, vastzetten."], "bezwaren": ["'We kunnen dit zelf bouwen met ons eigen AI-framework' -> onderscheid framework (governance) van model (onderwijskundig getraind, 435 inzendingen/13 nakijkers gemeten).", "'AI mag geen studenten beoordelen' -> het model stelt voor, de instructeur tekent af; niets bereikt student of gradebook zonder goedkeuring.", "'Wat kost het' -> per active student per maand, schaalt met portfolio; geen getal voordat scope en aantallen vaststaan.", "'Laten we een pilot doen' -> nee: betaalde deployment van 6 maanden op een afgebakende set programma's, met vooraf afgesproken meting en een termination clause."]}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [{"naam": "Robert Jordan", "rol": "champion", "titel": "AVP Instructional Design", "gesproken": true, "notitie": "4 mnd in rol. Eigen budget incl. vendor contracts en invoice approval. Schreef UTI's genAI usage framework (governance, Legal/IT Security/Education, audit-ready). Quality Matters gecertificeerd. Denver, remote van Phoenix HQ."}, {"naam": "Ami Bhandari", "rol": "eb", "titel": "Division SVP Education", "gesproken": false, "notitie": "Columbia MBA, ex-Booz Allen, 7 jaar strategie Lincoln Tech. Publiceerde over middle-skills workforce shortage. Wil de business case, niet de pedagogiek. Geen corporate officer, dus divisie-niveau."}, {"naam": "Nikki Sneddon", "rol": "coach", "titel": "Freelance Instructional Design (ex-Director Education Training & Assessment, 11 jr UTI)", "gesproken": false, "notitie": "Assessment strategy specialist. Bouwde AI Academy bij Moderna met Carnegie Mellon. Geen budget, wel gezag op assessmentkwaliteit."}, {"naam": "Linnea Nigro", "rol": "gebruiker", "titel": "Senior Project Manager - Learning", "gesproken": false, "notitie": "5 jr 9 mnd. Runt course development end-to-end. Ex-Pearson, beheerde daar 3-4M/jr aan vendor agreements. Kan vetoen op workflow-frictie."}, {"naam": "Sherrell E. Smith", "rol": "eb", "titel": "EVP & Chief Academic Officer", "gesproken": false, "notitie": "Corporate officer per FY2025 10-K. Pas relevant bij instellingsbrede uitrol."}], "calls": [], "diagnose": "", "laatst_gecoacht": "2026-09-01"}, "close": {"lead_id": "lead_iERmDIaqQjAukGdBOUKXU5XYUWLBlP86JcjrqRl4lh6", "naam": "Universal Technical Institute", "url": "https://app.close.com/lead/lead_iERmDIaqQjAukGdBOUKXU5XYUWLBlP86JcjrqRl4lh6/", "lead_status": "Prospect", "opportunity_id": null, "fase": null, "fase_type": null, "waarde": null, "valuta": "EUR", "confidence": null, "close_date": null, "eigenaar": "Eduface CRM", "crm_note": "", "contacten": [{"naam": "Robert Jordan", "titel": "", "email": "rjordan@uti.edu", "id": "cont_mVUalBaOCPUrnfDvGXwerQBilnCSz5SLwJCugJMWUmC"}, {"naam": "Linnea Nigro", "titel": "", "email": "lnigro@uti.edu", "id": "cont_smmcDJG0OvZXLcwiOHgpufZsrFSxM3XlDZOaQTJQI5r"}], "gesprekken": [{"id": "acti_Q1sNElbe12gOyBNTV5qYbQi7cAWIMPGnODzWyBQrXlT", "soort": "meeting", "datum": "2026-08-26", "titel": "Robert Jordan and Dante Torbed", "duur_min": 30, "status": "completed", "deelnemers": ["dante.torbed@eduface.me", "rjordan@uti.edu"], "samenvatting": "- Identified urgent instructor time-sink: UTI instructors spend 2–4 hours daily manually grading short-answer lab questions due to Blackboard's inflexible auto-grading.\n- Discussed desired solution: Eduface AI integration into Blackboard to provide immediate student feedback and instructor-verified grading using rubrics or answer keys.\n- Learned Eduface capabilities: Custom-trained AI model delivers point-based grading, inline feedback, and confidence scores while protecting student privacy.\n- Agreed on pilot approach: UTI will provide lab examples and rubrics for a Blackboard-integrated demo before considering full-scale rollout across 20,000 students.\n- Scheduled follow-up demo: Tuesday, 1st at 4pm Netherlands time to review Blackboard integration with sample assignments.\n\n### Company Background and Product Development\n- Dante Torbed is the first employee of Eduface, a company based in the Netherlands founded three and a half years ago.\n- The company was founded to address inconsistent and insufficient feedback from instructors to students due to time constraints.\n- Eduface initially attempted using ChatGPT for feedback generation but found it inconsistent in grading and feedback quality.\n- The company developed its own AI model trained on academic data with universities in the Netherlands and the United Kingdom.\n- The proprietary model ensures persistent, clear, and directional feedback specifically optimized for educational contexts.\n\n### Universal Technical Institute's Current Challenge\n- UTI instructors spend two to four hours daily on manual grading of short-answer questions in lab documents.\n- Current Blackboard short-answer automatic grading systems fail if student responses are not 100 percent character-perfect.\n- Students currently upload fillable PDF lab documents to Blackboard and receive minimal written feedback.\n- The challenge was prompted by a program manager teaching a course for the first time who underestimated grading workload.\n- UTI serves approximately 20,000 students across 16 programs, with all courses containing hands-on digital labs.\n\n### Desired Solution and Implementation Goals\n- Robert Jordan requested integration directly into Blackboard Ultra, UTI's current learning management system.\n- The solution should accept rubrics or documents as a knowledge base for grading and feedback generation.\n- UTI seeks both formative feedback (immediate student feedback on uploads) and summative feedback (instructor review and adjustment).\n- Ideal implementation includes confidence scores indicating AI certainty about grading judgments.\n- The AI should provide feedback within lab documents and generate grading assessments based on point-based scoring systems.\n\n### Eduface Product Capabilities and Features\n- Eduface provides three types of feedback options: general feedback, pair rubric creation for teachers, and inline assignment comments.\n- The platform supports point-based grading and can accept rubrics, answer keys, or contextual documents for model training.\n- Eduface integrates with Blackboard and can access approved documents without exposing private information using only student IDs.\n- The model works with higher education students at diploma and degree-granting levels, with course durations ranging from nine to eighteen months.\n- Dante demonstrated the product showing assignment feedback, rubric-based grading options, and the ability to modify rubric criteria.\n\n### Decision-Making Process and Stakeholders\n- Robert Jordan's senior vice president of education must weigh in on the implementation decision.\n- UTI's legal and IT teams must review the product for security and integration compliance before implementation.\n- If the pilot proves successful, UTI plans full-scale implementation across all programs and students.\n- A pilot program with multiple courses across different campuses is planned before considering organization-wide deployment.\n- A larger stakeholder demo will be scheduled if leadership is satisfied with initial results.\n\n### Next Steps and Follow-up Demo\n- **Dante will create a Blackboard-specif t learning profiles and enable personalized learning interventions.\n- Agreed to arrange meeting with Professor Fabrizio Rigutsi from the newly established AI center to discuss technology adoption, with response expected after summer break.\n\n### University of Ferrara's Organizational Structure and Responsibilities\n- Filippo Carnevali confirmed that writing assignments remain central to assessment and evaluation at the University of Ferrara, appearing in both coursework and final exams.\n- The university recently reorganized its artificial intelligence initiatives into a separate, self-contained department split from e-learning and digital learning.\n- Filippo now operates in the e-learning and digital learning division while AI evaluation responsibilities have been delegated to colleagues in the new AI department.\n- The new AI department acts as a filter and evaluation body, with decision-making authority over technology adoption, pilot organization, and budget allocation.\n- Filippo can flag software to the AI department but cannot make final adoption decisions independently.\n\n### Current Approaches to Academic Integrity and AI Usage\n- The university has not adopted strict guidelines or AI detector tools, as professors decided these approaches have inherent limitations with rapidly evolving AI models.\n- Some professors conduct in-person classroom assessments with laptops to oversee student work directly during assignments.\n- Other professors provide guardrails and guidelines encouraging students to use AI transparently while building trust and accountability through academic contracts.\n- The university relies on existing academic integrity principles rather than new technological enforcement mechanisms.\n- Writing assignments remain central because they combat potential brain rot from AI overuse and are considered superior to oral exams for scaling to large student populations.\n- Students are increasingly interested in AI technologies for receiving initial feedback on written assignments.\n\n### Eduface's AI Integrity Checker Product\n- Dante introduced Eduface's AI Integrity Checker, designed to verify students understand assignment content through rapid oral examinations with an AI agent.\n- The product has students answer specific questions in 30 seconds to one minute, allowing assessment of knowledge rather than authorship.\n- Pilot testing with small groups has shown students prepare thoroughly when aware of oral examinations, encouraging genuine learning.\n- The tool generates a knowledge score and summary but does not assign academic marks in traditional grading formats.\n- Professors can deploy the tool to large cohorts (e.g., 200 students) and review aggregated results rather than individual assessments.\n- The product functions as a learning incentive tool rather than a marking mechanism.\n\n### Learning Analytics and Personalized Learning Vision\n- Filippo highlighted the absence of learning analytics from current AI tools, making it difficult to identify which topics students struggle with or need clarification.\n- Dante demonstrated Eduface's integrated approach combining the AI paper grader, AI integrity checker, and AI exam grader to build individual student learning profiles.\n- The learning profile system would enable anonymized analytics showing which topics students prepare for, time spent on preparation, and identified knowledge gaps.\n- Eduface envisions using learning profiles to create personalized learning experiences by grouping students with similar knowledge gaps and delivering targeted lessons.\n- Filippo expressed interest in the concept but requested practical interface demonstrations to evaluate usability and functionality before committing to adoption.\n\n### University Readiness and Technology Adoption Concerns\n- Filippo noted professors remain suspicious of AI-based assessment software, viewing it as controversial and not yet widely accepted at the university.\n- The university is still in the awareness phase, training professors on artificial intelligence fundamentals rather than advanced applications.\n- Technology evolution has shifted from AI content generation (2025) to feedback and assessment, but local universities lag in adoption sensibility.\n- The university acknowledges technology capability for assisted assessment exists but institutional readiness and professor confidence require further development.\n- Large institutional change toward AI-assisted assessment requires cultural and training shifts beyond technology availability.\n\n### Next Steps and Contact with AI Department\n- Filippo confirmed the new AI department was established only one week prior, with leadership positions still being finalized.\n- Dante identified Professor Fabrizio Rigutsi as a potential contact, likely leading the AI center, though the formal AI department head had not yet been appointed.\n- The university maintains both administrative and academic organizational structures, with the new AI department likely drawing staff from the academic AI center.\n- Filippo agreed to contact Professor Rigutsi to explore interest in meeting with Eduface and to assess technology scouting priorities.\n- Filippo will provide feedback within days but noted summer vacation in Italy may delay responses until August or September.", "eigen_notitie": "", "transcript_beschikbaar": false, "komend": false}], "open_taken": [], "laatste_gesprek": "2026-07-10", "volgende_afspraak": null, "aantal_gehad": 1, "gesynct": "2026-08-29 13:35"}}, {"slug": "university-of-reading", "coach": {"next_action": {"wat": "", "wanneer": "", "wie": "", "waarom": ""}, "prep": {"doel": "", "openers": [], "vragen": [], "risicos": [], "bezwaren": []}, "meddpicc": {}, "gate": {"fase": "", "open": null, "ontbreekt": []}, "stakeholders": [], "calls": [], "diagnose": "", "laatst_gecoacht": ""}, "close": {"lead_id": "lead_VHVrvDSThSeR3a5Q8Pv90kf8Rt2TzoUISYmuquvQYPG", "naam": "University of Reading", "url": "
