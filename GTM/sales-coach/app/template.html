<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Coach — Eduface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002333; --green:#00e075; --green-deep:#007b54;
  --ink-900:#0a2c3b; --ink-700:#2c4a57; --ink-500:#5b7480; --ink-300:#a9bcc4;
  --ink-200:#cdd9de; --ink-100:#e7eef0; --ink-50:#f3f7f8; --white:#fff;
  --bg:var(--white); --surface:var(--ink-50); --fg:var(--navy); --muted:var(--ink-500);
  --border:var(--ink-100); --border-strong:var(--ink-200); --card:var(--white);
  --success:#007b54; --warning:#b26a00; --danger:#b3261e;
  --sidebar-w:264px; --pane:20px; --radius:10px;
  --shadow-sm:0 1px 2px rgba(0,35,51,.06); --shadow-md:0 4px 16px rgba(0,35,51,.08);
}
html[data-theme=dark]{
  --bg:#001a26; --surface:#0a2c3b; --fg:#fff; --muted:#a9bcc4;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2); --card:#0a2c3b;
  --ink-50:#0a2c3b; --ink-100:rgba(255,255,255,.12); --ink-200:rgba(255,255,255,.2);
  --success:#00e075; --warning:#e0a33a; --danger:#ff6b60;
  --shadow-sm:none; --shadow-md:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"League Spartan",Inter,sans-serif;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--green);color:var(--navy)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.side{min-width:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.side-top{padding:16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-family:"League Spartan";font-weight:700;font-size:17px}
.dot-brand{width:9px;height:9px;border-radius:99px;background:var(--green)}
.nav{display:flex;gap:4px;margin-top:14px}
.nav button{flex:1;height:28px;padding:0 2px;font-size:12.5px}
.nav button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.nav button.on{background:var(--navy);color:#fff}
html[data-theme=dark] .nav button.on{background:var(--green);color:var(--navy)}
.search{margin-top:10px;width:100%;height:32px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--bg);color:var(--fg);padding:0 10px;font-size:13px}
.search:focus{outline:2px solid var(--green);outline-offset:-1px}
.side-list{overflow-y:auto;flex:1;padding:8px 8px 24px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  padding:14px 8px 5px;font-weight:600}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;
  font-size:13.5px;line-height:1.3;min-height:32px}
.item:hover{background:var(--ink-100)}
.item.on{background:var(--navy);color:#fff}
html[data-theme=dark] .item.on{background:rgba(0,224,117,.16);color:#fff}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mini{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.on .mini{color:rgba(255,255,255,.7)}
.hdot{width:7px;height:7px;border-radius:99px;flex:none}
.h-ok{background:var(--success)} .h-warn{background:var(--warning)} .h-bad{background:var(--danger)}
.h-idle{background:var(--ink-300)}

.main{padding:28px 32px 96px;max-width:1080px;min-width:0;overflow-x:hidden}
.side-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center}

/* ---------- bits ---------- */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:6px}
.page-h h1{font-size:26px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;
  font-size:12px;font-weight:500;background:var(--ink-100);color:var(--fg)}
.pill.accent{background:rgba(0,224,117,.18);color:var(--green-deep)}
html[data-theme=dark] .pill.accent{color:var(--green)}
.pill.warn{background:rgba(178,106,0,.14);color:var(--warning)}
.pill.bad{background:rgba(179,38,30,.12);color:var(--danger)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pane)}
.sec{margin-top:32px}
.sec>h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2 .cnt{font-size:11px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--border-strong);
  border-radius:var(--radius)}
.mono{font-variant-numeric:tabular-nums}

/* hero: volgende actie */
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
.hero .eyebrow{color:rgba(255,255,255,.6)}
.hero h3{font-size:20px;font-weight:600;margin:6px 0 0}
.hero .meta{display:flex;gap:18px;margin-top:14px;font-size:13px;color:rgba(255,255,255,.72);flex-wrap:wrap}
.hero .why{margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.82);max-width:68ch}

.prep-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.prep-grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}}
.prep-grid h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;margin-bottom:8px}
ul.tight{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.tight li{font-size:13.5px;padding-left:14px;position:relative}
ul.tight li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:99px;
  background:var(--ink-300)}

/* meddpicc */
.medd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.medd{grid-template-columns:repeat(2,1fr)}}
.mcell{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:var(--card);
  border-top:3px solid var(--ink-200)}
.mcell.s3{border-top-color:var(--success)} .mcell.s2{border-top-color:var(--warning)}
.mcell.s1{border-top-color:var(--danger)} .mcell.s0{border-top-color:var(--ink-200)}
.mcell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mcell .st{font-size:13.5px;font-weight:600;margin-top:3px}
.mcell .bw{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.mcell .gat{font-size:12px;color:var(--danger);margin-top:6px;line-height:1.4}

/* gesprekken */
.tl{display:flex;flex-direction:column;gap:8px}
.tlrow{border:1px solid var(--border);border-radius:9px;background:var(--card);overflow:hidden}
.tlhead{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left}
.tlhead:hover{background:var(--ink-50)}
.tldate{font-size:12px;color:var(--muted);width:72px;flex:none;font-variant-numeric:tabular-nums}
.tltitle{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlbody{padding:4px 14px 16px 98px;border-top:1px solid var(--border);font-size:13.5px}
.tlbody h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;margin:16px 0 7px}
.tlbody h5:first-child{margin-top:14px}
.quote{border-left:2px solid var(--ink-200);padding:2px 0 2px 12px;margin:0 0 6px;color:var(--fg);font-style:italic}
.miss{border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:8px;
  padding:11px 13px;margin-bottom:9px;background:var(--bg)}
.miss .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.miss .beter{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border-strong);color:var(--success)}
.pre{white-space:pre-wrap;font-size:13.5px;color:var(--ink-700)}
html[data-theme=dark] .pre{color:var(--ink-300)}

/* ratio bar */
.ratio{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--ink-100);margin:6px 0 4px}
.ratio i{display:block;height:100%}
.ratio .me{background:var(--navy)} html[data-theme=dark] .ratio .me{background:var(--ink-300)}
.ratio .them{background:var(--green)}
.rl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* scores */
.scores{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.score{min-width:88px}
.score .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.bars{display:flex;gap:3px;margin-top:5px}
.bars i{width:14px;height:5px;border-radius:2px;background:var(--ink-100)}
.bars i.f{background:var(--navy)} html[data-theme=dark] .bars i.f{background:var(--green)}
.bars i.f.low{background:var(--danger)} .bars i.f.mid{background:var(--warning)}

/* tabel-achtig */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border);
  font-size:13.5px;width:100%;text-align:left}
.row:hover{background:var(--ink-50)}
.row:last-child{border-bottom:0}
.row .r-nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-why{color:var(--muted);font-size:12.5px;flex:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stakeholders */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.people{grid-template-columns:1fr}}
.person{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:var(--card)}
.person .pn{font-weight:600;font-size:13.5px}
.person .pt{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.tag{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:var(--ink-100);color:var(--ink-700)}
.tag.eb{background:var(--navy);color:#fff}
.tag.champion{background:rgba(0,224,117,.2);color:var(--green-deep)}
html[data-theme=dark] .tag.champion{color:var(--green)}
.tag.enemy{background:rgba(179,38,30,.12);color:var(--danger)}
.tag.niet{background:transparent;border:1px dashed var(--border-strong);color:var(--muted)}

/* trend */
.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.trend{grid-template-columns:1fr}}
.spark{display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:10px}
.spark i{flex:1;background:var(--ink-100);border-radius:2px 2px 0 0;min-height:3px}
.spark i.f{background:var(--navy)} html[data-theme=dark] .spark i.f{background:var(--green)}
.big{font-family:"League Spartan";font-size:30px;font-weight:700;line-height:1;margin-top:6px}
.delta{font-size:12px;font-weight:600}
.up{color:var(--success)} .down{color:var(--danger)}
.kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--border-strong);
  border-radius:4px;padding:1px 5px;color:var(--muted)}
.link{color:var(--green-deep);font-weight:500;text-decoration:none;font-size:13px}
html[data-theme=dark] .link{color:var(--green)}
.link:hover{text-decoration:underline}
/* focus */
.focus-hero{border:1px solid var(--border);border-left:4px solid var(--green);border-radius:12px;
  padding:22px 24px;background:var(--card)}
.focus-hero h2{font-size:22px;font-weight:700;margin:6px 0 0}
.focus-regel{margin-top:16px;padding:14px 16px;background:var(--ink-50);border-radius:9px;font-size:14px;font-weight:500}
.focus-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.bron{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--border);line-height:1.5}

/* zelfscore-gate */
.gate-curtain{border:1px dashed var(--border-strong);border-radius:9px;padding:16px;margin-top:14px;
  background:var(--ink-50)}
.gate-curtain .t{font-weight:600;font-size:13.5px}
.gate-curtain p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;max-width:64ch}
.btn{margin-top:12px;height:30px;padding:0 13px;border-radius:7px;background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:500}
html[data-theme=dark] .btn{background:var(--green);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border-strong)}

/* delta-tabel */
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.cmp th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;padding:0 10px 6px 0}
.cmp td{padding:6px 10px 6px 0;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.cmp td:first-child{font-weight:500}
.dl{font-weight:600;font-size:12px;padding:1px 7px;border-radius:99px;display:inline-block}
.dl.ok{background:rgba(0,224,117,.18);color:var(--green-deep)}
html[data-theme=dark] .dl.ok{color:var(--green)}
.dl.over{background:rgba(179,38,30,.12);color:var(--danger)}
.dl.onder{background:rgba(178,106,0,.14);color:var(--warning)}

/* drills */
.drill{border:1px solid var(--border);border-left:3px solid var(--green-deep);border-radius:9px;
  padding:13px 15px;margin-bottom:10px;background:var(--card)}
.drill .dt{font-weight:600;font-size:13.5px}
.drill .ds{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.drill .do{font-size:13px;margin-top:9px;padding:10px 12px;background:var(--ink-50);border-radius:7px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;line-height:1.5;white-space:pre-wrap}
.band{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}

.stat-row{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <div class="brand"><span class="dot-brand"></span>Sales Coach</div>
      <div class="nav">
        <button data-view="vandaag">Vandaag</button>
        <button data-view="deals">Deals</button>
        <button data-view="focus">Focus</button>
        <button data-view="coach">Coach</button>
      </div>
      <input class="search" id="q" placeholder="Zoek account   /" autocomplete="off">
    </div>
    <div class="side-list" id="list"></div>
    <div class="side-foot">
      <span id="synced"></span>
      <button id="theme" title="Licht of donker">◐</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const DEALS = DATA.deals;
const MEDD = ["metrics","economic_buyer","champion","identify_pain","decision_criteria","decision_process","paper_process","competition"];
const MEDD_LABEL = {metrics:"Metrics",economic_buyer:"Economic buyer",champion:"Champion",identify_pain:"Identify pain",decision_criteria:"Decision criteria",decision_process:"Decision process",paper_process:"Paper process",competition:"Competition"};
const STATE_SCORE = {"":0,"leeg":0,"onbekend":0,"vermoeden":1,"sub":1,"onderbouwd":2,"getest":3,"bevestigd":3,"validated":3};
const FOCUS = DATA.focus || {};
const DIM = FOCUS.dimensies || {};
const SCORE_KEYS = Object.fromEntries(Object.entries(DIM).map(([k,v])=>[k,v.label]));
const FOCUS_DIM = (FOCUS.actief||{}).dimensie || null;
const FASE_ORDER = ["Discovery","Scoping","EB meeting","Validation","Business case","Negotiate","Gewonnen","Verloren","Geen fase"];

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let view = lsGet('sc.view') || 'vandaag';
let current = lsGet('sc.deal') || null;
let query = '';

/* ---------- afgeleide waarden ---------- */
const today = new Date(DATA.gebouwd.slice(0,10));
function daysAgo(d){ if(!d) return null; return Math.round((today - new Date(d))/864e5); }
function meddScore(d){
  const m = d.coach.meddpicc||{}; let s=0,n=0;
  MEDD.forEach(k=>{ const st=(m[k]||{}).state||''; s += STATE_SCORE[st.toLowerCase()]??0; n++; });
  return n? s/(n*3) : 0;
}
function health(d){
  const c=d.close, na=d.coach.next_action||{};
  const stil = daysAgo(c.laatste_gesprek);
  if(c.fase_type==='won') return ['h-ok','Gewonnen'];
  if(c.fase_type==='lost') return ['h-idle','Verloren'];
  if(!c.gesprekken.filter(g=>!g.komend).length) return ['h-idle','Nog geen gesprek'];
  if(!na.wat) return ['h-bad','Geen volgende actie'];
  if(stil!==null && stil>28) return ['h-bad',`${stil} dagen stil`];
  if(stil!==null && stil>14) return ['h-warn',`${stil} dagen stil`];
  if(meddScore(d)<0.34) return ['h-warn','Kwalificatie dun'];
  return ['h-ok','Loopt'];
}
function reviewed(d){ return (d.coach.calls||[]).length; }
function gesprekTotaal(d){ return d.close.gesprekken.filter(g=>!g.komend).length; }
function euro(v){ return v==null? '' : '€'+v.toLocaleString('nl-NL'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nlDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][+m-1]}`; }

/* ---------- sidebar ---------- */
function renderList(){
  const el = document.getElementById('list');
  const q = query.toLowerCase();
  let ds = DEALS.filter(d => !q || d.close.naam.toLowerCase().includes(q));
  if(view==='coach'||view==='focus'){ ds = ds.filter(d=>reviewed(d)>0); }
  const groups = {};
  ds.forEach(d=>{
    let f = d.close.fase || 'Geen fase';
    if(d.close.fase_type==='won') f='Gewonnen';
    if(d.close.fase_type==='lost') f='Verloren';
    (groups[f] ||= []).push(d);
  });
  const order = FASE_ORDER.filter(f=>groups[f]).concat(Object.keys(groups).filter(f=>!FASE_ORDER.includes(f)));
  el.innerHTML = order.map(f=>{
    const rows = groups[f]
      .sort((a,b)=> (b.close.laatste_gesprek||'').localeCompare(a.close.laatste_gesprek||''))
      .map(d=>{
        const [cls] = health(d);
        const r = reviewed(d), t = gesprekTotaal(d);
        return `<button class="item ${current===d.slug?'on':''}" data-deal="${d.slug}">
          <span class="hdot ${cls}"></span><span class="nm">${esc(d.close.naam)}</span>
          <span class="mini">${r?r+'/':''}${t}</span></button>`;
      }).join('');
    return `<div class="grp">${esc(f)} <span class="mini">${groups[f].length}</span></div>${rows}`;
  }).join('') || '<div class="grp">Niets gevonden</div>';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  bind();
}

/* ---------- vandaag ---------- */
function renderVandaag(){
  const actief = DEALS.filter(d=>d.close.fase_type==='active');
  const inGesprek = DEALS.filter(d=>!d.close.fase_type && d.close.gesprekken.length);
  const geen = actief.concat(inGesprek).filter(d=>!(d.coach.next_action||{}).wat && d.close.gesprekken.length);
  const stil = actief.filter(d=>{const n=daysAgo(d.close.laatste_gesprek); return n!==null && n>21;});
  const waardeLbl = actief.length+' opportunities';
  const teReviewen = DEALS.map(d=>{
    const done = new Set((d.coach.calls||[]).map(c=>c.gesprek_id));
    const open = d.close.gesprekken.filter(g=>!g.komend && !done.has(g.id) && (g.transcript_beschikbaar||g.samenvatting));
    return {d, open};
  }).filter(x=>x.open.length).sort((a,b)=>(b.open.at(-1).datum||'').localeCompare(a.open.at(-1).datum||''));
  const zelfscoreOpen = [];
  DEALS.forEach(d=>(d.coach.calls||[]).forEach(c=>{ if(!c.zelfscore) zelfscoreOpen.push({d, c}); }));
  const acties = DEALS.filter(d=>(d.coach.next_action||{}).wat)
    .sort((a,b)=>(a.coach.next_action.wanneer||'9999').localeCompare(b.coach.next_action.wanneer||'9999'));

  const waarde = actief.reduce((s,d)=>s+(d.close.waarde||0),0);
  document.getElementById('main').innerHTML = `
  <div class="page-h"><div>
    <div class="eyebrow">${DATA.gebouwd}</div>
    <h1>Vandaag</h1>
    <div class="sub">${actief.length} lopende deals, ${inGesprek.length} accounts in gesprek zonder opportunity, ${DEALS.length} totaal.</div>
  </div></div>
  <div class="stat-row">
    <div class="stat"><div class="k">Pipeline</div><div class="v">${euro(waarde)}</div><div class="band">${waardeLbl}</div></div>
    <div class="stat"><div class="k">Gecoachte calls</div><div class="v">${DATA.stats.calls_gereviewd}</div></div>
    <div class="stat"><div class="k">Praatratio</div><div class="v">${DATA.stats.praatratio!=null? DATA.stats.praatratio+'%':'—'}</div></div>
    <div class="stat"><div class="k">Zonder volgende actie</div><div class="v">${geen.length}</div></div>
    <div class="stat"><div class="k">Drills open</div><div class="v">${DATA.stats.drills}</div></div>
  </div>
  ${FOCUS.actief? `<div class="focus-hero" style="margin-top:22px">
    <div class="eyebrow">Focus deze maand</div>
    <h2 style="font-size:18px">${esc(FOCUS.actief.vaardigheid)}</h2>
    <div class="band" style="margin-top:6px">${esc(FOCUS.actief.regel)}</div></div>`:''}

  ${sec('Zelfscore openstaand', zelfscoreOpen.length, zelfscoreOpen.map(x=>rowBtn(x.d,
      `${esc(x.c.titel)} · score jezelf voor je de analyse leest`)).join(''))}
  ${sec('Nog te debriefen', teReviewen.length, teReviewen.map(x=>rowBtn(x.d,
      `${x.open.length} gesprek${x.open.length>1?'ken':''} zonder review, laatste ${nlDate(x.open.at(-1).datum)}`)).join(''))}
  ${sec('Geen volgende actie', geen.length, geen.map(d=>rowBtn(d,
      `laatste contact ${nlDate(d.close.laatste_gesprek)||'onbekend'}`)).join(''))}
  ${sec('Stil geworden', stil.length, stil.map(d=>rowBtn(d,
      `${daysAgo(d.close.laatste_gesprek)} dagen geen gesprek`)).join(''))}
  ${sec('Volgende acties', acties.length, acties.map(d=>rowBtn(d,
      `${esc(d.coach.next_action.wat)}${d.coach.next_action.wanneer? ' · '+nlDate(d.coach.next_action.wanneer):''}`)).join(''))}
  `;
  bind();
}
function sec(title, count, html){
  return `<div class="sec"><h2>${title} <span class="cnt">${count}</span></h2>
    ${html? `<div class="card" style="padding:0"><div class="rows">${html}</div></div>`
          : `<div class="empty">Niks. Goed zo.</div>`}</div>`;
}
function rowBtn(d, why){
  const [cls] = health(d);
  return `<button class="row" data-deal="${d.slug}"><span class="hdot ${cls}"></span>
    <span class="r-nm">${esc(d.close.naam)}</span><span class="r-why">${why}</span>
    <span class="mini muted">${d.close.fase||''}</span></button>`;
}

/* ---------- deal ---------- */
function renderDeal(slug){
  const d = DEALS.find(x=>x.slug===slug);
  if(!d) return renderVandaag();
  const c = d.close, co = d.coach, na = co.next_action||{};
  const [hcls, hlabel] = health(d);
  const done = new Set((co.calls||[]).map(x=>x.gesprek_id));

  const hero = na.wat ? `
    <div class="hero">
      <div class="eyebrow">Volgende actie</div>
      <h3>${esc(na.wat)}</h3>
      <div class="meta">
        ${na.wanneer? `<span>Uiterlijk ${nlDate(na.wanneer)}</span>`:''}
        ${na.wie? `<span>${esc(na.wie)}</span>`:''}
        <span>Fase ${esc(c.fase||'—')}</span>
      </div>
      ${na.waarom? `<div class="why">${esc(na.waarom)}</div>`:''}
    </div>` : `<div class="empty">Geen volgende actie vastgelegd. Dat is zelf het risico.
      Vraag Claude: <span class="kbd">/sales-coach prep ${esc(c.naam)}</span></div>`;

  const p = co.prep||{};
  const heeftPrep = p.doel || (p.vragen||[]).length || (p.openers||[]).length || (p.risicos||[]).length || (p.bezwaren||[]).length;
  const fa = FOCUS.actief;
  const prep = heeftPrep ? `<div class="sec"><h2>Voorbereiding volgend gesprek</h2>
    ${p.doel? `<div class="card" style="margin-bottom:14px"><div class="eyebrow">Advance die je wil halen</div>
      <div style="margin-top:6px;font-weight:500">${esc(p.doel)}</div></div>`:''}
    ${fa? `<div class="card" style="margin-bottom:14px;border-left:3px solid var(--green)">
      <div class="eyebrow">Waar je deze maand op oefent</div>
      <div style="margin-top:6px;font-weight:600">${esc(fa.vaardigheid)}</div>
      <div class="band" style="margin-top:5px">${esc(fa.regel)}</div></div>`:''}
    <div class="prep-grid">
      ${lijst('Openen met', p.openers)}
      ${lijst('Vragen die je moet stellen', p.vragen)}
      ${lijst('Risico\'s', p.risicos)}
      ${lijst('Bezwaren die komen', p.bezwaren)}
    </div></div>` : '';

  const m = co.meddpicc||{};
  const meddVul = MEDD.some(k=>(m[k]||{}).state);
  const medd = `<div class="sec"><h2>MEDDPICC <span class="cnt">${Math.round(meddScore(d)*100)}% onderbouwd</span></h2>
    ${meddVul ? `<div class="medd">${MEDD.map(k=>{
      const e = m[k]||{}; const s = STATE_SCORE[(e.state||'').toLowerCase()]??0;
      return `<div class="mcell s${s}"><div class="k">${MEDD_LABEL[k]}</div>
        <div class="st">${esc(e.state||'leeg')}</div>
        ${e.bewijs? `<div class="bw">${esc(e.bewijs)}</div>`:''}
        ${e.gat? `<div class="gat">${esc(e.gat)}</div>`:''}</div>`;
    }).join('')}</div>` : `<div class="empty">Nog niet gescoord. <span class="kbd">/sales-coach review ${esc(c.naam)}</span></div>`}
    ${co.gate && co.gate.fase ? `<div class="card" style="margin-top:12px">
      <div class="eyebrow">Gate ${esc(co.gate.fase)}</div>
      <div style="margin-top:5px;font-weight:600">${co.gate.open? 'Open, door naar de volgende fase':'Dicht'}</div>
      ${(co.gate.ontbreekt||[]).length? `<ul class="tight" style="margin-top:9px">${co.gate.ontbreekt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    </div>`:''}</div>`;

  const gesprekken = `<div class="sec"><h2>Gesprekken <span class="cnt">${co.calls.length} van ${gesprekTotaal(d)} gecoacht</span></h2>
    <div class="tl">${[...c.gesprekken].reverse().map(g=>{
      const r = (co.calls||[]).find(x=>x.gesprek_id===g.id);
      const badge = g.komend? `<span class="pill">staat gepland</span>`
        : r? `<span class="pill accent">gecoacht</span>`
        : (g.transcript_beschikbaar? `<span class="pill warn">transcript klaar</span>`
        : (g.samenvatting? `<span class="pill">samenvatting</span>`:''));
      return `<div class="tlrow"><button class="tlhead" data-toggle="${g.id}">
        <span class="tldate">${nlDate(g.datum)}</span>
        <span class="tltitle">${esc(g.titel)}</span>
        ${g.duur_min? `<span class="mini muted">${g.duur_min}m</span>`:''}
        ${badge}</button>
        <div class="tlbody" id="b-${g.id}" hidden>${callBody(g,r)}</div></div>`;
    }).join('')}</div></div>`;

  const st = co.stakeholders||[];
  const people = st.length? `<div class="sec"><h2>Stakeholders <span class="cnt">${st.length}</span></h2>
    <div class="people">${st.map(p=>`<div class="person"><div class="pn">${esc(p.naam)}</div>
      <div class="pt">${esc(p.titel||'')}</div>
      <span class="tag ${esc((p.rol||'').toLowerCase())} ${p.gesproken?'':'niet'}">${esc(p.rol||'onbekend')}${p.gesproken?'':' · niet gesproken'}</span>
      ${p.notitie? `<div class="pt" style="margin-top:7px">${esc(p.notitie)}</div>`:''}</div>`).join('')}</div></div>`
    : (c.contacten.length? `<div class="sec"><h2>Contacten uit Close</h2><div class="people">${
        c.contacten.map(p=>`<div class="person"><div class="pn">${esc(p.naam)}</div>
        <div class="pt">${esc(p.titel||'')}</div><span class="tag niet">rol niet bepaald</span></div>`).join('')}</div></div>`:'');

  const crm = (c.crm_note || c.open_taken.length)? `<div class="sec"><h2>Uit Close</h2><div class="card">
      ${c.crm_note? `<div class="pre">${esc(c.crm_note)}</div>`:''}
      ${c.open_taken.length? `<h5 class="eyebrow" style="margin-top:14px">Open taken</h5>
        <ul class="tight" style="margin-top:7px">${c.open_taken.map(t=>`<li>${esc(t.tekst)} <span class="muted">${nlDate(t.datum)}</span></li>`).join('')}</ul>`:''}
    </div></div>`:'';

  document.getElementById('main').innerHTML = `
  <div class="page-h">
    <div>
      <div class="eyebrow">${esc(c.fase||'geen opportunity')} ${c.confidence!=null? '· '+c.confidence+'% confidence':''}</div>
      <h1>${esc(c.naam)}</h1>
      <div class="sub"><span class="hdot ${hcls}" style="display:inline-block;margin-right:6px"></span>${hlabel}
        ${c.waarde? ' · '+euro(c.waarde):''} ${c.laatste_gesprek? ' · laatste gesprek '+nlDate(c.laatste_gesprek):''}${c.volgende_afspraak? ' · volgende afspraak '+nlDate(c.volgende_afspraak):''}</div>
    </div>
    <a class="link" href="${c.url}" target="_blank">Open in Close →</a>
  </div>
  ${co.diagnose? `<div class="card" style="margin:18px 0;border-left:3px solid var(--danger)">
      <div class="eyebrow">Diagnose</div><div class="pre" style="margin-top:6px">${esc(co.diagnose)}</div></div>`
    : '<div style="height:18px"></div>'}
  ${hero}
  ${prep}
  ${medd}
  ${gesprekken}
  ${people}
  ${crm}`;
  bind();
}
function lijst(t, arr){
  if(!arr || !arr.length) return '';
  return `<div class="card"><h4>${t}</h4><ul class="tight">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function callBody(g, r){
  let h = '';
  if(r){
    const zs = r.zelfscore;
    if(!zs){
      h += `<div class="gate-curtain"><div class="t">Zelfscore eerst</div>
        <p>De analyse van dit gesprek staat klaar, maar je leert er meer van als je jezelf eerst beoordeelt.
        Vier vragen: hoeveel procent praatte jij, welke actie ging de klant ondernemen, wat was je grootste misser,
        en wat wil deze klant echt. Zeg <span class="kbd">/sales-coach zelfscore ${esc(g.id)}</span> in Claude.</p>
        <button class="btn ghost" data-reveal="${g.id}">Sla over en toon de analyse</button></div>
        <div id="rv-${g.id}" hidden>${coachBody(g,r)}</div>`;
    } else {
      h += cmpBlok(r) + coachBody(g,r);
    }
  }
  if(g.samenvatting) h += `<h5>Notetaker-samenvatting</h5><div class="pre">${esc(g.samenvatting)}</div>`;
  if(g.eigen_notitie) h += `<h5>Eigen notitie</h5><div class="pre">${esc(g.eigen_notitie)}</div>`;
  if(!h) h = `<div class="empty" style="margin-top:14px">Geen inhoud vastgelegd.
    ${g.transcript_beschikbaar? 'Transcript staat klaar in Close: <span class="kbd">/sales-coach debrief</span>':''}</div>`;
  return h;
}
function cmpBlok(r){
  const zs = r.zelfscore||{}, sc = r.scores||{};
  const rows = Object.keys(sc).map(k=>{
    const mij = zs[k], coach = sc[k];
    if(mij==null) return `<tr><td>${SCORE_KEYS[k]||k}</td><td class="muted">niet gescoord</td><td>${coach}</td><td></td></tr>`;
    const d = mij - coach;
    const cls = d===0? 'ok' : (d>0? 'over':'onder');
    const lbl = d===0? 'raak' : (d>0? `${d} te mild`:`${-d} te streng`);
    return `<tr><td>${SCORE_KEYS[k]||k}</td><td>${mij}</td><td>${coach}</td><td><span class="dl ${cls}">${lbl}</span></td></tr>`;
  }).join('');
  let rat = '';
  if(zs.praatratio_schatting!=null && r.praatratio!=null){
    const d = zs.praatratio_schatting - r.praatratio;
    rat = `<tr><td>Praatratio</td><td>${zs.praatratio_schatting}%</td><td>${r.praatratio}%</td>
      <td><span class="dl ${Math.abs(d)<=5?'ok':'over'}">${d>0?'+':''}${d} punt</span></td></tr>`;
  }
  return `<h5>Jouw inschatting tegenover de transcript</h5>
    <table class="cmp"><tr><th>Dimensie</th><th>Jij</th><th>Coach</th><th>Verschil</th></tr>
    ${rat}${rows}</table>
    ${zs.notitie? `<div class="band">Jouw notitie vooraf: ${esc(zs.notitie)}</div>`:''}`;
}
function coachBody(g, r){
  let h = '';
  if(r.praatratio!=null){
    const band = r.praatratio>65
      ? 'Boven de band. Gong (326.000 calls, 2025): gewonnen deals 57% reptijd, verloren 62%. Dat verschil is klein, dus lees dit als vlag, niet als norm. Op een demo hoor je meer te praten.'
      : 'Binnen de band. Gong 2025: gewonnen deals 57% reptijd, verloren 62%.';
    h += `<h5>Praatratio${r.praatratio_bron==='schatting'? ' (geschat, geen opname)':''}</h5>
      <div class="ratio"><i class="me" style="width:${r.praatratio}%"></i><i class="them" style="width:${100-r.praatratio}%"></i></div>
      <div class="rl"><span>Jij ${r.praatratio}%</span><span>${100-r.praatratio}% prospect</span></div>
      <div class="band">${band}</div>`;
  }
  if(r.scores){
    h += `<h5>Score</h5><div class="scores">${Object.entries(r.scores).map(([k,v])=>`
      <div class="score"><div class="k">${SCORE_KEYS[k]||k}${k===FOCUS_DIM?' ★':''}</div><div class="bars">${
        [1,2,3,4,5].map(i=>`<i class="${i<=v?'f '+(v<=2?'low':v<=3?'mid':''):''}"></i>`).join('')}</div></div>`).join('')}</div>`;
  }
  if(r.diagnose) h += `<h5>Wat er gebeurde</h5><div class="pre">${esc(r.diagnose)}</div>`;
  if((r.wins||[]).length) h += `<h5>Goed gedaan</h5><ul class="tight">${r.wins.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if((r.missers||[]).length){
    h += `<h5>Gemist</h5>` + r.missers.map(m=>`<div class="miss">
      ${m.quote? `<div class="lbl">${esc(m.spreker||'Prospect')} zei</div><p class="quote">"${esc(m.quote)}"</p>`:''}
      <div>${esc(m.waarom)}</div>
      ${m.beter? `<div class="beter"><span class="lbl">Zo had je het kunnen zeggen</span><br>${esc(m.beter)}</div>`:''}
    </div>`).join('');
  }
  if((r.meddpicc_verplaatst||[]).length)
    h += `<h5>Verplaatst in MEDDPICC</h5><ul class="tight">${r.meddpicc_verplaatst.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if((r.afspraken||[]).length)
    h += `<h5>Afgesproken</h5><ul class="tight">${r.afspraken.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if((r.drills||[]).length)
    h += `<h5>Oefenen hierop</h5>` + r.drills.map(drillCard).join('');
  return h;
}
function drillCard(d){
  return `<div class="drill"><div class="dt">${esc(d.titel)}</div>
    <div class="ds">${esc(d.situatie)}</div>
    <div class="do">${esc(d.opdracht)}</div></div>`;
}

/* ---------- coach ---------- */
function renderCoach(){
  const alle = [];
  DEALS.forEach(d=>(d.coach.calls||[]).forEach(c=>alle.push({...c, deal:d})));
  alle.sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
  if(!alle.length){
    document.getElementById('main').innerHTML = `<h1>Coach</h1>
      <div class="sub">Nog geen enkel gesprek gedebrieft. Zodra er reviews staan, zie je hier je trend.</div>
      <div class="empty" style="margin-top:22px">Begin met <span class="kbd">/sales-coach debrief &lt;account&gt;</span></div>`;
    return;
  }
  const keys = [...new Set(alle.flatMap(c=>Object.keys(c.scores||{})))];
  const laatste5 = alle.slice(-5), eerste5 = alle.slice(0, Math.max(1, alle.length-5));
  function gem(list, k){ const v=list.map(c=>(c.scores||{})[k]).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }

  const kaarten = keys.map(k=>{
    const nu = gem(laatste5,k), was = gem(eerste5,k);
    const reeks = alle.map(c=>(c.scores||{})[k]).filter(x=>x!=null);
    const d = (nu!=null&&was!=null)? nu-was : null;
    return `<div class="card"><div class="eyebrow">${SCORE_KEYS[k]||k}</div>
      <div class="big">${nu!=null? nu.toFixed(1):'—'}<span style="font-size:14px;color:var(--muted)">/5</span></div>
      ${d!=null? `<div class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)} vs eerder</div>`:''}
      <div class="spark">${reeks.map(v=>`<i class="f" style="height:${v/5*100}%"></i>`).join('')}</div></div>`;
  }).join('');

  const ratios = alle.filter(c=>c.praatratio!=null);
  const ratioKaart = ratios.length? `<div class="card"><div class="eyebrow">Praatratio (jij)</div>
    <div class="big">${Math.round(ratios.slice(-5).reduce((s,c)=>s+c.praatratio,0)/Math.min(5,ratios.length))}%</div>
    <div class="delta ${ratios.at(-1).praatratio>55?'down':'up'}">${ratios.at(-1).praatratio>55?'Je praat te veel, doel is onder 45%':'Binnen de norm'}</div>
    <div class="spark">${ratios.map(c=>`<i class="f" style="height:${c.praatratio}%"></i>`).join('')}</div></div>`:'';

  const missers = alle.slice().reverse().flatMap(c=>(c.missers||[]).map(m=>({...m, c})));
  const patroon = {};
  alle.forEach(c=>(c.patronen||[]).forEach(p=>patroon[p]=(patroon[p]||0)+1));
  const pat = Object.entries(patroon).sort((a,b)=>b[1]-a[1]);

  document.getElementById('main').innerHTML = `
  <div class="page-h"><div><div class="eyebrow">Over ${alle.length} gedebriefte gesprekken</div>
    <h1>Coach</h1><div class="sub">Waar je structureel op vastloopt, en of het beter wordt.</div></div></div>
  <div class="sec"><h2>Trend</h2><div class="trend">${ratioKaart}${kaarten}</div></div>
  ${pat.length? `<div class="sec"><h2>Terugkerende patronen</h2><div class="card" style="padding:0"><div class="rows">
    ${pat.map(([p,n])=>`<div class="row"><span class="r-nm">${esc(p)}</span>
      <span class="r-why">${n}x</span></div>`).join('')}</div></div></div>`:''}
  <div class="sec"><h2>Laatste missers <span class="cnt">${missers.length}</span></h2>
    ${missers.slice(0,12).map(m=>`<div class="miss">
      <div class="lbl">${esc(m.c.deal.close.naam)} · ${nlDate(m.c.datum)}</div>
      ${m.quote? `<p class="quote" style="margin-top:6px">"${esc(m.quote)}"</p>`:''}
      <div>${esc(m.waarom)}</div>
      ${m.beter? `<div class="beter"><span class="lbl">Beter</span><br>${esc(m.beter)}</div>`:''}
    </div>`).join('') || '<div class="empty">Geen missers vastgelegd.</div>'}</div>`;
  bind();
}

/* ---------- focus ---------- */
function renderFocus(){
  const a = FOCUS.actief;
  const alle = [];
  DEALS.forEach(d=>(d.coach.calls||[]).forEach(c=>alle.push({...c, deal:d})));
  alle.sort((x,y)=>(y.datum||'').localeCompare(x.datum||''));
  const drills = alle.flatMap(c=>(c.drills||[]).map(dr=>({...dr, c})));

  if(!a){
    document.getElementById('main').innerHTML = `<h1>Focus</h1>
      <div class="sub">Nog geen focusvaardigheid gezet.</div>
      <div class="empty" style="margin-top:22px">Zeg <span class="kbd">/sales-coach review</span> en ik kies er een op basis van je gedebriefte calls.</div>`;
    return;
  }
  const reeks = alle.slice().reverse().map(c=>(c.scores||{})[a.dimensie]).filter(x=>x!=null);
  const nu = reeks.length? reeks.at(-1) : null;

  document.getElementById('main').innerHTML = `
  <div class="page-h"><div><div class="eyebrow">${nlDate(a.start)} tot ${nlDate(a.eind)}</div>
    <h1>Focus</h1><div class="sub">Eén vaardigheid tegelijk. De rest wordt wel gescoord, maar niet gecoacht.</div></div></div>

  <div class="focus-hero" style="margin-top:18px">
    <div class="eyebrow">Deze maand</div>
    <h2>${esc(a.vaardigheid)}</h2>
    <div class="focus-regel">${esc(a.regel)}</div>
    <div class="focus-meta">
      <span><strong>Meten:</strong> ${esc(a.meetbaar||'')}</span>
      ${nu!=null? `<span><strong>Laatste score:</strong> ${nu}/5</span>`:''}
      <span><strong>Verdict:</strong> ${a.verdict? esc(a.verdict):'nog open'}</span>
    </div>
    ${reeks.length? `<div class="spark" style="max-width:260px">${reeks.map(v=>`<i class="f" style="height:${v/5*100}%"></i>`).join('')}</div>`:''}
    <div class="bron"><strong>Waarom deze:</strong> ${esc(a.waarom)}<br><br>${esc(a.bron||'')}</div>
  </div>

  <div class="sec"><h2>Drills uit je eigen calls <span class="cnt">${drills.length}</span></h2>
    ${drills.length? drills.map(d=>`${drillCard(d)}`).join('')
      : '<div class="empty">Nog geen drills. Die ontstaan vanzelf uit gedebriefte calls.</div>'}
    ${drills.length? `<div class="band" style="margin-top:10px">Plak een opdracht in Claude om te oefenen. De roleplay-vorm staat in
      <span class="kbd">references/sops/cold-call-roleplay-prompt.md</span></div>`:''}</div>

  ${(FOCUS.historie||[]).length? `<div class="sec"><h2>Eerdere focus</h2><div class="card" style="padding:0"><div class="rows">
    ${FOCUS.historie.map(h=>`<div class="row"><span class="r-nm">${esc(h.vaardigheid)}</span>
      <span class="r-why">${esc(h.verdict||'')}</span><span class="mini muted">${nlDate(h.eind)}</span></div>`).join('')}
  </div></div></div>`:''}

  <div class="sec"><h2>Alle dimensies</h2><div class="card" style="padding:0"><div class="rows">
    ${Object.entries(DIM).map(([k,v])=>`<div class="row">
      <span class="r-nm">${esc(v.label)}${k===FOCUS_DIM?' ★':''}</span>
      <span class="r-why" style="flex:3;white-space:normal">${esc(v.uitleg)}</span></div>`).join('')}
  </div></div></div>`;
  bind();
}

/* ---------- routing ---------- */
function render(){
  renderList();
  if(view==='vandaag') renderVandaag();
  else if(view==='focus') renderFocus();
  else if(view==='coach') renderCoach();
  else if(current) renderDeal(current);
  else { const d=DEALS.filter(x=>x.close.fase_type==='active')[0]||DEALS[0]; current=d?d.slug:null; current? renderDeal(current):renderVandaag(); }
  document.getElementById('synced').textContent = 'Gesynct ' + DATA.gebouwd.slice(0,10);
  window.scrollTo(0,0);
}
function bind(){
  document.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{
    current=b.dataset.deal; view='deals'; save(); render();
  });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('b-'+b.dataset.toggle); el.hidden=!el.hidden;
  });
  document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{
    document.getElementById('rv-'+b.dataset.reveal).hidden=false; b.remove();
  });
}
function save(){ lsSet('sc.view',view); if(current) lsSet('sc.deal',current); }
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{ view=b.dataset.view; save(); render(); });
document.getElementById('q').oninput = e=>{ query=e.target.value; renderList(); };
document.getElementById('theme').onclick = ()=>{
  const cur = document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=cur; lsSet('sc.theme',cur);
};
{ const t=lsGet('sc.theme'); if(t) document.documentElement.dataset.theme=t;
  else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme='dark'; }
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.id!=='q'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key==='Escape'){ document.getElementById('q').blur(); }
  if(e.key==='1'&&!e.metaKey&&document.activeElement.id!=='q'){ view='vandaag';save();render(); }
  if(e.key==='2'&&document.activeElement.id!=='q'){ view='deals';save();render(); }
  if(e.key==='3'&&document.activeElement.id!=='q'){ view='focus';save();render(); }
  if(e.key==='4'&&document.activeElement.id!=='q'){ view='coach';save();render(); }
});
render();
</script>
</body>
</html>
