<!doctype html>
<html><head><meta charset="utf-8">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:900px}body{display:flex;align-items:center;justify-content:center}svg{display:block}</style></head>
<body>
<!-- NSS turnaround — flat style on solid navy: stopwatch + rising bars + upward arrow -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#002333"/>
  <ellipse cx="500" cy="712" rx="220" ry="34" fill="#001520"/>

  <!-- rising bars -->
  <g>
    <rect x="742" y="556" width="62" height="120" rx="26" fill="#00b85f"/>
    <rect x="828" y="486" width="62" height="190" rx="26" fill="#00c95c"/>
    <rect x="914" y="396" width="62" height="280" rx="26" fill="#00e075"/>
  </g>

  <!-- upward arrow -->
  <g stroke="#00e075" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M705 650 Q855 615 945 392"/>
  </g>
  <path d="M957 363 L984 408 L906 376 Z" fill="#00e075" stroke="#00e075" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- stopwatch -->
  <g transform="translate(500 478)">
    <rect x="-22" y="-228" width="44" height="44" rx="18" fill="#e8eef2"/>
    <rect x="-46" y="-244" width="92" height="30" rx="15" fill="#00e075"/>
    <circle cx="0" cy="0" r="186" fill="#06314a" stroke="#ffffff" stroke-width="16"/>
    <path d="M0 -150 A150 150 0 0 1 130 75" fill="none" stroke="#00e075" stroke-width="16" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-122"/><line x1="0" y1="150" x2="0" y2="122"/>
      <line x1="-150" y1="0" x2="-122" y2="0"/><line x1="150" y1="0" x2="122" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="86" y2="-104" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="17" fill="#00e075"/>
  </g>
</svg>
</body></html>
