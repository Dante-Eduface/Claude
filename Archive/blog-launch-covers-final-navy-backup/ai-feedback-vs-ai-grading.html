<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:900px}body{display:flex;align-items:center;justify-content:center}svg{display:block}</style></head><body>
<!-- feedback vs grading: speech bubble (feedback) vs medal/rosette (grading) -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#002333"/>
  <ellipse cx="380" cy="742" rx="170" ry="30" fill="#001520"/>
  <ellipse cx="820" cy="742" rx="170" ry="30" fill="#001520"/>
  <line x1="600" y1="220" x2="600" y2="660" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="4 22" stroke-linecap="round"/>
  <!-- feedback bubble (green) -->
  <path d="M230 280 h300 a36 36 0 0 1 36 36 v150 a36 36 0 0 1 -36 36 h-200 l-60 64 v-64 h-40 a36 36 0 0 1 -36 -36 v-150 a36 36 0 0 1 36 -36 Z" fill="#00d563"/>
  <g stroke="#002333" stroke-width="18" stroke-linecap="round"><line x1="250" y1="350" x2="500" y2="350"/><line x1="250" y1="400" x2="460" y2="400"/><line x1="250" y1="450" x2="420" y2="450"/></g>
  <!-- grading medal/rosette (white + green) -->
  <circle cx="820" cy="400" r="120" fill="#ffffff"/>
  <circle cx="820" cy="400" r="120" fill="none" stroke="#00e075" stroke-width="16"/>
  <path d="M780 510 L740 640 L820 600 L900 640 L860 510 Z" fill="#00e075"/>
  <path d="M788 388 l24 26 l44 -56" stroke="#002333" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg></body></html>
