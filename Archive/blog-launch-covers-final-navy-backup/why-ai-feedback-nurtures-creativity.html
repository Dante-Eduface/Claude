<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:900px}body{display:flex;align-items:center;justify-content:center}svg{display:block}</style></head><body>
<!-- creativity: lightbulb with a clean upward sprout inside -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#002333"/>
  <ellipse cx="600" cy="742" rx="160" ry="28" fill="#001520"/>
  <!-- rays -->
  <g stroke="#00e075" stroke-width="16" stroke-linecap="round">
    <line x1="600" y1="120" x2="600" y2="166"/>
    <line x1="418" y1="196" x2="450" y2="228"/>
    <line x1="782" y1="196" x2="750" y2="228"/>
    <line x1="360" y1="410" x2="406" y2="410"/>
    <line x1="840" y1="410" x2="794" y2="410"/>
  </g>
  <!-- bulb -->
  <circle cx="600" cy="412" r="150" fill="#06314a" stroke="#ffffff" stroke-width="16"/>
  <!-- base -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="0">
    <rect x="556" y="556" width="88" height="40" rx="12"/>
    <rect x="572" y="596" width="56" height="34" rx="12"/>
  </g>
  <rect x="556" y="566" width="88" height="6" fill="#06314a"/>
  <rect x="556" y="582" width="88" height="6" fill="#06314a"/>
  <!-- sprout: stem + two clean leaves pointing up -->
  <path d="M600 482 V392" stroke="#00e075" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="566" cy="392" rx="22" ry="46" fill="#00d563" transform="rotate(-36 566 392)"/>
  <ellipse cx="634" cy="392" rx="22" ry="46" fill="#00e075" transform="rotate(36 634 392)"/>
  <circle cx="600" cy="372" r="13" fill="#00e075"/>
</svg></body></html>
