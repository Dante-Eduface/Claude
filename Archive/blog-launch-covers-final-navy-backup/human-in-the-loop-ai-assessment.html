<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:900px}body{display:flex;align-items:center;justify-content:center}svg{display:block}</style></head><body>
<!-- human in the loop: circular arrow around a person + check -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#002333"/>
  <ellipse cx="600" cy="742" rx="200" ry="30" fill="#001520"/>
  <!-- loop arrow (almost full circle, clockwise) -->
  <path d="M600 250 A176 176 0 1 1 424 426" stroke="#00e075" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M566 232 L612 246 L598 292 Z" fill="#00e075" stroke="#00e075" stroke-width="8" stroke-linejoin="round"/>
  <!-- person inside -->
  <circle cx="600" cy="392" r="64" fill="#ffffff"/>
  <path d="M504 556 a96 84 0 0 1 192 0 Z" fill="#ffffff"/>
  <!-- check badge -->
  <circle cx="724" cy="556" r="50" fill="#00e075" stroke="#002333" stroke-width="10"/>
  <path d="M700 554 l16 18 l34 -40" stroke="#002333" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg></body></html>
