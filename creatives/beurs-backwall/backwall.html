<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beurs backwall</title>
<style>
  /* Canvas: 1 px = 1 mm. Wand is 2954 x 2520 mm. */
  @font-face { font-family: "League Spartan"; font-weight: 700; src: url("../../Design/Merk/fonts/LeagueSpartan-Bold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Design/Merk/fonts/Inter-Regular.ttf"); }
  :root { --w: 2954px; --h: 2520px; --navy: #002333; --green-deep: #007b54; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  .wall {
    position: relative; width: var(--w); height: var(--h); overflow: hidden; color: var(--navy);
    background:
      radial-gradient(ellipse 80% 45% at 90% 52%, #f9f8f7 0%, rgba(249,248,247,0) 100%),
      linear-gradient(180deg, #dce7ee 0%, #e2edf1 20%, #ecf3f5 40%, #f4f6f6 55%, #eff3f3 70%, #e4edf1 90%, #dde8ee 100%);
  }
  .abs { position: absolute; }

  /* laag 1: logo rechtsonder, 420 mm breed, 128 mm marge */
  .logo { position: absolute; right: 128px; bottom: 128px; width: 420px; height: auto; }

  /* laag 2: twee losse stats. Geen kaart: groot icoon met schaduw, cijfer boven, label eronder.
     Blok A: icoon links. Blok B: gespiegeld, icoon rechts. Zo lijken ze niet op elkaar. */
  .stat { position: absolute; left: 128px; display: flex; align-items: center; gap: 64px; }
  .stat.flip { flex-direction: row-reverse; justify-content: flex-end; }
  .icon { flex: none; filter: drop-shadow(0 14px 16px rgba(0,35,51,.16)) drop-shadow(0 44px 48px rgba(0,35,51,.22)); }
  .num { font: 700 280px/.78 "League Spartan", sans-serif; letter-spacing: -.02em; color: var(--green-deep); white-space: nowrap; }
  .lbl { font: 700 60px/1.05 "League Spartan", sans-serif; letter-spacing: -.01em; color: var(--navy); margin-top: 44px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="wall" id="wall">
    <div id="layer-content"></div>
    <img class="logo" src="../../Design/Merk/logos/logo_navy.png" alt="Eduface">
  </div>

<script>
const NAVY = '#002333', INK2 = '#cdd9de';
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
const svg=(inner,size=400)=>`<svg class="icon" width="${size}" height="${size}" viewBox="0 0 400 400">${inner}</svg>`;

/* Accuraatheid: roos met pijl */
const target = svg(
  [172,116,60].map(r=>`<circle cx="200" cy="200" r="${r}" fill="#fff" stroke="${NAVY}" stroke-width="22"/>`).join('') +
  `<circle cx="200" cy="200" r="28" fill="${NAVY}"/>
   <line x1="206" y1="194" x2="338" y2="62" stroke="${NAVY}" stroke-width="20" stroke-linecap="round"/>
   <line x1="338" y1="62" x2="378" y2="62" stroke="${NAVY}" stroke-width="18" stroke-linecap="round"/>
   <line x1="338" y1="62" x2="338" y2="22" stroke="${NAVY}" stroke-width="18" stroke-linecap="round"/>`);

/* Tijdwinst: papieren, klok (48,5% van de ring gevuld), pijl omlaag */
function clockBase(cx,cy,r,sw,progress){
  const [x1,y1]=polar(cx,cy,r,progress*360), [x0,y0]=polar(cx,cy,r,0);
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK2}" stroke-width="${sw}"/>
    <path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" fill="none" stroke="${NAVY}" stroke-width="${sw}"/>
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r*.62}" stroke="${NAVY}" stroke-width="${sw*.55}" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${cx+r*.34}" y2="${cy+r*.2}" stroke="${NAVY}" stroke-width="${sw*.55}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${sw*.5}" fill="${NAVY}"/>`;
}
const papers = svg(`
  <rect x="40" y="46" width="190" height="250" rx="22" fill="#fff" stroke="${NAVY}" stroke-width="16" transform="rotate(-7 135 171)"/>
  <rect x="90" y="76" width="190" height="250" rx="22" fill="#fff" stroke="${NAVY}" stroke-width="16"/>
  <line x1="126" y1="136" x2="244" y2="136" stroke="${INK2}" stroke-width="12" stroke-linecap="round"/>
  <line x1="126" y1="174" x2="244" y2="174" stroke="${INK2}" stroke-width="12" stroke-linecap="round"/>
  <line x1="126" y1="212" x2="204" y2="212" stroke="${INK2}" stroke-width="12" stroke-linecap="round"/>
  <circle cx="275" cy="300" r="92" fill="#fff"/>
  ${clockBase(275,300,72,20,.485)}
  <line x1="350" y1="22" x2="350" y2="150" stroke="${NAVY}" stroke-width="24" stroke-linecap="round"/>
  <polyline points="316,114 350,154 384,114" fill="none" stroke="${NAVY}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>`);

const stat = (top, flip, icon, num, label) => `
  <div class="stat${flip ? ' flip' : ''}" style="top:${top}px; ${flip ? 'left:340px' : ''}">
    ${icon}
    <div><div class="num">${num}</div><div class="lbl">${label}</div></div>
  </div>`;

document.getElementById('layer-content').innerHTML =
  stat(320,  false, target, '96%',   'grading accuracy') +
  stat(900,  true,  papers, '48.5%', 'less time spent grading');
</script>
</body>
</html>
