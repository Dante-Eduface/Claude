<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beurs backwall</title>
<script src="assets/icons/icons.js"></script>
<style>
  /* Canvas: 1 px = 1 mm. Wand 2954 x 2520 mm. De kop van de gevel staat NIET op de wand. Elk vlak heeft zijn eigen kop.
     Links wit = Chatbots (het probleem), rechts navy = Eduface (de oplossing). Twee rijen, per rij een paar op één lijn.
     Daaronder Eduface AI over de volle breedte, dan de LMS-rij gecentreerd. Iconen: Lucide (ISC).
     Lettersysteem: L 108 Inter (quotes) / M 84 League Spartan (koppen) / S 46 Inter (bronnen, labels) / XL 150 Spartan (alleen het getal). */
  @font-face { font-family: "League Spartan"; font-weight: 700; src: url("../../Design/Merk/fonts/LeagueSpartan-Bold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Design/Merk/fonts/Inter-Regular.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: local("Inter Bold"), local("Inter-Bold"), url("file:///usr/share/fonts/opentype/inter/Inter-Bold.otf"); }
  :root { --w: 2954px; --h: 2520px; --navy: #002333; --g: #00e075; --g6: #008f5a; --i7: #2c4a57; --i5: #5b7480; --i3: #a9bcc4; --i50: #f3f7f8; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  .wall {
    position: relative; width: var(--w); height: var(--h); overflow: hidden; color: var(--navy);
    background:
      radial-gradient(ellipse 80% 45% at 90% 52%, #f9f8f7 0%, rgba(249,248,247,0) 100%),
      linear-gradient(180deg, #dce7ee 0%, #e2edf1 20%, #ecf3f5 40%, #f4f6f6 55%, #eff3f3 70%, #e4edf1 90%, #dde8ee 100%);
  }

  .g { position: absolute; left: 128px; top: 128px; width: 2698px; display: grid; grid-template-columns: 1520px 96px 1082px; grid-template-rows: auto auto auto auto; }
  .pl, .pr { grid-row: 1 / 4; border-radius: 56px; }
  .pl { grid-column: 1; background: #fff; box-shadow: 0 10px 28px rgba(0,35,51,.08), 0 50px 110px rgba(0,35,51,.16); }
  .pr { grid-column: 3; background: var(--navy); box-shadow: 0 14px 34px rgba(0,35,51,.28), 0 60px 130px rgba(0,35,51,.34); }
  .cl, .cr, .cm { z-index: 1; display: flex; }
  .cl { grid-column: 1; padding: 0 68px; color: var(--navy); }
  .cr { grid-column: 3; padding: 0 68px; color: #fff; }
  .cm { grid-column: 2; justify-content: center; align-items: flex-start; padding-top: 50px; }
  .r0 { grid-row: 1; } .r1 { grid-row: 2; } .r2 { grid-row: 3; }
  .r0 { align-items: center; padding-top: 52px; padding-bottom: 60px; height: 192px; }
  .pair { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 16px; padding-top: 20px; padding-bottom: 20px; }
  .r2.pair { padding-bottom: 56px; }

  /* koppen: bepalen meteen wat eronder staat */
  .hd { font: 700 96px/1 "League Spartan"; letter-spacing: -.02em; color: var(--navy); }
  .r0.cr img { height: 104px; width: auto; }

  .it { flex: none; width: 140px; height: 140px; border-radius: 38px; display: flex; align-items: center; justify-content: center; }
  .it svg { width: 88px; height: 88px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cl .it { background: #e6edf0; } .cl .it svg { stroke: var(--navy); }
  .cr .it { background: #fff; }    .cr .it svg { stroke: var(--g6); }
  .cm svg { width: 64px; height: 64px; fill: none; stroke: var(--i3); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .qt { font: 400 108px/1.14 Inter; color: var(--navy); letter-spacing: -.01em; }
  .qt .qm { font: 700 108px/1 "League Spartan"; color: var(--i3); margin-right: 8px; }
  .qt mark { background: rgba(0,35,51,.08); color: inherit; padding: 0 12px; margin: 0 -12px; border-radius: 14px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .who { font: 400 46px/1.2 Inter; color: var(--i5); margin-top: 16px; }
  .eh { font: 700 96px/1.08 "League Spartan"; letter-spacing: -.015em; color: #fff; }
  .eh span { color: var(--g); }

  /* Eduface AI onder de twee vlakken, over de volle breedte (zoals op de afbeelding) */
  .ai { grid-column: 1 / 4; grid-row: 4; margin-top: 56px; background: var(--i50); border-radius: 48px; padding: 52px 72px; display: flex; align-items: center; justify-content: space-between; gap: 80px;
        box-shadow: 0 8px 22px rgba(0,35,51,.06), 0 40px 90px rgba(0,35,51,.12); }
  .ai .top { display: flex; align-items: flex-end; gap: 22px; }
  .ai .top img { height: 84px; width: auto; }
  .ai .top .t { font: 700 70px/.76 "League Spartan"; color: var(--navy); letter-spacing: -.01em; }
  .ai .n { font: 700 160px/1 "League Spartan"; letter-spacing: -.025em; margin-top: 14px; color: var(--navy); }
  .ai .l { font: 400 46px/1.2 Inter; color: var(--i5); margin-top: 6px; }
  .ai .d { font: 400 56px/1.3 Inter; color: var(--navy); max-width: 1180px; }
  .ai .d b { font-weight: 700; }

  /* LMS-rij: label en logo's gecentreerd, op de breedte van de kaart */
  .lms { position: absolute; left: 128px; width: 2698px; top: 2226px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .lms .lab { font: 400 46px/1 Inter; color: var(--i5); white-space: nowrap; }
  .lms .row { display: flex; align-items: center; justify-content: center; gap: 110px; }
  .lms img { height: 66px; width: auto; filter: grayscale(1) contrast(.9); opacity: .5; }
</style>
</head>
<body>
  <div class="wall" id="wall">
    <div id="layer-content"></div>
  </div>

<script>
const ic=(n)=>`<svg viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const R0='[job title], public university', R1='Head of academic innovation, private university';
/* Quotes: formulering van Dante, 25-11-2026. Quote 2: bron in de case study, herschreven zin nog niet aan die persoon voorgelegd (V15). Quote 1: functietitel onbekend (V17). */
const Q=[{ic:'dices',t:'Same rubric, same essay, uploaded twice. <mark>Two different grades.</mark>',w:R0},
         {ic:'bot',t:'After a few essays it goes generic. <mark>Every student gets the same feedback.</mark>',w:R1}];
const A=[{ic:'graduation-cap',h:'Trained on how <span>instructors grade.</span>'},
         {ic:'messages-square',h:'Feedback <span>per student.</span>'}];
let h='<div class="pl"></div><div class="pr"></div>';
h+=`<div class="cl r0"><div class="hd">Chatbots</div></div><div class="cr r0"><img src="assets/logos/eduface-white.png"></div>`;
Q.forEach((q,i)=>{
  h+=`<div class="cl pair r${i+1}"><div class="it">${ic(q.ic)}</div><div><div class="qt"><span class="qm">“</span>${q.t}</div><div class="who">${q.w}</div></div></div>`;
  h+=`<div class="cm r${i+1}">${ic('arrow-right')}</div>`;
  h+=`<div class="cr pair r${i+1}"><div class="it">${ic(A[i].ic)}</div><div class="eh">${A[i].h}</div></div>`;
});
h+=`<div class="ai"><div><div class="top"><img src="../../Design/Merk/logos/logo_navy.png"><div class="t">AI</div></div><div class="n">250,000</div><div class="l">education-specific feedback examples</div></div>
  <div class="d">Developed with the help of <b>Leiden University</b> and <b>Radboud University.</b></div></div>`;
const lms=`<div class="lms"><div class="lab">Integrated with your LMS</div><div class="row"><img src="assets/logos/lms-canvas.png"><img src="assets/logos/lms-moodle.png"><img src="assets/logos/lms-blackboard.png"><img src="assets/logos/lms-brightspace.png"></div></div>`;
document.getElementById('layer-content').innerHTML=`<div class="g">${h}</div>${lms}`;
</script>
</body>
</html>
