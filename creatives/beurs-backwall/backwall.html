<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beurs backwall</title>
<style>
  /* Canvas: 1 px = 1 mm. Wand is 2954 x 2520 mm. */
  @font-face { font-family: "League Spartan"; font-weight: 700; src: url("../../Design/Merk/fonts/LeagueSpartan-Bold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Design/Merk/fonts/Inter-Regular.ttf"); }
  :root {
    --w: 2954px; --h: 2520px;
    --navy: #002333; --green: #00e075; --ink-700: #2c4a57; --white: #ffffff;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  .wall {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    background:
      radial-gradient(ellipse 80% 45% at 90% 52%, #f9f8f7 0%, rgba(249,248,247,0) 100%),
      linear-gradient(180deg, #dce7ee 0%, #e2edf1 20%, #ecf3f5 40%, #f4f6f6 55%, #eff3f3 70%, #e4edf1 90%, #dde8ee 100%);
    color: var(--navy);
  }
  .abs { position: absolute; }

  /* laag 1: logo rechtsonder, 420 mm breed, 128 mm marge */
  .logo { position: absolute; right: 128px; bottom: 128px; width: 420px; height: auto; }

  /* laag 2: cijfers en objecten */
  .num { font-family: "League Spartan", sans-serif; font-weight: 700; line-height: .78; letter-spacing: -.02em; white-space: nowrap; }
  .lbl { font-family: "Inter", sans-serif; font-weight: 400; color: var(--ink-700); line-height: 1.1; white-space: nowrap; }

  /* laag 2: twee kaarten. Radius = radius-2xl (20) x3, schaduw = schaduw-lg x3, navy-getint. */
  .card {
    position: absolute; top: 300px; width: 1301px; height: 1520px;
    background: #ffffff; border-radius: 60px; padding: 110px 96px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
    box-shadow: 0 6px 18px rgba(0,35,51,.08), 0 36px 120px rgba(0,35,51,.16);
  }
  .card .icon { filter: drop-shadow(0 20px 28px rgba(0,35,51,.16)); }
  .pill {
    display: inline-block; background: #00e075; color: #002333;
    font: 400 78px/1 "Inter", sans-serif; padding: 30px 60px; border-radius: 9999px;
  }
  .card .num { font-size: 400px; }
</style>
</head>
<body>
  <div class="wall" id="wall">
    <div id="layer-content"></div>
    <img class="logo" src="../../Design/Merk/logos/logo_navy.png" alt="Eduface">
  </div>

<script>
const NAVY = '#002333', INK2 = '#cdd9de';
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
const svg=(inner,size=620)=>`<svg class="icon" width="${size}" height="${size}" viewBox="0 0 400 400">${inner}</svg>`;

/* Icoon 1: roos met pijl. Geen groen in het icoon. */
const target = svg(
  [170,115,60].map(r=>`<circle cx="200" cy="200" r="${r}" fill="#fff" stroke="${NAVY}" stroke-width="22"/>`).join('') +
  `<circle cx="200" cy="200" r="28" fill="${NAVY}"/>
   <line x1="206" y1="194" x2="338" y2="62" stroke="${NAVY}" stroke-width="20" stroke-linecap="round"/>
   <line x1="338" y1="62" x2="378" y2="62" stroke="${NAVY}" stroke-width="18" stroke-linecap="round"/>
   <line x1="338" y1="62" x2="338" y2="22" stroke="${NAVY}" stroke-width="18" stroke-linecap="round"/>`);

/* Icoon 5: papieren met klokje, ring voor 48,5% gevuld */
function clockBase(cx,cy,r,sw,progress){
  const [x1,y1]=polar(cx,cy,r,progress*360), [x0,y0]=polar(cx,cy,r,0);
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK2}" stroke-width="${sw}"/>
    <path d="M${x0},${y0} A${r},${r} 0 ${progress>.5?1:0} 1 ${x1},${y1}" fill="none" stroke="${NAVY}" stroke-width="${sw}"/>
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r*.62}" stroke="${NAVY}" stroke-width="${sw*.55}" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${cx+r*.34}" y2="${cy+r*.2}" stroke="${NAVY}" stroke-width="${sw*.55}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${sw*.5}" fill="${NAVY}"/>`;
}
const papers = svg(`
  <rect x="50" y="40" width="190" height="250" rx="22" fill="#fff" stroke="${NAVY}" stroke-width="16" transform="rotate(-7 145 165)"/>
  <rect x="100" y="70" width="190" height="250" rx="22" fill="#fff" stroke="${NAVY}" stroke-width="16"/>
  <line x1="136" y1="130" x2="254" y2="130" stroke="${INK2}" stroke-width="12" stroke-linecap="round"/>
  <line x1="136" y1="168" x2="254" y2="168" stroke="${INK2}" stroke-width="12" stroke-linecap="round"/>
  <line x1="136" y1="206" x2="214" y2="206" stroke="${INK2}" stroke-width="12" stroke-linecap="round"/>
  <circle cx="285" cy="290" r="92" fill="#fff"/>
  ${clockBase(285,290,72,20,.485)}`);

const card = (left, icon, num, label) => `
  <div class="card" style="left:${left}px">
    ${icon}
    <div class="num">${num}</div>
    <div class="pill">${label}</div>
  </div>`;

document.getElementById('layer-content').innerHTML =
  card(128,  target, '96%',   'grading accuracy') +
  card(1525, papers, '48.5%', 'less time spent grading');
</script>
</body>
</html>
