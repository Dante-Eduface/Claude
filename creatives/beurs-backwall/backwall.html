<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beurs backwall</title>
<style>
  /* Canvas: 1 px = 1 mm. Wand is 2954 x 2520 mm. Eerst focus op de quotes; de rest staat compact eronder. */
  @font-face { font-family: "League Spartan"; font-weight: 700; src: url("../../Design/Merk/fonts/LeagueSpartan-Bold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Design/Merk/fonts/Inter-Regular.ttf"); }
  :root { --w: 2954px; --h: 2520px; --navy: #002333; --gd: #007b54; --g: #00e075; --i7: #2c4a57; --i5: #5b7480; --i3: #a9bcc4; --i2: #cdd9de; --i50: #f3f7f8; --red: #b3261e; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  .wall {
    position: relative; width: var(--w); height: var(--h); overflow: hidden; color: var(--navy);
    background:
      radial-gradient(ellipse 80% 45% at 90% 52%, #f9f8f7 0%, rgba(249,248,247,0) 100%),
      linear-gradient(180deg, #dce7ee 0%, #e2edf1 20%, #ecf3f5 40%, #f4f6f6 55%, #eff3f3 70%, #e4edf1 90%, #dde8ee 100%);
  }
  .abs { position: absolute; }
  .logo { position: absolute; right: 128px; bottom: 128px; width: 420px; height: auto; }

  .h1 { position: absolute; left: 128px; top: 90px; font: 700 152px/.98 "League Spartan"; letter-spacing: -.025em; color: var(--navy); white-space: nowrap; }
  .h1 em { font-style: normal; color: var(--gd); }

  /* ---- QUOTES: een kaart per bron. Links het tool, rechts de quote(s) groot. ---- */
  .stack { position: absolute; left: 128px; top: 448px; width: 2698px; display: flex; flex-direction: column; gap: 28px; }
  .advrow { display: flex; gap: 59px; }
  .qg { position: relative; width: 100%; background: #fff; border-radius: 56px; padding: 56px 64px;
    box-shadow: 0 10px 28px rgba(0,35,51,.10), 0 50px 110px rgba(0,35,51,.20); }
  .qs { display: flex; flex-direction: column; gap: 56px; }
  .qone { display: flex; gap: 28px; align-items: flex-start; }
  .qm { font: 700 230px/.78 "League Spartan"; color: var(--red); width: 120px; flex: none; margin-top: 10px; }
  .qt { font: 400 96px/1.18 Inter; color: var(--navy); letter-spacing: -.005em; text-wrap: balance; }
  .qt mark { white-space: nowrap; background: rgba(179,38,30,.13); color: inherit; padding: 0 12px; margin: 0 -12px; border-radius: 14px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .who { font: 400 44px/1.2 Inter; color: var(--i5); margin-top: 20px; }

  /* ---- rest, compact ---- */
  .band { position: relative; width: 100%; height: 170px; border-radius: 56px; background: var(--red); padding: 0 52px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 12px 30px rgba(179,38,30,.28), 0 50px 110px rgba(0,35,51,.22); }
  .band .t { font: 700 76px/1 "League Spartan"; letter-spacing: -.015em; color: #fff; }
  .rl { display: flex; gap: 24px; }
  .rl div { height: 106px; padding: 0 40px 0 30px; border-radius: 30px; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 4px rgba(255,255,255,.4); display: flex; align-items: center; gap: 22px; font: 700 60px/1 "League Spartan"; letter-spacing: -.01em; color: #fff; white-space: nowrap; }
  .rl img { width: 62px; height: 62px; filter: brightness(0) invert(1); }

  .adv { position: relative; flex: none; width: 860px; height: 340px; padding: 36px 48px; border-radius: 56px; background: var(--navy); color: #fff;
    box-shadow: 0 14px 34px rgba(0,35,51,.28), 0 60px 130px rgba(0,35,51,.34); display: flex; flex-direction: column; justify-content: space-between; }
  .adv .it { align-self: flex-end; width: 120px; height: 120px; border-radius: 34px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; }
  .adv .a1 { font: 700 62px/1.02 "League Spartan"; letter-spacing: -.01em; }
  .adv .a1 span { color: var(--g); }

  .lms { position: absolute; left: 128px; top: 2278px; height: 114px; display: flex; align-items: center; gap: 52px; }
  .lms img { height: 62px; width: auto; filter: grayscale(1) contrast(.9); opacity: .5; }
  .lms .wm { font: 700 46px/1 "League Spartan"; letter-spacing: -.01em; color: var(--i5); opacity: .75; white-space: nowrap; }
  .lms .lab { position: absolute; left: 0; top: -58px; font: 400 36px/1 Inter; color: var(--i5); white-space: nowrap; }
</style>
</head>
<body>
  <div class="wall" id="wall">
    <div id="layer-content"></div>
    <img class="logo" src="../../Design/Merk/logos/logo_navy.png" alt="Eduface">
  </div>

<script>
const N='#002333', G='#00e075', W='#fff';
const L=(f)=>`assets/logos/${f}.svg`;
const sv=(inner,s=124)=>`<svg width="${s}" height="${s}" viewBox="0 0 400 400">${inner}</svg>`;

/* Quotes: bron Eduface case study 25-11-2026, licht bewerkt voor correct Engels. Functie anoniem. */
const platformIc=`<svg width="66" height="66" viewBox="0 0 46 46"><rect x="4" y="4" width="16" height="16" rx="4" fill="#2c4a57"/><rect x="26" y="4" width="16" height="16" rx="4" fill="#2c4a57" opacity=".55"/><rect x="4" y="26" width="16" height="16" rx="4" fill="#2c4a57" opacity=".55"/><rect x="26" y="26" width="16" height="16" rx="4" fill="#2c4a57"/></svg>`;
const q=(t,w)=>`<div class="qone"><div class="qm">\u201C</div><div><div class="qt">${t}</div><div class="who">${w}</div></div></div>`;
const R1='Head of academic innovation, private university', R2='AVP instructional design, US technical college';
const A=`<div class="qg"><div class="qs">`+
  q('We didn\u2019t find any platform that can mark and give feedback <mark>the way a teacher does.</mark>', R1)+
  q('At some point it gets generic: <mark>every student gets the same feedback.</mark>', R1)+
  q('You would have to prompt the agent <mark>every single time.</mark>', R2)+`</div></div>`;
const B='';

/* rest */
const band=`<div class="band"><div class="t">Not built for marking.</div><div class="rl"><div><img src="${L('openai')}">ChatGPT</div><div><img src="${L('googlegemini')}">Gemini</div><div><img src="${L('claude')}">Claude</div></div></div>`;
const icTeacher=sv(`<circle cx="150" cy="108" r="64" fill="none" stroke="${W}" stroke-width="30"/><path d="M36,340 C36,236 264,236 264,340" fill="none" stroke="${W}" stroke-width="30" stroke-linecap="round"/><circle cx="312" cy="294" r="62" fill="${G}"/><polyline points="282,294 304,316 342,270" fill="none" stroke="${N}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>`);
const icBubbles=sv(`<rect x="30" y="34" width="230" height="104" rx="38" fill="none" stroke="${W}" stroke-width="26"/><rect x="60" y="68" width="110" height="18" rx="9" fill="${W}"/><rect x="140" y="156" width="230" height="104" rx="38" fill="rgba(255,255,255,.14)" stroke="${W}" stroke-width="26"/><rect x="172" y="190" width="150" height="18" rx="9" fill="${W}"/><rect x="30" y="278" width="230" height="104" rx="38" fill="none" stroke="${W}" stroke-width="26"/><rect x="60" y="312" width="84" height="18" rx="9" fill="${G}"/>`);
const icSheets=sv(`<rect x="130" y="24" width="220" height="270" rx="30" fill="none" stroke="${W}" stroke-width="22" opacity=".4"/><rect x="90" y="64" width="220" height="270" rx="30" fill="none" stroke="${W}" stroke-width="22" opacity=".7"/><rect x="44" y="108" width="220" height="270" rx="30" fill="${N}" stroke="${W}" stroke-width="26"/>${[160,222,284].map(y=>`<polyline points="76,${y} 92,${y+16} 118,${y-14}" fill="none" stroke="${G}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="134" y="${y-8}" width="98" height="14" rx="7" fill="${W}"/>`).join('')}`);
const X=[128,1047,1966];
const ADV=[{ic:icTeacher,h:'Trained on how <span>teachers mark.</span>'},{ic:icBubbles,h:'Feedback <span>per student.</span>'},{ic:icSheets,h:'Set up <span>once.</span>'}];
const adv=ADV.map((r,i)=>`<div class="adv"><div class="it">${r.ic.replace('width="124" height="124"','width="90" height="90"')}</div><div class="a1">${r.h}</div></div>`).join('');
const lms=`<div class="lms"><div class="lab">Integrated with your LMS</div><img src="assets/logos/lms-canvas.png"><img src="assets/logos/lms-moodle.png"><img src="assets/logos/lms-blackboard.png"><img src="assets/logos/lms-brightspace.png"><div class="wm">itslearning</div><div class="wm">NEO LMS</div></div>`;

document.getElementById('layer-content').innerHTML =
 `<div class="h1">Generic AI doesn't grade<br>like a teacher. <em>Eduface does.</em></div><div class="stack">${A}${B}${band}<div class="advrow">${adv}</div></div>${lms}`;
</script>
</body>
</html>
