<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beurs backwall</title>
<style>
  /* Canvas: 1 px = 1 mm. Wand is 2954 x 2520 mm. */
  @font-face { font-family: "League Spartan"; font-weight: 700; src: url("../../Design/Merk/fonts/LeagueSpartan-Bold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Design/Merk/fonts/Inter-Regular.ttf"); }
  :root { --w: 2954px; --h: 2520px; --navy: #002333; --green-deep: #007b54; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  .wall {
    position: relative; width: var(--w); height: var(--h); overflow: hidden; color: var(--navy);
    background:
      radial-gradient(ellipse 80% 45% at 90% 52%, #f9f8f7 0%, rgba(249,248,247,0) 100%),
      linear-gradient(180deg, #dce7ee 0%, #e2edf1 20%, #ecf3f5 40%, #f4f6f6 55%, #eff3f3 70%, #e4edf1 90%, #dde8ee 100%);
  }
  .abs { position: absolute; }

  /* laag 1: logo rechtsonder, 420 mm breed, 128 mm marge */
  .logo { position: absolute; right: 128px; bottom: 128px; width: 420px; height: auto; }

  /* laag 2: stat-kaarten, compact in een kolom links. Wit, met twee kaarten eronder gestapeld. */
  .card {
    position: absolute; z-index: 0; left: 128px; width: 1040px; padding: 64px;
    background: #ffffff; border-radius: 40px;
    box-shadow:
      24px 24px 0 0 rgba(255,255,255,.66),
      48px 48px 0 0 rgba(255,255,255,.38),
      0 8px 24px rgba(0,35,51,.10),
      0 50px 110px rgba(0,35,51,.22);
  }

  .head { display: flex; align-items: center; gap: 32px; }
  .tile {
    flex: none; width: 148px; height: 148px; border-radius: 36px; background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(0,35,51,.28);
  }
  .lbl { font: 700 60px/1.05 "League Spartan", sans-serif; letter-spacing: -.01em; color: var(--navy); }
  .num { font: 700 280px/.78 "League Spartan", sans-serif; letter-spacing: -.02em; color: var(--green-deep); margin-top: 72px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="wall" id="wall">
    <div id="layer-content"></div>
    <img class="logo" src="../../Design/Merk/logos/logo_navy.png" alt="Eduface">
  </div>

<script>
const W = '#ffffff', W35 = 'rgba(255,255,255,.35)';
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
const svg=(inner,size=120)=>`<svg width="${size}" height="${size}" viewBox="0 0 400 400">${inner}</svg>`;

/* Icoon accuraatheid: roos met pijl, wit op navy tegel. */
const target = svg(
  [165,108,52].map(r=>`<circle cx="200" cy="200" r="${r}" fill="none" stroke="${W}" stroke-width="28"/>`).join('') +
  `<circle cx="200" cy="200" r="24" fill="${W}"/>
   <line x1="206" y1="194" x2="346" y2="54" stroke="${W}" stroke-width="26" stroke-linecap="round"/>
   <line x1="346" y1="54" x2="390" y2="54" stroke="${W}" stroke-width="22" stroke-linecap="round"/>
   <line x1="346" y1="54" x2="346" y2="10" stroke="${W}" stroke-width="22" stroke-linecap="round"/>`);

/* Icoon tijdwinst: klok (48,5% van de ring gevuld) met pijl omlaag, wit op navy tegel. */
const [cx, cy, r, sw, p] = [160, 220, 120, 34, .485];
const [x0,y0] = polar(cx,cy,r,0), [x1,y1] = polar(cx,cy,r,p*360);
const clockDown = svg(`
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${W35}" stroke-width="${sw}"/>
  <path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" fill="none" stroke="${W}" stroke-width="${sw}"/>
  <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r*.6}" stroke="${W}" stroke-width="22" stroke-linecap="round"/>
  <line x1="${cx}" y1="${cy}" x2="${cx+r*.36}" y2="${cy+r*.22}" stroke="${W}" stroke-width="22" stroke-linecap="round"/>
  <line x1="348" y1="40" x2="348" y2="190" stroke="${W}" stroke-width="30" stroke-linecap="round"/>
  <polyline points="302,142 348,190 394,142" fill="none" stroke="${W}" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>`);

const card = (top, icon, label, num) => `
  <div class="card" style="top:${top}px">
    <div class="head"><div class="tile">${icon}</div><div class="lbl">${label}</div></div>
    <div class="num">${num}</div>
  </div>`;

document.getElementById('layer-content').innerHTML =
  card(300, target,    'grading accuracy',        '96%') +
  card(940, clockDown, 'less time spent grading', '48.5%');
</script>
</body>
</html>
