<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fascia drukvariant</title>
<style>
  /* Fascia: 3020 x 350 mm inclusief 10 mm bleed rondom, 1 px = 1 mm. Achtergrond loopt door tot aan de rand. Geen groene stippen.
     Tekst en logo staan minstens 260 mm van links en rechts (200 vanaf de snijrand, plus 50 in de hoeken).
     De hoogte is 350 mm: 200 mm marge boven en onder is daar niet mogelijk, de inhoud staat verticaal gecentreerd. */
  @font-face { font-family: "League Spartan"; font-weight: 700; src: url("../../Design/Merk/fonts/LeagueSpartan-Bold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Design/Merk/fonts/Inter-Regular.ttf"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 3020px; height: 350px; overflow: hidden; }
  #f { position: relative; width: 3026px; height: 356px; overflow: hidden; color: #002333;
    background:
      radial-gradient(ellipse 80% 45% at 90% 52%, #f9f8f7 0%, rgba(249,248,247,0) 100%),
      linear-gradient(180deg, #dce7ee 0%, #e2edf1 20%, #ecf3f5 40%, #f4f6f6 55%, #eff3f3 70%, #e4edf1 90%, #dde8ee 100%); }
  .row { position: absolute; left: 300px; right: 300px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 72px; }
  .logo { height: 150px; width: auto; flex: none; }
  .h { font: 700 100px/1.04 "League Spartan"; letter-spacing: -.02em; white-space: nowrap; }
  .h span { color: #007b54; }
  .sep { width: 3px; height: 190px; background: rgba(0,35,51,.16); flex: none; }
  .stand { flex: none; text-align: left; }
  .stand .l { font: 400 44px/1 Inter; color: #5b7480; letter-spacing: .02em; }
  .stand .n { font: 700 150px/.95 "League Spartan"; letter-spacing: -.02em; margin-top: 10px; }
</style></head><body>
<div id="f">
  <div class="row">
    <img class="logo" src="../../Design/Merk/logos/logo_navy.png">
    <div class="sep"></div>
    <div class="h">Chatbots <span>don't</span> grade<br>like instructors.</div>
    <div class="sep"></div>
    <div class="stand"><div class="l">Stand</div><div class="n">C11</div></div>
  </div>
</div>
</body></html>
