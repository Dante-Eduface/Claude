      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because Ofqual's framework deliberately leaves room for that, and awarding organisations are at different stages of publishing formal guidance. Variation is expected, not a sign that one of them is getting it wrong."

    {
      "@type": "Question",
      "name": "What should I actually ask my awarding organisation, word for word?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Describe your specific workflow, including exactly where and how an assessor reviews and approves each grade, and ask directly whether that workflow meets their requirements. A specific question gets a more useful answer than a general one."
      }
    },
    {
      "@type": "Question",
      "name": "Should I get their answer in writing?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Not out of suspicion, but because a policy position needs to be something you can point back to later, not something you remember from a phone call."
      }
