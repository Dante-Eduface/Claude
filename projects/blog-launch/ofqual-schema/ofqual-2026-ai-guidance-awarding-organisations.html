      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Ofqual sets the overall regulatory principles, but individual awarding organisations have room to set their own specific rules within that framework, and real differences between them are expected. Always check directly with the ones you work with."

    {
      "@type": "Question",
      "name": "What has Ofqual said it will do next?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It has committed to continuing to gather evidence on how AI is used, and misused, in assessment, and to introduce further guidance as that evidence base develops. Current guidance is a current position, not a fixed endpoint."

    },
    {
      "@type": "Question",
      "name": "Which AI use cases are awarding organisations most comfortable with right now?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Generating assessment material, generating supporting content, and mapping qualifications against frameworks. Marking gets more caution because the stakes for an individual learner are direct and immediate."
      }

      "@type": "Question",
      "name": "What should a training provider do if its awarding organisation hasn't published a position on AI yet?",
