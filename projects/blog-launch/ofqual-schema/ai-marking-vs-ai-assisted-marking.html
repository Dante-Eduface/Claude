    {
      "@type": "Question",
      "name": "Is AI-assisted marking allowed, even though AI marking in the strict sense isn't?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Ofqual's concern is with AI acting as the sole marker. AI-assisted marking, where a human reviews and approves the final grade, is the model that fits within current rules."
      }
    },
    {
      "@type": "Question",
      "name": "How do I tell which one a tool actually does, given how loosely the terms get used?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ask what happens between the AI's output and the learner seeing a grade. A mandatory human approval step means AI-assisted marking. A grade that can be released without one means AI marking in the strict sense, whatever it's called."
      }
    },
    {
      "@type": "Question",
      "name": "Does using multiple AI passes to cross-check itself count as human oversight?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, not on its own. It can improve internal consistency, but the final decision still needs to be a human's, not the AI reconciling with itself."
      }
    },
    {
      "@type": "Question",
      "name": "What's the single most important question to ask a vendor?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Whether a grade can ever reach a learner without an assessor's explicit approval, under any setting or default. If the answer isn't a clean no, treat it as AI marking, not AI-assisted marking."
      }
    }
  ]
