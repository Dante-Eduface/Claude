      "name": "Does research show that tired assessors mark less reliably?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The evidence is mixed rather than settled. Some studies find little evidence of fatigue-driven drift in large operational settings, others flag it as a real risk under certain conditions. The safer conclusion is that reliability under load depends heavily on training, scheme design, and volume, not that fatigue is either a non-issue or an inevitable problem."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need a second full-time assessor to fix this?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not necessarily. A documented marking scheme and a part-time or occasional second reviewer who can step in on short notice covers most of the risk without the cost of a second full-time hire."
      }
    },
    {
      "@type": "Question",
      "name": "Can AI marking tools actually replace the need for a backup human assessor?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and they shouldn't try to. What they can do is make it much easier for a less familiar reviewer to step in during a gap, since they're working from a structured draft rather than starting cold."
      }
    },
    {
      "@type": "Question",
      "name": "What's the single most useful thing a two- or three-person team can do about this now?",
      "acceptedAnswer": {
        "@type": "Answer",
