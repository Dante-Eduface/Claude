    {
      "@type": "Question",
      "name": "Does the NSS matter at all for private training providers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only if you deliver qualifications through an institution that participates in it, which many private providers don't. Even where it does apply, it's a lagging, aggregate signal. Refunds and reviews are faster, more direct signals of the same underlying problem."
      }
    },
    {
      "@type": "Question",
      "name": "Why does slow marking hurt private providers more than universities, if the marking itself is equally slow?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the relationship is different. A private learner chose you directly, paid you directly, and is continuously evaluating that choice, which maps onto a much sharper expectation-versus-experience gap than a subsidised, multi-year university relationship."
      }
    },
    {
      "@type": "Question",
      "name": "What's the single most effective thing to fix, if I can't fix turnaround time immediately?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Communication. Proactively telling learners where things stand closes a real part of the dissatisfaction gap even before the delay itself is resolved."
      }
    },
    {
      "@type": "Question",
      "name": "Is responsiveness really more important than other service dimensions for private providers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Research applying the SERVQUAL framework to private higher education specifically has repeatedly found responsiveness carrying one of the largest gaps between expectation and experience, so it's a defensible priority, though it's worth checking whether that holds for your specific learners rather than assuming it universally."
