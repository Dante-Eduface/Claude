{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is it settled that AI grading disadvantages non-native English speakers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The research is genuinely mixed. Some studies find a measurable disadvantage, others find none, and the difference often depends on the specific model, its training data, and how bias was measured."
      }
    },
    {
      "@type": "Question",
      "name": "Why do studies disagree so much on this question?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because \"AI grading\" covers many different systems built and trained differently. A finding about one model on one dataset doesn't necessarily apply to a different tool."
      }
    },
    {
      "@type": "Question",
      "name": "What should we actually ask a vendor about this?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ask for evidence of testing across first-language groups against human-rated benchmarks, what proportion of training data was second-language or multilingual writing, and whether the grading approach separates argument quality from surface fluency rather than producing one holistic score."
      }
    },
    {
      "@type": "Question",
      "name": "Does human review help if a bias like this exists in the underlying model?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, provided the review is genuine rather than a formality. An assessor who can see the reasoning behind a grade, not just a final number, is positioned to catch a systematic pattern that a purely automated process would miss."
      }
    }
  ]
}
</script>
