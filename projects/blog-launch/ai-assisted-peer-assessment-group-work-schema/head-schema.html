    {
      "@type": "Question",
      "name": "Is social loafing in group work a real, well documented phenomenon, or just student complaining?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It is genuinely well documented, going back decades of social psychology research, and it has specifically been shown to occur in academic group projects, not just workplace teams."
      }
    },
    {
      "@type": "Question",
      "name": "What is the single biggest factor that reduces social loafing?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Identifiability, how clearly an individual's specific contribution can be distinguished from the group's collective output. When contribution is visible and attributable, effort goes up."
      }
    },
    {
      "@type": "Question",
      "name": "Does AI-assisted peer assessment replace the assessor's judgement about final marks?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It structures and surfaces peer input at scale, flagging patterns worth attention. The decision about what to do with a flagged discrepancy remains a human one."
      }
    },
    {
      "@type": "Question",
      "name": "Why does timing matter so much in peer assessment design?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because a single assessment at the end of a project functions as a retrospective judgement, not an ongoing accountability mechanism. Research on business student cohorts specifically found that early, repeated assessment points reduced free-riding more effectively than a single late one."
      }
    }
  ]
}
