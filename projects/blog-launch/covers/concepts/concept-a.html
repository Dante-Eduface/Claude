<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002333; --green:#00e075; --green-deep:#007b54;
    --ink-300:#a9bcc4; --white:#fff;
    --font-display:"League Spartan",sans-serif; --font-sans:"Inter",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  .cover{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:var(--navy); color:var(--white);
    font-family:var(--font-sans); padding:72px 80px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  /* motif: concentric arcs, top-right */
  .motif{position:absolute; top:-220px; right:-180px; width:620px; height:620px; opacity:.9}
  .eyebrow{
    font-size:18px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
    color:var(--green); display:flex; align-items:center; gap:14px; z-index:2;
  }
  .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
  .headline{
    z-index:2; max-width:820px;
    font-family:var(--font-display); font-weight:700; font-size:88px; line-height:.98;
    letter-spacing:-.02em;
  }
  .headline .hl{color:var(--green)}
  .footer{z-index:2; display:flex; align-items:center; justify-content:space-between}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.01em}
  .wordmark .cap{color:var(--green)}
  .pill{
    font-size:16px;font-weight:500;color:var(--ink-300);
    border:1px solid rgba(255,255,255,.18); border-radius:9999px; padding:9px 20px;
  }
</style>
</head>
<body>
  <div class="cover">
    <svg class="motif" viewBox="0 0 620 620" fill="none">
      <circle cx="310" cy="310" r="300" stroke="#00e075" stroke-opacity=".10" stroke-width="2"/>
      <circle cx="310" cy="310" r="230" stroke="#00e075" stroke-opacity=".16" stroke-width="2"/>
      <circle cx="310" cy="310" r="160" stroke="#00e075" stroke-opacity=".24" stroke-width="2"/>
      <circle cx="310" cy="310" r="92"  stroke="#00e075" stroke-opacity=".5"  stroke-width="2.5"/>
      <path d="M270 312 l28 30 l58 -74" stroke="#00e075" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="eyebrow"><span class="dot"></span>Eduface · Assessment</div>

    <h1 class="headline">How <span class="hl">accurate</span> is AI marking, really?</h1>

    <div class="footer">
      <div class="wordmark">eduface<span class="cap">.</span></div>
      <div class="pill">6 min read</div>
    </div>
  </div>
</body>
</html>
