<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:900px}body{display:flex;align-items:center;justify-content:center}svg{display:block}</style></head><body>
<!-- Moodle LTI: two interlocking rings (link) -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#002333"/>
  <ellipse cx="600" cy="742" rx="240" ry="34" fill="#001520"/>
  <!-- left ring white -->
  <circle cx="490" cy="450" r="150" fill="none" stroke="#ffffff" stroke-width="56"/>
  <!-- right ring green, overlapping -->
  <circle cx="710" cy="450" r="150" fill="none" stroke="#00d563" stroke-width="56"/>
  <!-- re-draw left arc over intersection for interlock illusion -->
  <path d="M490 300 A150 150 0 0 0 360 525" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
</svg></body></html>
