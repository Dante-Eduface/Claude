<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1200px;height:900px}body{display:flex;align-items:center;justify-content:center}svg{display:block}</style></head><body>
<!-- strategy paradox: converging start, diverging arrows -->
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#002333"/>
  <ellipse cx="600" cy="742" rx="220" ry="34" fill="#001520"/>
  <!-- shared start node -->
  <circle cx="360" cy="450" r="30" fill="#ffffff"/>
  <!-- up-diverging green arrow -->
  <g stroke="#00e075" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 440 Q620 380 840 250"/>
  </g>
  <path d="M812 232 L856 238 L846 282 Z" fill="#00e075" stroke="#00e075" stroke-width="12" stroke-linejoin="round"/>
  <!-- down-diverging white arrow -->
  <g stroke="#e8eef2" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 460 Q620 520 840 650"/>
  </g>
  <path d="M812 668 L856 662 L846 618 Z" fill="#e8eef2" stroke="#e8eef2" stroke-width="12" stroke-linejoin="round"/>
</svg></body></html>
