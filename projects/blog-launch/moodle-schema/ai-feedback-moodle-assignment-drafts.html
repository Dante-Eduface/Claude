    {
      "@type": "Question",
      "name": "What is the Feedback activity in Moodle?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The Feedback module in Moodle is a survey tool for collecting responses from students, such as module evaluations. It is not used for giving students comments on their work. Comments on submitted work are given through the Assignment activity."
      }
    },
    {
      "@type": "Question",
      "name": "How do you give feedback on a draft in Moodle?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Either create a separate unmarked Assignment activity for the draft with its own deadline, or enable Require students to click the submit button on a single assignment so students work in a draft state that staff can comment on. The two assignment approach is clearer for students and keeps the gradebook simpler."
      }
    },
    {
      "@type": "Question",
      "name": "Can AI give formative feedback on Moodle assignments?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. An LTI 1.3 tool such as the Eduface Feedback Tool drafts rubric aligned comments on each submission. The lecturer edits and releases them, so nothing reaches a student unreviewed. No grade is involved unless the assignment is configured summatively."
      }
    },
    {
      "@type": "Question",
      "name": "Does formative feedback need to be graded?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and grading it usually undermines it. Once a mark is attached, students attend to the mark rather than the comments. Set the draft activity so it does not contribute to the course total."
      }
    },
    {
      "@type": "Question",
      "name": "Which feedback style should we use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Reflective and Socratic builds the student's own judgement and works well on early drafts. Constructive and direct is faster to act on and suits the run up to a deadline. Went well and needs improvement maps onto most institutional templates. Supportive and encouraging suits first year cohorts and students at risk of disengaging."
      }
    },
    {
      "@type": "Question",
      "name": "Does the feedback tool pass a grade back to the Moodle Gradebook?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only if you configure the assignment summatively. Used formatively it writes no grade, which is usually what you want on a draft."
