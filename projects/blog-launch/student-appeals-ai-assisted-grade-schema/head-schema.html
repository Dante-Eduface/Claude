  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Do students have a legal right to appeal an AI-assisted grade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Where a grade is based solely on automated processing with a significant effect, GDPR Article 22 gives a right to human intervention, to express a view, and to contest the decision. Where a genuine human already reviewed and approved the grade before release, as our companion piece on human-in-the-loop marking describes, the decision typically isn't \"solely automated\" in the first place, though normal institutional appeal processes still apply."
      }
    },
    {
      "@type": "Question",
      "name": "Does the UK's approach to this differ from the EU's?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The UK's Data (Use and Access) Act 2025 changed the default position on solely automated decisions, moving toward permitted-by-default with safeguards, while GDPR Article 22 in the EU keeps its original, more restrictive default. Institutions operating in both need to track both."
      }
    },
    {
      "@type": "Question",
      "name": "What's the single most important thing to have ready before an appeal happens?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A retrievable record showing what the AI proposed, what the human assessor did with it, and that the review happened before the grade was released, not reconstructed evidence produced after the fact."
      }
    },
    {
      "@type": "Question",
      "name": "Does a successful appeal mean the AI grading system failed?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not necessarily. A dispute mechanism that occasionally revises a grade is doing its job. The more useful question is whether the underlying review process is producing enough of a trail to handle that dispute quickly and fairly when it happens."
      }
    }
  ]
}
