    {
      "@type": "Question",
      "name": "Is IRAC structure a reliable proxy for a good grade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It is necessary organisation, not sufficient quality. A textbook-perfect structure can still contain weak or superficial legal analysis, and grading needs to test both separately."
      }
    },
    {
      "@type": "Question",
      "name": "What is the hardest part of a law essay for AI to grade well?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The application section specifically, where a general rule meets ambiguous facts and genuine legal judgement is required, particularly evaluating whether a student engaged with the strongest counter-argument rather than only the position they are advocating for."
      }
    },
    {
      "@type": "Question",
      "name": "Can AI reliably check whether cited case law is used correctly?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Reasonably well for checking that a cited case or statute actually supports the proposition claimed, particularly for well established, settled areas of law. It is a genuinely useful, checkable criterion distinct from evaluating the quality of the argument itself."
      }
    },
    {
      "@type": "Question",
      "name": "Should structure and substance be graded as one combined score?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Keeping them as separate criteria produces more useful feedback and avoids a strong structure masking weak reasoning, or the reverse."
      }
    }
