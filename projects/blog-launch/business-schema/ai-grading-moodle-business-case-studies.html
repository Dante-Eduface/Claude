  "mainEntity": [
    {
      "@type": "Question",
      "name": "Do I need to restructure our existing Moodle assignments before adding AI grading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not necessarily restructure, but you do need your learning outcomes explicitly mapped to each assignment rather than implicit. If that mapping already exists, the setup work is mostly about confirming your AI grading tool reads and reports against it correctly."
      }
    },
    {
      "@type": "Question",
      "name": "Does per-outcome grading take longer to review than a single overall score?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Initially, slightly, since there's more detail to look at. Most assessors find it faster overall once they're used to it, because they're confirming specific, checkable reasoning rather than trying to reverse-engineer why a single number seems roughly right."
      }
    },
    {
      "@type": "Question",
      "name": "Is this relevant if we mostly use Moodle quizzes rather than case study assignments?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Less so. Outcome mapping matters most for open-ended, multi-outcome assessment types like case studies and reports. A short-answer quiz question is usually testing one thing at a time already."
      }
    },
    {
      "@type": "Question",
      "name": "What's the single biggest setup mistake to avoid?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Connecting AI grading to an assignment that has no explicit learning outcome mapping and treating the resulting overall score as if it were outcome-based. It will produce a plausible-looking number that isn't actually measuring what the qualification requires."
      }
    }
  ]
}
