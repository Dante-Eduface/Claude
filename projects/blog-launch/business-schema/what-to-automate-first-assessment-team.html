    {
      "@type": "Question",
      "name": "What's usually the actual bottleneck in a small assessment team's marking process?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most often, the first read: the initial pass where an assessor absorbs a submission and forms a judgement from scratch. It's the step that scales worst and benefits least from simply working harder."
      }
    },
    {
      "@type": "Question",
      "name": "Why does automating notifications or grade release rarely help much?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because those steps usually aren't the bottleneck. Speeding up a non-constraint step just means work piles up faster in front of the real one, without actually reducing how long a learner waits."
      }
    },
    {
      "@type": "Question",
      "name": "How do I figure out where my own bottleneck actually is?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Time your process roughly for a week: compare how long the first read of a submission takes against everything that happens afterward. The step that dominates the total time is almost certainly your constraint."
      }
    },
    {
      "@type": "Question",
      "name": "Does the bottleneck stay in the same place forever once I fix it?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Goldratt's framework treats this as a cycle: once you address one constraint, another step becomes the limiting one, and it's worth revisiting the exercise periodically rather than treating it as solved permanently."
      }
    }
  ]
}
</script>
