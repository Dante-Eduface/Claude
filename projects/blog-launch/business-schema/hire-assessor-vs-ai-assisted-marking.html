    {
      "@type": "Question",
      "name": "Is AI-assisted marking always the right first move for a small provider?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not always, but it's usually the lower-risk one to try first, since it's faster to implement and easier to scale back than a hire. If your actual problem is a gap in specialist expertise rather than throughput, a hire may be the more direct fix."
      }
    },
    {
      "@type": "Question",
      "name": "How do I know if my volume problem is throughput or expertise?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ask whether your existing assessors could clear the backlog if they simply had more hours in the day. If yes, it's a throughput problem. If the honest answer is that nobody on the team is confident marking that specific subject well, it's an expertise gap, and a tool won't close that on its own."
      }
    },
    {
      "@type": "Question",
      "name": "Why does reversibility matter so much in this decision?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because demand for training providers is often seasonal or lumpy. A choice you can scale back easily if volume drops carries much less risk than one, like a permanent hire, that's genuinely hard to reverse."
      }
    },
    {
      "@type": "Question",
      "name": "Do most providers end up choosing one option over the other permanently?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not usually. Many end up using AI-assisted marking to handle throughput immediately, and add a hire later once volume growth looks durable rather than seasonal."
      }
    }
  ]
}
