      "@type": "Question",
      "name": "Are complaints the biggest risk from slow marking?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not necessarily. The learners who complain are telling you something you can act on. The ones who quietly leave, or quietly disengage without ever complaining, are often the bigger long-term risk, precisely because you don't see them."
      }
    },
    {
      "@type": "Question",
      "name": "What's a practical way to catch the \"silent\" version of dissatisfaction?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Track completion rates, re-enrolment rates, and referral rates, and treat a dip in any of them following a slow marking period as a signal worth investigating, not just background noise."
      }
    },
    {
      "@type": "Question",
      "name": "What should we actually ask when a learner complains about turnaround time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ask what they need the result for and by when. The stated complaint is often about the delay itself, but the real urgency is usually a specific downstream deadline the learner is tracking closely."
      }
    },
    {
      "@type": "Question",
      "name": "Does this framework apply differently to business qualifications than other subjects?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The underlying pattern is general, but business and management learners are often embedded in professional networks where quiet dissatisfaction spreads through word of mouth particularly effectively, which raises the stakes of missing the silent responses."
      }
