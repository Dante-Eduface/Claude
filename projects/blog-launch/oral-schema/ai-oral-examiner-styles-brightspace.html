    {
      "@type": "Question",
      "name": "What are the four AI examiner dialogue styles available for oral exams?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Socratic, Confrontational, Supportive, and Formal. Each is suited to a different assessment purpose, from low-pressure rehearsal through to a high-stakes summative viva, and the right choice depends on what the specific assessment is meant to measure."
      }
    },
    {
      "@type": "Question",
      "name": "Does a harsher dialogue style produce a harsher grade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not directly. The dialogue style affects how questions are asked and how much pressure a student experiences during the conversation. The grade itself is applied against the lecturer's own criteria, reviewed and approved before release, regardless of which style was used to conduct the exam."
      }
    },
    {
      "@type": "Question",
      "name": "Which dialogue style should we use for a standard summative viva?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Formal is usually the safest default for high-stakes, standard assessment, since it keeps tone itself out of the equation. Confrontational is better reserved for assessments specifically designed to test performance under pressure."
      }
    },
    {
      "@type": "Question",
      "name": "Can we change the dialogue style between different assessments?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. It's set per session, so a lecturer can use a Supportive or Socratic style for formative or practice contexts and switch to Formal or Confrontational for a specific summative assessment designed to test resilience."
      }
    },
    {
      "@type": "Question",
      "name": "Do we need separate setup for each dialogue style in Brightspace?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. All four styles are available within the same LTI 1.3 integration. A lecturer selects the style as part of configuring each session."
      }
    }
