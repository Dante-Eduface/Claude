    {
      "@type": "Question",
      "name": "Are oral exams actually AI-proof?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "They're much harder to outsource to AI than a written submission, which is why interest in them has grown sharply. But \"oral\" alone doesn't guarantee fairness. An oral exam still needs the same consistency safeguards, explicit criteria applied identically to every student, that written assessment has always needed, which is what Canvas's Oral Exam mode is built to provide."
      }
    },
    {
      "@type": "Question",
      "name": "Does AI replace the human examiner in Oral Exam mode?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It applies the examiner's own rubric consistently and drafts a criterion-by-criterion grade, but a lecturer reviews and approves every result before it's released, exactly the human-in-the-loop model our companion pieces on Ofqual compliance describe."
      }
    },
    {
      "@type": "Question",
      "name": "How is this different from the Practice Viva mode described for Moodle?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Practice Viva is ungraded rehearsal students can repeat as many times as they like, covered in our companion piece on Moodle. Oral Exam mode is the graded assessment itself, applied once, with the result syncing to the gradebook after lecturer approval."
      }
    },
    {
      "@type": "Question",
      "name": "Do we need a Canvas-specific plugin to use this?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It connects through LTI 1.3, the same standard used across Eduface's other Canvas integrations, so there's no separate installation."
      }
    },
    {
      "@type": "Question",
      "name": "Why does examiner consistency matter more for business and management vivas specifically?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Business and management programmes tend to use oral formats more heavily than most disciplines, which means more opportunities across a programme for examiner variability to affect outcomes if it isn't addressed structurally."
      }
    }
  ]
