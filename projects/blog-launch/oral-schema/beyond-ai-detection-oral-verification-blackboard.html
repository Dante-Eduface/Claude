      "@type": "Question",
      "name": "Why don't AI detectors work reliably for catching AI-generated submissions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the statistical gap between AI-generated and human-written text keeps narrowing as models improve, and detectors have to trade off false positives against false negatives with no reliable way to eliminate both. Published false positive rates vary widely by tool and study, but the consistent finding is that no detector is accurate enough to be used as the sole basis for an accusation."
      }
    },
    {
      "@type": "Question",
      "name": "Does Integrity Check mode work the same way in Blackboard Learn and Blackboard Ultra?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The LTI 1.3 integration runs across both interfaces, which is useful for institutions currently migrating between them."
      }
    },
    {
      "@type": "Question",
      "name": "Is this the same as running an AI detector on a submission?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and that's the whole point. It doesn't estimate whether text was AI-generated. It generates specific follow-up questions from the submission itself and checks whether the student can account for their own reasoning."
      }
    },
    {
      "@type": "Question",
      "name": "What happens to the outcome of an Integrity Check session?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The full transcript is returned to the lecturer. There's no automated flag or score that triggers a process on its own, the decision about what to do next stays with a human."
      }
    },
    {
      "@type": "Question",
      "name": "Why does this work better than a plagiarism or AI detection score?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because it's based on a well established memory effect: people recall and can elaborate on information they generated themselves far better than information they merely read or copied, which makes genuine authorship easy to demonstrate and difficult to fake."
      }
    }
