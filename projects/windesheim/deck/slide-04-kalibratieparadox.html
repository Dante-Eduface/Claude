<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Slide 4 — Visitatie</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002333; --green:#00E075; --green-deep:#007B54;
    --ink-500:#5b7480; --ink-200:#cdd9de; --ink-100:#e7eef0;
    --amber:#E07B00; --amber-tint:#FDF0DF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:'Inter',sans-serif}

  .slide{width:1920px;height:1080px;background:#fff;position:relative;overflow:hidden;
         padding:96px 120px 80px;display:flex;flex-direction:column}

  .title{font-family:'League Spartan',sans-serif;font-weight:700;font-size:96px;line-height:1;
         letter-spacing:-.02em;color:var(--navy);text-align:center}

  .tl{flex:1;display:flex;flex-direction:column;justify-content:center}

  .axis{height:4px;background:var(--ink-100);display:grid;grid-template-columns:repeat(4,1fr);
        gap:72px;align-items:center}
  .yr{display:flex;flex-direction:column;align-items:center;position:relative}
  .dot{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px var(--navy)}
  .yrlabel{position:absolute;bottom:34px;font-family:'League Spartan',sans-serif;font-weight:700;
           font-size:34px;color:var(--ink-500)}

  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:72px}
  .cell{display:flex;flex-direction:column;align-items:center;text-align:center}
  .stem{width:3px;height:56px;background:var(--ink-200)}
  .ic{width:148px;height:148px;border-radius:36px;background:var(--amber-tint);display:flex;
      align-items:center;justify-content:center;margin-top:8px}
  .ic svg{width:74px;height:74px;fill:none;stroke:var(--amber);stroke-width:2;
          stroke-linecap:round;stroke-linejoin:round}
  .lbl{font-family:'League Spartan',sans-serif;font-weight:700;font-size:46px;line-height:1.1;
       color:var(--navy);margin-top:26px}

  .foot{padding-top:28px;border-top:1px solid var(--ink-100);
        display:flex;align-items:center;justify-content:space-between;gap:64px}
  .quote{font-size:38px;line-height:1.3;color:var(--navy);font-weight:500;max-width:1320px}
  .src{font-size:23px;color:var(--ink-500);margin-top:10px;font-weight:400}
  .logos{display:flex;align-items:center;gap:40px;flex:none}
  .logos img{height:46px;width:auto;display:block}
  .logos img.wh{height:60px}
  .logos .div{width:1px;height:52px;background:var(--ink-200)}
  .pagenum{position:absolute;bottom:32px;right:120px;font-size:23px;color:var(--ink-200)}
</style>
</head>
<body>
  <div class="slide">
    <h1 class="title">Visitatie</h1>

    <div class="tl">
      <div class="axis">
        <div class="yr"><div class="dot"></div><div class="yrlabel">2021</div></div>
        <div class="yr"><div class="dot"></div><div class="yrlabel">2022</div></div>
        <div class="yr"><div class="dot"></div><div class="yrlabel">2024</div></div>
        <div class="yr"><div class="dot"></div><div class="yrlabel">2025</div></div>
      </div>

      <div class="row">
        <div class="cell">
          <div class="stem"></div>
          <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 6h12M3 12h18M3 18h8"/></svg></div>
          <div class="lbl">Verschillen</div>
        </div>
        <div class="cell">
          <div class="stem"></div>
          <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20V8"/></svg></div>
          <div class="lbl">Variatie</div>
        </div>
        <div class="cell">
          <div class="stem"></div>
          <div class="ic"><svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
          <div class="lbl">Wisselend ingevuld</div>
        </div>
        <div class="cell">
          <div class="stem"></div>
          <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/><path d="m19 4-14 16"/></svg></div>
          <div class="lbl">Cijfer ≠ feedback</div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div>
        <div class="quote">“De narratieve feedback is niet altijd helemaal passend bij de rubric.”</div>
        <div class="src">NQA, Ad E-commerce Windesheim, visitatie november 2024, p. 24. Zelfde patroon in vier andere visitatierapporten, 2021-2025.</div>
      </div>
      <div class="logos">
        <img src="logo_navy.png" alt="Eduface">
        <div class="div"></div>
        <img class="wh" src="windesheim.svg" alt="Hogeschool Windesheim">
      </div>
    </div>

    <div class="pagenum">4</div>
  </div>
</body>
</html>
