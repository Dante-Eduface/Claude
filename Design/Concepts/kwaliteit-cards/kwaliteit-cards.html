<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kwaliteit cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002333;
    --muted: #5b7480;
    --surface: #f3f7f8;
    --border: #e7eef0;
    --green-deep: #007b54;
    --shadow-md: 0 4px 16px rgba(0, 35, 51, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 35, 51, 0.10);
    --r-card: 20px;
    --pad: 24px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 64px 16px;
    background: var(--surface); color: var(--navy);
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }

  .grid {
    width: 100%; max-width: 1080px;
    display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }

  .card {
    display: flex; flex-direction: column; padding: var(--pad);
    background: #fff; border-radius: var(--r-card); box-shadow: var(--shadow-md);
    transition: box-shadow .2s, transform .2s;
  }
  .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

  .icon {
    width: 48px; height: 48px; display: grid; place-items: center;
    border-radius: 12px; background: var(--surface); color: var(--navy);
  }

  h3 {
    margin-top: 24px; font-family: "League Spartan", Inter, sans-serif;
    font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;
    text-wrap: balance;
  }

  /* Ingezet vlak, zoals in de referentie. Geneste hoek: 20 - 24 < 0, dus vaste 12 */
  .proof {
    margin-top: 16px; padding: 16px; border-radius: 12px; background: var(--surface);
    font-size: 15px; line-height: 1.5; color: var(--navy);
    flex: 1;
  }

  .tag {
    margin-top: 16px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px; border: 1px solid var(--border);
    font-size: 13px; font-weight: 500; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="grid">

    <article class="card">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      </div>
      <h3>Elk cijfer is navolgbaar</h3>
      <p class="proof">Onderbouwing per rubriccriterium.</p>
      <span class="tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/></svg>
        Audit trail volgens de AI Act
      </span>
    </article>

    <article class="card">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>
      </div>
      <h3>Beoordelaars oordelen consistent</h3>
      <p class="proof">Zie in één overzicht wie afwijkt van het team.</p>
    </article>

    <article class="card">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <h3>De examencommissie borgt de kwaliteit</h3>
      <p class="proof">Elke onderbouwing direct in te zien.</p>
    </article>

  </div>
</body>
</html>
