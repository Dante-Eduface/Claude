<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Badge self-hosted</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#d9e2e6;padding:32px;width:1240px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.stage{border-radius:16px;padding:40px;display:flex;align-items:center;justify-content:center;gap:40px;min-height:300px}
.light{background:#fff}.dark{background:#002333}
.lab{font-size:13px;font-weight:600;color:#5b7480;margin:0 0 8px 4px}
/* A: kaart, zoals de folder */
.a{display:flex;align-items:center;gap:16px;border-radius:16px;padding:16px 22px 16px 16px;border:1px solid #c9f1dd;background:#e9fbf2}
.dark .a{background:rgba(0,224,117,.08);border-color:rgba(0,224,117,.45)}
.a .t{width:64px;height:64px;border-radius:14px;background:#fff;border:1px solid #c9f1dd;display:grid;place-items:center}
.dark .a .t{background:#002333;border-color:rgba(0,224,117,.45)}
.a b{display:block;font-family:"League Spartan";font-size:24px;line-height:1;color:#002333}
.a span{display:block;font-size:13.5px;color:#2c4a57;margin-top:5px}
.dark .a b{color:#fff}.dark .a span{color:rgba(255,255,255,.72)}
/* B: zegel, maar in huisstijl */
.b{width:220px;height:220px}
</style></head><body>

<circle cx="37" cy="35.5" r="2" fill="#002333"/><path d="M37 36.5v3" stroke="#002333" stroke-width="2" stroke-linecap="round"/></svg></span><div><b>Self-hosted</b><span>Draait op jullie eigen infrastructuur</span></div></div></div>
